# WeatherPower Live on a cloud server: `docker compose up -d --build` (see CLOUD_STREAM.md).
services:
  stream:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Keeps WeBot's free voice model (~300 MB) between rebuilds.
      TTS_CACHE_DIR: /app/data/tts-cache
      # Public WeBot status page on its own read-only listener (only that page and its JSON).
      PUBLIC_STATUS_PORT: "8080"
    volumes:
      - ./data:/app/data
      - ./cards:/app/cards
    # Live Control is only reachable from the server itself; use Tailscale or an SSH tunnel to open it
    # (CLOUD_STREAM.md). Don't publish it on the open internet: it's plain http.
    # LIVE_CONTROL_BIND in .env: 127.0.0.1 (default, SSH tunnel) or the server's Tailscale IP (100.x.y.z).
    ports:
      - "${LIVE_CONTROL_BIND:-127.0.0.1}:8899:8899"
      # WeBot status page for viewers: http://<server IP>/ (STATUS_PUBLIC_PORT in .env to change 80).
      - "${STATUS_PUBLIC_PORT:-80}:8080"
    # Leave the server headroom (hosts suspend VMs that run flat out): at most STREAM_CPUS cores.
    cpus: ${STREAM_CPUS:-3}
    shm_size: 2gb
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
