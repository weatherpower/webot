<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a10">
  <title>WeatherPower Warning Center</title>
  <meta name="description" content="Live U.S. weather warnings with real-time radar, warning cards, and warning video shorts from WeatherPower.">
  <link rel="icon" type="image/png" href="/warningcenter/favicon.ico">
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    @font-face { font-family: "WP Display"; src: url("/warningcenter/public/assets/fonts/oswald-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
    @font-face { font-family: "WP Sans"; src: url("/warningcenter/public/assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: "WP Mono"; src: url("/warningcenter/public/assets/fonts/ibm-plex-mono-600-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
    :root {
      --bg: #070a10; --panel: #0d121b; --panel-2: #121926; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
      --text: #eef2f8; --muted: #8e99ab; --dim: #5d6879; --live: #34e07a;
      --rail: 460px; --top: 60px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "WP Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .mono { font-family: "WP Mono", ui-monospace, monospace; }

    /* ---------- top bar ---------- */
    .top { position: fixed; inset: 0 0 auto 0; height: var(--top); display: flex; align-items: center; gap: 16px; padding: 0 16px; background: rgba(7,10,16,.96); border-bottom: 1px solid var(--line); z-index: 30; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; flex: none; }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    .brand b { font-family: "WP Display"; font-size: 21px; letter-spacing: .04em; font-weight: 700; line-height: 1; }
    .brand small { display: block; font-family: "WP Mono"; font-size: 10px; letter-spacing: .18em; color: var(--muted); margin-top: 3px; }
    .live { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 999px; font-family: "WP Mono"; font-size: 11px; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
    .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(52,224,122,.6); animation: pulse 2s infinite; }
    .live.stale i { background: #f2b33d; animation: none; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(52,224,122,0); } 100% { box-shadow: 0 0 0 0 rgba(52,224,122,0); } }
    .search { flex: 1; max-width: 520px; margin-left: auto; position: relative; }
    .search input { width: 100%; height: 38px; padding: 0 14px 0 38px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; outline: none; }
    .search input:focus { border-color: rgba(255,255,255,.35); }
    .search svg { position: absolute; left: 12px; top: 11px; color: var(--muted); }
    .tally { display: flex; gap: 6px; flex: none; }
    .tally span { display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 4px 8px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
    .tally b { font-family: "WP Display"; font-size: 18px; line-height: 1.1; }
    .tally small { font-family: "WP Mono"; font-size: 9px; letter-spacing: .12em; color: var(--muted); }

    /* ---------- breaking banner ---------- */
    .breaking { position: fixed; top: calc(var(--top) + 10px); left: 50%; transform: translate(-50%, -160%); z-index: 40; display: flex; align-items: stretch; max-width: min(820px, calc(100vw - 24px)); border-radius: 12px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.55); transition: transform .45s cubic-bezier(.2,.9,.3,1.2); border: 0; padding: 0; text-align: left; background: none; }
    .breaking:not(.show) { visibility: hidden; transition: transform .45s, visibility 0s .45s; }
    .breaking.show { transform: translate(-50%, 0); }
    .breaking .tag { padding: 12px 14px; background: #fff; color: #000; font-family: "WP Display"; font-weight: 700; letter-spacing: .08em; display: flex; align-items: center; }
    .breaking .msg { padding: 10px 16px; background: var(--b, #e40000); color: #fff; }
    .breaking .msg b { display: block; font-family: "WP Display"; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
    .breaking .msg span { font-size: 13px; opacity: .9; }

    /* ---------- layout ---------- */
    .stage { position: fixed; top: var(--top); left: 0; right: var(--rail); bottom: 0; }
    #map { position: absolute; inset: 0; background: #0b1018; }
    .rail { position: fixed; top: var(--top); right: 0; bottom: 0; width: var(--rail); display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); z-index: 10; }

    /* map overlays */
    .tools { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 70px); z-index: 5; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: rgba(10,14,22,.88); backdrop-filter: blur(8px); font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
    .chip[aria-pressed="true"] { color: #fff; border-color: rgba(255,255,255,.4); background: rgba(30,38,54,.95); }
    .chip .dot { width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
    .timeline { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 12px; background: rgba(10,14,22,.9); border: 1px solid var(--line-2); backdrop-filter: blur(8px); z-index: 5; }
    .timeline button { width: 34px; height: 34px; border-radius: 8px; border: 0; background: #fff; color: #000; display: grid; place-items: center; }
    .timeline .tl-time { font-family: "WP Mono"; font-size: 13px; min-width: 112px; }
    .timeline .tl-track { display: flex; gap: 3px; }
    .timeline .tl-track i { width: 10px; height: 18px; border-radius: 3px; background: rgba(255,255,255,.14); }
    .timeline .tl-track i.on { background: #fff; }
    .legend { position: absolute; right: 12px; bottom: 30px; width: 260px; padding: 10px 12px; border-radius: 12px; background: rgba(10,14,22,.9); border: 1px solid var(--line-2); z-index: 5; }
    .legend .lt { display: flex; justify-content: space-between; font-family: "WP Mono"; font-size: 10px; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
    .legend .lb { height: 10px; border-radius: 5px; }
    .legend .ll { display: flex; justify-content: space-between; font-family: "WP Mono"; font-size: 9px; color: var(--dim); margin-top: 4px; }
    .picker { position: absolute; z-index: 8; min-width: 260px; max-width: 320px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.6); overflow: hidden; }
    .picker header { padding: 8px 12px; font-family: "WP Mono"; font-size: 10px; letter-spacing: .12em; color: var(--muted); border-bottom: 1px solid var(--line); }
    .picker button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 10px 12px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--line); }
    .picker button:hover { background: var(--panel-2); }
    .picker i { width: 6px; align-self: stretch; border-radius: 3px; background: var(--c); }
    .picker b { display: block; font-size: 13px; }
    .picker span span { font-size: 11px; color: var(--muted); }

    /* rail */
    .tabs { display: flex; gap: 2px; padding: 10px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
    .tabs button { flex: none; padding: 10px 12px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 13px; border-bottom: 2px solid transparent; }
    .tabs button[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
    .tabs button em { font-style: normal; font-family: "WP Mono"; font-size: 11px; color: var(--dim); margin-left: 4px; }
    .list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .row { --c: #888; display: grid; grid-template-columns: 6px 1fr 112px; border-radius: 12px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line); text-align: left; padding: 0; transition: border-color .15s; flex: none; }
    .row:hover { border-color: rgba(255,255,255,.25); }
    .row.sel { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
    .row .bar { background: var(--c); }
    .row .body { padding: 10px 12px; min-width: 0; display: block; }
    .row .ev { display: flex; align-items: center; gap: 7px; font-family: "WP Display"; font-size: 17px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .ev svg { color: var(--c); flex: none; }
    .row .area { display: block; font-size: 12.5px; color: #c7cfdb; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; font-family: "WP Mono"; font-size: 10.5px; color: var(--muted); }
    .tagp { padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,.08); color: #dfe5ee; letter-spacing: .06em; }
    .tagp.hot { background: #fff; color: #000; }
    .tagp.new { background: var(--c); color: #000; }
    .tagp.vid { background: #ff2d55; color: #fff; }
    .row .thumb { position: relative; background: #000 center/cover no-repeat; min-height: 70px; }
    .row .thumb .pend { position: absolute; inset: 0; display: grid; place-items: center; font-family: "WP Mono"; font-size: 9px; color: var(--dim); background: #0a0e15; }
    .hero { --c: #e40000; border-radius: 14px; overflow: hidden; border: 1px solid var(--c); background: var(--panel-2); text-align: left; padding: 0; flex: none; }
    .hero img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; }
    .hero .cap { padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .hero .cap b { font-family: "WP Display"; font-size: 19px; text-transform: uppercase; }
    .hero .cap span { font-family: "WP Mono"; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .section-label { font-family: "WP Mono"; font-size: 10px; letter-spacing: .14em; color: var(--dim); padding: 6px 2px 0; }
    .shorts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
    .short-tile { position: relative; aspect-ratio: 9/16; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-2); background: #000 center/cover no-repeat; padding: 0; }
    .short-tile span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 8px; font-family: "WP Display"; font-size: 13px; text-transform: uppercase; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
    .short-tile::after { content: "▶"; position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; font-size: 11px; }
    .fsearch { display: flex; gap: 8px; flex: none; }
    .fsearch input { flex: 1; height: 38px; padding: 0 12px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); font-weight: 700; font-size: 13px; text-decoration: none; color: #fff; }
    .btn.primary { background: #fff; color: #000; border-color: #fff; }
    .btn.red { background: #ff2d55; border-color: #ff2d55; color: #fff; }
    .btn[disabled] { opacity: .55; cursor: progress; }
    .foot { flex: none; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); line-height: 1.45; }
    .foot b { color: #f2b33d; font-weight: 700; }

    /* detail */
    .detail { display: none; flex-direction: column; flex: 1; overflow-y: auto; }
    .rail.has-detail .detail { display: flex; }
    .rail.has-detail .tabs, .rail.has-detail .list { display: none; }
    .d-head { --c: #e40000; position: sticky; top: 0; z-index: 2; background: var(--c); color: var(--ink, #fff); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
    .d-head button { flex: none; width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgba(0,0,0,.28); color: inherit; font-size: 18px; }
    .d-head h2 { margin: 0; font-family: "WP Display"; font-size: 26px; line-height: 1.02; text-transform: uppercase; font-weight: 700; }
    .d-head p { margin: 4px 0 0; font-size: 13px; font-weight: 600; opacity: .92; }
    .d-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .d-card img { display: block; width: 100%; border-radius: 10px; border: 1px solid var(--line-2); background: #000; aspect-ratio: 16/9; object-fit: cover; }
    .d-card .pending { aspect-ratio: 16/9; border-radius: 10px; border: 1px dashed var(--line-2); display: grid; place-items: center; color: var(--muted); font-size: 13px; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fact { padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
    .fact span { display: block; font-family: "WP Mono"; font-size: 10px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
    .fact b { display: block; font-family: "WP Display"; font-size: 22px; margin-top: 2px; }
    .fact small { font-family: "WP Mono"; font-size: 10px; color: var(--dim); }
    .todo { padding: 12px; border-radius: 10px; background: var(--panel-2); border-left: 4px solid var(--c, #fff); font-size: 14px; line-height: 1.5; color: #dfe5ee; }
    .shortbox { border-radius: 12px; border: 1px solid var(--line-2); background: #05070b; overflow: hidden; }
    .shortbox video { display: block; width: 100%; max-height: 62vh; background: #000; }
    .shortbox .sb-row { display: flex; gap: 8px; padding: 10px; align-items: center; flex-wrap: wrap; }
    .shortbox .sb-row p { margin: 0; flex: 1 1 160px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .modal { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: rgba(0,0,0,.82); padding: 16px; }
    .modal.open { display: grid; }
    .modal video { max-height: 88vh; max-width: 100%; border-radius: 14px; background: #000; }
    .modal button { position: absolute; top: 14px; right: 14px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #fff; color: #000; font-size: 20px; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: #fff; color: #000; font-weight: 700; font-size: 13px; z-index: 70; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    @media (max-width: 1180px) { :root { --rail: 400px; } .tally span:nth-child(n+3) { display: none; } }
    @media (max-width: 860px) {
      :root { --top: 56px; }
      .tally, #live-text { display: none; }
      .brand small { display: none; }
      .stage { right: 0; bottom: auto; height: 46vh; }
      .rail { top: calc(var(--top) + 46vh); width: 100%; border-left: 0; border-top: 1px solid var(--line); }
      .legend { display: none; }
      .timeline .tl-track { display: none; }
      .row { grid-template-columns: 6px 1fr 92px; }
      .chip { height: 28px; padding: 0 9px; font-size: 11px; }
      .top { gap: 10px; padding: 0 10px; }
      .brand b { font-size: 16px; }
      .brand img { width: 30px; height: 30px; }
      .search input { padding-left: 32px; font-size: 14px; }
      .search svg { left: 10px; }
      .timeline { bottom: 34px; }
      .foot { font-size: 10px; padding: 6px 12px; }
      .breaking .msg b { font-size: 17px; }
    }
    @media (max-width: 420px) { .brand b { display: none; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="https://weatherpower.app/">
      <img src="/warningcenter/public/assets/wp-logo.png" alt="">
      <div><b>WARNING CENTER</b><small>WEATHERPOWER LIVE</small></div>
    </a>
    <div class="live" id="live"><i></i><span id="live-text">CONNECTING</span></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search warnings, counties, states (e.g. tornado KS)" autocomplete="off">
    </label>
    <div class="tally" id="tally"></div>
  </header>

  <button class="breaking" id="breaking" type="button"><span class="tag">BREAKING</span><span class="msg"><b id="breaking-title"></b><span id="breaking-sub"></span></span></button>

  <main class="stage">
    <div id="map"></div>
    <div class="tools" id="tools">
      <button class="chip" data-tool="radar" aria-pressed="true"><span class="dot" style="color:#2de06a"></span>Radar</button>
      <button class="chip" data-tool="rain" aria-pressed="false"><span class="dot" style="color:#e94fe0"></span>24-hr rain</button>
      <button class="chip" data-tool="sat" aria-pressed="false"><span class="dot" style="color:#7cb6ff"></span>Satellite</button>
      <button class="chip" data-tool="watches" aria-pressed="true"><span class="dot" style="color:#ffd400"></span>Watches</button>
      <button class="chip" data-tool="spc" aria-pressed="true"><span class="dot" style="color:#ff8a00"></span>SPC</button>
      <button class="chip" data-tool="reports" aria-pressed="false"><span class="dot" style="color:#fff"></span>Reports</button>
    </div>
    <div class="timeline" id="timeline">
      <button id="play" aria-label="Pause radar loop">
        <svg id="play-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <div class="tl-time" id="tl-time">--:--</div>
      <div class="tl-track" id="tl-track"></div>
    </div>
    <div class="legend" id="legend">
      <div class="lt"><span id="legend-title">RADAR REFLECTIVITY</span><span>NEXRAD · IEM</span></div>
      <div class="lb" id="legend-bar"></div>
      <div class="ll" id="legend-labels"></div>
    </div>
  </main>

  <aside class="rail" id="rail">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="list" id="list"><div class="empty">Loading live alerts…</div></div>
    <section class="detail" id="detail"></section>
    <div class="foot"><b>BETA</b> · Cards and warning videos render on our servers and can lag a few minutes behind the NWS during busy weather. Always follow your local NWS office and officials.</div>
  </aside>

  <div class="modal" id="modal"><button type="button" aria-label="Close" id="modal-close">✕</button><video id="modal-video" controls playsinline loop></video></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
  (() => {
    const BASE = location.pathname.startsWith('/warningcenter') ? '/warningcenter' : '';
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const api = (path) => BASE + path;
    const asset = (p) => (p ? BASE + p : '');
    const ICONS = {
      tornado: '<path d="M3 5h18M5 9h14M7 13h9M9 17h5M11 21h2" stroke-linecap="round"/>',
      flood: '<path d="M2 8c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 13c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 18c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0" stroke-linecap="round"/>',
      storm: '<path d="M13 2 5 13h6l-1 9 8-12h-6l1-8z" stroke-linejoin="round"/>',
      winter: '<path d="M12 2v20M3.5 7l17 10M20.5 7l-17 10" stroke-linecap="round"/>',
      fire: '<path d="M12 22c4 0 7-2.7 7-6.8 0-3.6-2.4-5.7-4.2-8.2-.6 2-1.6 3.2-2.8 3.7.3-3.3-1.2-6.4-4-8.7.2 3.6-3 6.3-3 10.9C5 19.6 8 22 12 22z"/>',
      wind: '<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8" stroke-linecap="round"/>',
      tropical: '<circle cx="12" cy="12" r="3"/><path d="M12 9c0-4 3-7 8-7-2 2-3 4-3 6M12 15c0 4-3 7-8 7 2-2 3-4 3-6" stroke-linecap="round"/>',
      outlook: '<path d="M12 3 2 20h20L12 3zM12 10v4M12 17v.5" stroke-linecap="round"/>',
      forecast: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22" stroke-linecap="round"/>',
      alert: '<path d="M12 3 2 20h20L12 3zM12 10v4M12 17v.5" stroke-linecap="round"/>'
    };
    const icon = (key, size = 16) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">' + (ICONS[key] || ICONS.alert) + '</svg>';
    const ink = (hex) => {
      const v = String(hex || '#000').replace('#', '');
      const [r, g, b] = [0, 2, 4].map((o) => parseInt(v.slice(o, o + 2), 16) || 0);
      return 0.299 * r + 0.587 * g + 0.114 * b > 170 ? '#0b0d12' : '#ffffff';
    };
    const LEGENDS = {
      radar: { title: 'RADAR REFLECTIVITY', bar: 'linear-gradient(90deg,#04e9e7,#019ff4 12%,#02fd02 26%,#01c501 36%,#fdf802 50%,#fd9500 62%,#fd0000 74%,#d40000 82%,#f800fd 92%,#fff)', labels: ['LIGHT', 'MODERATE', 'HEAVY', 'EXTREME'] },
      rain: { title: 'RADAR-ESTIMATED RAIN · 24 HR', bar: 'linear-gradient(90deg,#8be28b,#2eb82e 18%,#f5f53d 36%,#f59b2e 52%,#e62e2e 68%,#b82eb8 84%,#f2a6f2)', labels: ['0.5"', '1"', '2"', '4"', '8"+'] }
    };
    const TABS = [
      ['warnings', 'Warnings'], ['watches', 'Watches'], ['shorts', 'Videos'], ['statements', 'Statements'],
      ['discussions', 'SPC MDs'], ['outlooks', 'Outlooks'], ['forecasts', 'Forecasts']
    ];

    const S = {
      alerts: [], counts: {}, tab: 'warnings', q: '', selected: null, known: null,
      radar: null, frame: 0, playing: true,
      tools: { radar: true, rain: false, sat: false, watches: true, spc: true, reports: false },
      config: null, map: null, styleReady: false, lastOk: 0, shorts: [], detail: null, shortPoll: null
    };

    const toast = (msg) => {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.remove('show'), 2600);
    };
    const getJson = async (path, options) => {
      const response = await fetch(api(path), { headers: { Accept: 'application/json' }, ...options });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw Object.assign(new Error(body.error || response.statusText), { status: response.status });
      return body;
    };
    const until = (iso) => {
      const ms = Date.parse(iso || '') - Date.now();
      if (!Number.isFinite(ms)) return '';
      if (ms <= 0) return 'expired';
      const m = Math.round(ms / 60000);
      if (m < 60) return m + ' min left';
      const h = Math.floor(m / 60);
      return h < 48 ? h + 'h ' + (m % 60) + 'm left' : Math.round(h / 24) + ' days left';
    };
    const fmtNum = (n) => (n == null ? '' : Number(n).toLocaleString('en-US'));
    const fmtClock = (iso, tz) => {
      try { return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz, timeZoneName: 'short' }); } catch { return ''; }
    };

    /* ---------------- rail ---------------- */
    const visibleAlerts = () => {
      const q = S.q.trim().toLowerCase();
      return S.alerts.filter((a) => a.group === S.tab
        && (!q || q.split(/\s+/).every((t) => [a.event, a.areaDesc, a.place, a.office, (a.states || []).join(' ')].join(' ').toLowerCase().includes(t))));
    };
    const renderTabs = () => {
      $('tabs').innerHTML = TABS.map(([id, label]) => {
        const count = id === 'shorts' ? S.shorts.length : (S.counts[id] || 0);
        return '<button role="tab" data-tab="' + id + '" aria-selected="' + (S.tab === id) + '">' + label + '<em>' + count + '</em></button>';
      }).join('');
      $('tally').innerHTML = [['warnings', 'WARNINGS'], ['watches', 'WATCHES'], ['discussions', 'SPC MDS'], ['outlooks', 'OUTLOOKS']]
        .map(([id, label]) => '<span><b>' + (S.counts[id] || 0) + '</b><small>' + label + '</small></span>').join('');
    };
    const rowHtml = (a) => {
      const thumb = a.card ? 'style="background-image:url(\'' + esc(asset(a.card.path)) + '\')"' : '';
      const tags = [];
      if (a.threat) tags.push('<span class="tagp hot">' + esc(a.threat) + '</span>');
      if (a.status === 'NEW') tags.push('<span class="tagp new">NEW</span>');
      if (a.short) tags.push('<span class="tagp vid">▶ VIDEO</span>');
      if (a.expiresAt) tags.push('<span>' + esc(until(a.expiresAt)) + '</span>');
      if (a.people) tags.push('<span>' + fmtNum(a.people) + ' people</span>');
      return '<button class="row' + (S.selected === a.key ? ' sel' : '') + '" data-key="' + esc(a.key) + '" style="--c:' + esc(a.color || '#888') + '">'
        + '<span class="bar"></span><span class="body"><span class="ev">' + icon(a.icon) + esc(a.eventLabel) + '</span>'
        + '<span class="area">' + esc(a.area || a.areaDesc) + '</span><span class="meta">' + tags.join('') + '</span></span>'
        + '<span class="thumb" ' + thumb + '>' + (a.card ? '' : '<span class="pend">RENDERING</span>') + '</span></button>';
    };
    const renderList = () => {
      renderTabs();
      const list = $('list');
      if (S.tab === 'shorts') {
        list.innerHTML = S.shorts.length
          ? '<div class="section-label">WARNING VIDEOS · LIVE RADAR + POLYGON · 15 SEC</div><div class="shorts-grid">' + S.shorts.map((s) => (
            '<button class="short-tile" data-video="' + esc(asset(s.short.path)) + '" style="background-image:url(\'' + esc(asset(s.short.posterPath)) + '\')"><span>' + esc(s.event) + '</span></button>'
          )).join('') + '</div>'
          : '<div class="empty">No warning videos right now.<br>Videos are made automatically for tornado, severe thunderstorm and flash flood warnings — or open any warning and tap <b>Make a video</b>.</div>';
        return;
      }
      const items = visibleAlerts();
      if (S.tab === 'forecasts') {
        list.innerHTML = '<form class="fsearch" id="fsearch"><input name="q" placeholder="City or ZIP for 7-day forecast cards" required><button class="btn primary">Generate</button></form>'
          + '<div id="fresults"></div><div class="section-label">FEATURED</div>' + items.map(rowHtml).join('');
        return;
      }
      if (!items.length) {
        list.innerHTML = '<div class="empty">' + (S.q ? 'Nothing matches “' + esc(S.q) + '”.' : 'No active ' + esc(S.tab) + ' right now.') + '</div>';
        return;
      }
      const top = items[0];
      const hero = top.rank <= 5 && top.card
        ? '<button class="hero" data-key="' + esc(top.key) + '" style="--c:' + esc(top.color) + '"><img src="' + esc(asset(top.card.path)) + '" alt="" loading="lazy"><span class="cap"><b>' + esc(top.headline) + '</b><span>' + esc(until(top.expiresAt)) + '</span></span></button>'
        : '';
      list.innerHTML = hero + items.slice(hero ? 1 : 0, 300).map(rowHtml).join('');
    };

    /* ---------------- detail ---------------- */
    const shortSection = (a) => {
      if (a.short) {
        return '<div class="shortbox"><video src="' + esc(asset(a.short.path)) + '" poster="' + esc(asset(a.short.posterPath)) + '" controls playsinline loop preload="metadata"></video>'
          + '<div class="sb-row"><p>Live radar video · made ' + esc(fmtClock(a.short.renderedAt, a.timezone)) + '</p><a class="btn" download href="' + esc(asset(a.short.path)) + '">Download video</a></div></div>';
      }
      if (!a.geometry || ['outlooks', 'forecasts', 'discussions'].includes(a.group)) return '';
      const busy = a.shortStatus === 'queued' || a.shortStatus === 'rendering';
      return '<div class="shortbox"><div class="sb-row"><p>' + (busy
        ? 'Rendering the warning video with the latest radar loop… usually 1–3 minutes.'
        : 'Make a 15-second vertical video of this warning with the live radar loop — ready for Shorts, Reels and TikTok.')
        + '</p><button class="btn red" id="make-short" ' + (busy ? 'disabled' : '') + '>' + (busy ? 'Rendering…' : '🎬 Make a video') + '</button></div></div>';
    };
    const renderDetail = (a) => {
      S.detail = a;
      const people = a.people ? '<div class="fact"><span>People in area</span><b>' + fmtNum(a.people) + '</b><small>' + (a.homes ? fmtNum(a.homes) + ' homes · ' : '') + '2020 Census</small></div>' : '';
      const hazards = (a.hazards || []).map((h) => '<div class="fact"><span>' + esc(h.label) + '</span><b>' + esc(h.value) + '</b></div>').join('');
      $('detail').innerHTML = '<div class="d-head" style="--c:' + esc(a.color) + ';--ink:' + ink(a.color) + '"><button id="back" aria-label="Back to list">←</button><div><h2>' + esc(a.headline) + '</h2><p>' + esc(a.area) + '</p></div></div>'
        + '<div class="d-body">'
        + '<div class="d-card">' + (a.card ? '<a href="' + esc(asset(a.card.path)) + '" target="_blank" rel="noopener"><img src="' + esc(asset(a.card.path)) + '" alt="' + esc(a.headline) + ' card"></a>' : '<div class="pending">Card is rendering…</div>') + '</div>'
        + shortSection(a)
        + '<div class="facts"><div class="fact"><span>' + (a.group === 'warnings' ? 'Expires' : 'Valid until') + '</span><b>' + esc(a.times?.expires || '--') + '</b><small>' + esc(until(a.expiresAt)) + '</small></div>'
        + '<div class="fact"><span>Issued</span><b>' + esc(a.times?.issued || '--') + '</b><small>' + esc(a.status) + (a.threat ? ' · ' + esc(a.threat) : '') + '</small></div>'
        + people + hazards + '</div>'
        + (a.whatToDo ? '<div class="todo" style="--c:' + esc(a.color) + '"><b>What to do.</b> ' + esc(a.whatToDo) + '</div>' : '')
        + '<div class="actions"><a class="btn" href="' + esc(BASE + '/warningdetail?key=' + encodeURIComponent(a.key)) + '">Full details</a>'
        + '<button class="btn" id="copy-link">Copy link</button>'
        + (a.card ? '<a class="btn" download href="' + esc(asset(a.card.path)) + '">Download card</a>' : '') + '</div>'
        + '<div class="mono" style="font-size:10.5px;color:var(--dim)">Source: NWS ' + esc(a.office || '') + ' · ' + esc(a.event) + '</div>'
        + '</div>';
      $('rail').classList.add('has-detail');
    };
    const openDetail = async (key, { fly = true } = {}) => {
      if (S.selected !== key) $('detail').scrollTop = 0;
      S.selected = key;
      const summary = S.alerts.find((a) => a.key === key);
      if (summary) renderDetail(summary);
      if (fly && summary) flyTo(summary);
      highlight();
      const url = new URL(location.href);
      url.searchParams.set('alert', key);
      history.replaceState(null, '', url);
      try {
        const full = await getJson('/api/v3/alert?key=' + encodeURIComponent(key));
        if (S.selected === key) {
          renderDetail(full);
          if (!summary && fly) flyTo(full);
          if (full.shortStatus === 'queued' || full.shortStatus === 'rendering') pollShort(key);
        }
      } catch {
        if (!summary) { toast('That alert has expired'); closeDetail(); }
      }
    };
    const closeDetail = () => {
      S.selected = null;
      clearTimeout(S.shortPoll);
      $('rail').classList.remove('has-detail');
      const url = new URL(location.href);
      url.searchParams.delete('alert');
      history.replaceState(null, '', url);
      highlight();
      renderList();
    };
    const pollShort = (key) => {
      clearTimeout(S.shortPoll);
      S.shortPoll = setTimeout(async () => {
        if (S.selected !== key) return;
        try {
          const status = await getJson('/api/v3/short?key=' + encodeURIComponent(key));
          if (status.status === 'ready' && status.short) {
            toast('Warning video is ready');
            const full = await getJson('/api/v3/alert?key=' + encodeURIComponent(key));
            if (S.selected === key) renderDetail(full);
            refreshShorts();
            return;
          }
          if (status.status === 'error') { toast('Video render failed — try again later'); return; }
        } catch {}
        pollShort(key);
      }, 8000);
    };
    const requestShort = async () => {
      const a = S.detail;
      const button = $('make-short');
      if (!a || !button) return;
      button.disabled = true;
      button.textContent = 'Queuing…';
      try {
        const result = await getJson('/api/v3/short/request?key=' + encodeURIComponent(a.key), { method: 'POST' });
        if (result.ready) { openDetail(a.key, { fly: false }); return; }
        if (!result.queued) {
          toast(result.reason || 'Could not queue video');
          button.disabled = false;
          button.textContent = '🎬 Make a video';
          return;
        }
        button.textContent = 'Rendering…';
        const position = result.short?.queuePosition;
        button.closest('.sb-row').querySelector('p').textContent = 'Rendering the warning video with the latest radar loop… usually 1–3 minutes.' + (position > 1 ? ' (#' + position + ' in line)' : '');
        pollShort(a.key);
      } catch (error) {
        toast(error.message);
        button.disabled = false;
        button.textContent = '🎬 Make a video';
      }
    };

    /* ---------------- map ---------------- */
    const firstSymbolId = () => S.map.getStyle().layers.find((l) => l.type === 'symbol')?.id;
    const alertFC = () => ({
      type: 'FeatureCollection',
      features: S.alerts.filter((a) => a.geometry && a.group !== 'forecasts').map((a) => ({
        type: 'Feature', geometry: a.geometry,
        properties: { key: a.key, color: a.accent || a.color || '#888', rank: a.rank, group: a.group, sel: a.key === S.selected ? 1 : 0 }
      })).sort((x, y) => (y.properties.rank - x.properties.rank) || (x.properties.sel - y.properties.sel))
    });
    const groupFilter = () => {
      const groups = ['warnings', 'statements'];
      if (S.tools.watches) groups.push('watches');
      if (S.tools.spc) groups.push('discussions', 'outlooks');
      return ['in', ['get', 'group'], ['literal', groups]];
    };
    const installLayers = () => {
      const map = S.map;
      const before = firstSymbolId();
      if (S.radar) {
        S.radar.reflectivity.forEach((f, i) => {
          map.addSource('rf' + i, { type: 'raster', tiles: [f.tiles], tileSize: 256 });
          map.addLayer({ id: 'rf' + i, type: 'raster', source: 'rf' + i, paint: { 'raster-opacity': 0, 'raster-fade-duration': 0 } }, before);
        });
        map.addSource('rain', { type: 'raster', tiles: [S.radar.rainfall24h], tileSize: 256 });
        map.addLayer({ id: 'rain', type: 'raster', source: 'rain', layout: { visibility: 'none' }, paint: { 'raster-opacity': .6 } }, before);
      }
      map.addSource('alerts', { type: 'geojson', data: alertFC() });
      map.addLayer({ id: 'alert-fill', type: 'fill', source: 'alerts', filter: groupFilter(), paint: {
        'fill-color': ['get', 'color'],
        'fill-opacity': ['case', ['==', ['get', 'sel'], 1], .3, ['==', ['get', 'group'], 'outlooks'], .05, .13]
      } }, before);
      map.addLayer({ id: 'alert-shadow', type: 'line', source: 'alerts', filter: groupFilter(), paint: { 'line-color': '#000', 'line-opacity': .55, 'line-width': ['case', ['==', ['get', 'sel'], 1], 8, 4] } });
      map.addLayer({ id: 'alert-line', type: 'line', source: 'alerts', filter: groupFilter(), paint: {
        'line-color': ['case', ['==', ['get', 'sel'], 1], '#ffffff', ['get', 'color']],
        'line-width': ['case', ['==', ['get', 'sel'], 1], 4, ['<=', ['get', 'rank'], 3], 3, ['==', ['get', 'group'], 'watches'], 1.6, 2]
      } });
      map.addSource('reports', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'reports', type: 'circle', source: 'reports', layout: { visibility: 'none' }, paint: {
        'circle-radius': 5, 'circle-stroke-width': 1.5, 'circle-stroke-color': '#000',
        'circle-color': ['match', ['get', 'type'], 'Tornado', '#ff2020', 'Hail', '#3fa9ff', ['Wind', 'Damage', 'Marine Wind'], '#ffd400', 'Flood', '#2ee06f', 'Rain', '#36c3a4', '#ffffff']
      } });
      S.styleReady = true;
      applyTools();
      showFrame(S.frame);
      if (S.tools.reports) loadReports();
    };
    const setStyle = (satellite) => {
      S.styleReady = false;
      S.map.setStyle(satellite ? S.config.satelliteStyle : S.config.darkStyleUrl);
      S.map.once('style.load', installLayers);
    };
    const applyTools = () => {
      document.querySelectorAll('[data-tool]').forEach((b) => b.setAttribute('aria-pressed', String(Boolean(S.tools[b.dataset.tool]))));
      const radarOn = S.tools.radar && !S.tools.rain;
      const legend = LEGENDS[S.tools.rain ? 'rain' : 'radar'];
      $('legend-title').textContent = legend.title;
      $('legend-bar').style.background = legend.bar;
      $('legend-labels').innerHTML = legend.labels.map((l) => '<span>' + l + '</span>').join('');
      $('legend').style.display = S.tools.radar || S.tools.rain ? '' : 'none';
      $('timeline').style.display = radarOn ? '' : 'none';
      if (!S.styleReady) return;
      const map = S.map;
      (S.radar?.reflectivity || []).forEach((_, i) => map.setLayoutProperty('rf' + i, 'visibility', radarOn ? 'visible' : 'none'));
      if (map.getLayer('rain')) map.setLayoutProperty('rain', 'visibility', S.tools.rain ? 'visible' : 'none');
      for (const id of ['alert-fill', 'alert-shadow', 'alert-line']) map.setFilter(id, groupFilter());
      map.setLayoutProperty('reports', 'visibility', S.tools.reports ? 'visible' : 'none');
    };
    const showFrame = (i) => {
      if (!S.radar) return;
      const n = S.radar.reflectivity.length;
      S.frame = ((i % n) + n) % n;
      if (S.styleReady) S.radar.reflectivity.forEach((_, k) => S.map.setPaintProperty('rf' + k, 'raster-opacity', k === S.frame ? .72 : 0));
      const f = S.radar.reflectivity[S.frame];
      $('tl-time').textContent = new Date(f.time).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
      $('tl-track').innerHTML = S.radar.reflectivity.map((_, k) => '<i class="' + (k <= S.frame ? 'on' : '') + '"></i>').join('');
    };
    let loopTimer = null;
    const loop = () => {
      clearTimeout(loopTimer);
      if (!S.playing || document.hidden || !S.radar) return;
      const last = S.frame === S.radar.reflectivity.length - 1;
      loopTimer = setTimeout(() => { showFrame(S.frame + 1); loop(); }, last ? 1600 : 420);
    };
    const setPlaying = (on) => {
      S.playing = on;
      $('play-icon').innerHTML = on ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>';
      $('play').setAttribute('aria-label', on ? 'Pause radar loop' : 'Play radar loop');
      if (on) loop(); else clearTimeout(loopTimer);
    };
    const highlight = () => {
      if (S.styleReady) S.map.getSource('alerts')?.setData(alertFC());
      document.querySelectorAll('.row').forEach((r) => r.classList.toggle('sel', r.dataset.key === S.selected));
    };
    const boundsOf = (geometry) => {
      const pts = [];
      const walk = (c) => { if (!Array.isArray(c)) return; if (typeof c[0] === 'number') pts.push(c); else c.forEach(walk); };
      walk(geometry?.coordinates);
      if (!pts.length) return null;
      const xs = pts.map((p) => p[0]); const ys = pts.map((p) => p[1]);
      return [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]];
    };
    const flyTo = (a) => {
      const b = boundsOf(a.geometry);
      if (b) S.map.fitBounds(b, { padding: { top: 80, bottom: 80, left: 60, right: 60 }, maxZoom: 9.2, duration: 900 });
      else if (a.center) S.map.flyTo({ center: a.center, zoom: 8 });
    };
    const loadReports = async () => {
      try {
        const body = await getJson('/api/dashboard/reports?hours=12&limit=300');
        S.map.getSource('reports')?.setData({ type: 'FeatureCollection', features: (body.reports || []).filter((r) => r.geometry).map((r) => ({ type: 'Feature', geometry: r.geometry, properties: { type: r.type } })) });
      } catch {}
    };
    const initMap = () => {
      S.map = new maplibregl.Map({
        container: 'map', style: S.config.darkStyleUrl, center: [-96, 38.5], zoom: innerWidth < 860 ? 2.7 : 3.8,
        attributionControl: { compact: true }, fadeDuration: 0
      });
      S.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
      S.map.once('style.load', installLayers);
      S.map.once('load', () => {
        if (innerWidth < 860) document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
      });
      S.map.on('click', (e) => {
        if (!S.styleReady) return;
        document.querySelector('.picker')?.remove();
        const hits = S.map.queryRenderedFeatures(e.point, { layers: ['alert-fill'] });
        const keys = [...new Set(hits.map((h) => h.properties.key))];
        const items = keys.map((k) => S.alerts.find((a) => a.key === k)).filter(Boolean).sort((x, y) => x.rank - y.rank);
        if (items.length === 1) { openDetail(items[0].key, { fly: false }); return; }
        if (items.length > 1) {
          const box = document.createElement('div');
          box.className = 'picker';
          const container = S.map.getContainer();
          box.style.left = Math.max(8, Math.min(e.point.x, container.clientWidth - 290)) + 'px';
          box.style.top = Math.max(8, Math.min(e.point.y, container.clientHeight - 56 * Math.min(items.length, 8) - 40)) + 'px';
          box.innerHTML = '<header>' + items.length + ' ALERTS HERE</header>' + items.slice(0, 8).map((a) => '<button data-key="' + esc(a.key) + '" style="--c:' + esc(a.color) + '"><i></i><span><b>' + esc(a.eventLabel) + '</b><span>' + esc(a.area) + '</span></span></button>').join('');
          container.parentElement.appendChild(box);
        }
      });
      S.map.on('mousemove', 'alert-fill', () => { S.map.getCanvas().style.cursor = 'pointer'; });
      S.map.on('mouseleave', 'alert-fill', () => { S.map.getCanvas().style.cursor = ''; });
    };

    /* ---------------- live data ---------------- */
    const breaking = (a) => {
      const el = $('breaking');
      el.style.setProperty('--b', a.color || '#e40000');
      $('breaking-title').textContent = a.headline;
      $('breaking-sub').textContent = a.area + (a.times?.expires ? ' · until ' + a.times.expires : '');
      el.dataset.key = a.key;
      el.classList.add('show');
      clearTimeout(breaking.t);
      breaking.t = setTimeout(() => el.classList.remove('show'), 12000);
    };
    const refresh = async () => {
      try {
        const body = await getJson('/api/v3/alerts');
        const previous = S.known;
        S.alerts = body.alerts || [];
        S.counts = body.counts || {};
        S.known = new Set(S.alerts.map((a) => a.key));
        S.lastOk = Date.now();
        if (previous) {
          const fresh = S.alerts.filter((a) => !previous.has(a.key) && a.rank <= 3);
          if (fresh.length) breaking(fresh[0]);
        }
        if (S.selected && !S.known.has(S.selected)) { toast('The selected alert has expired'); closeDetail(); }
        if (!S.selected) renderList(); else renderTabs();
        highlight();
        $('live').classList.remove('stale');
      } catch {
        $('live').classList.add('stale');
      }
      updateLive();
    };
    const refreshShorts = async () => {
      try {
        const body = await getJson('/api/v3/shorts');
        S.shorts = body.items || [];
        if (S.tab === 'shorts' && !S.selected) renderList(); else renderTabs();
      } catch {}
    };
    const refreshRadar = async () => {
      try {
        const radar = await getJson('/api/v3/radar');
        if (S.radar && S.radar.validAt === radar.validAt) return;
        S.radar = radar;
        if (S.styleReady) {
          radar.reflectivity.forEach((f, i) => S.map.getSource('rf' + i)?.setTiles?.([f.tiles]));
          showFrame(S.frame);
        }
      } catch {}
    };
    const updateLive = () => {
      const s = Math.round((Date.now() - S.lastOk) / 1000);
      $('live-text').textContent = !S.lastOk ? 'CONNECTING' : s < 50 ? 'LIVE · UPDATED ' + s + 'S AGO' : 'LIVE · UPDATED ' + Math.round(s / 60) + 'M AGO';
    };

    /* ---------------- events ---------------- */
    document.addEventListener('click', (e) => {
      const tab = e.target.closest('[data-tab]');
      if (tab) { S.tab = tab.dataset.tab; renderList(); if (S.tab === 'shorts') refreshShorts(); return; }
      const row = e.target.closest('.row[data-key], .hero[data-key], .picker button[data-key]');
      if (row) { document.querySelector('.picker')?.remove(); openDetail(row.dataset.key); return; }
      const tool = e.target.closest('[data-tool]');
      if (tool) {
        const t = tool.dataset.tool;
        S.tools[t] = !S.tools[t];
        if (t === 'sat') setStyle(S.tools.sat);
        if (t === 'rain' && S.tools.rain) S.tools.radar = true;
        if (t === 'radar' && !S.tools.radar) S.tools.rain = false;
        if (t === 'reports' && S.tools.reports) loadReports();
        applyTools();
        return;
      }
      const tile = e.target.closest('[data-video]');
      if (tile) { $('modal-video').src = tile.dataset.video; $('modal').classList.add('open'); $('modal-video').play().catch(() => {}); return; }
      if (e.target.closest('#back')) { closeDetail(); return; }
      if (e.target.closest('#make-short')) { requestShort(); return; }
      if (e.target.closest('#copy-link')) { navigator.clipboard?.writeText(location.href).then(() => toast('Link copied')); return; }
      if (e.target.closest('#breaking')) { $('breaking').classList.remove('show'); openDetail($('breaking').dataset.key); return; }
      if (e.target.id === 'modal' || e.target.closest('#modal-close')) { $('modal').classList.remove('open'); $('modal-video').pause(); }
    });
    document.addEventListener('submit', async (e) => {
      if (e.target.id !== 'fsearch') return;
      e.preventDefault();
      const q = new FormData(e.target).get('q');
      const out = $('fresults');
      out.innerHTML = '<div class="empty">Building forecast cards for ' + esc(q) + '… this can take up to a minute.</div>';
      try {
        const body = await getJson('/api/forecasts/search?q=' + encodeURIComponent(q));
        out.innerHTML = '<div class="section-label">' + esc(body.location?.label || body.location?.name || q) + '</div>' + (body.items || []).filter((item) => item.card).map((item) => (
          '<a href="' + esc(asset(item.card.path)) + '" target="_blank" rel="noopener"><img src="' + esc(asset(item.card.path)) + '" alt="' + esc(item.title) + '" style="display:block;width:100%;border-radius:10px;border:1px solid var(--line-2);margin-top:6px" loading="lazy"></a>'
        )).join('');
      } catch (error) {
        out.innerHTML = '<div class="empty">' + esc(error.message) + '</div>';
      }
    });
    $('q').addEventListener('input', (e) => {
      S.q = e.target.value;
      if (S.q && S.tab === 'shorts') S.tab = 'warnings';
      if (S.selected) closeDetail(); else renderList();
    });
    $('play').addEventListener('click', () => setPlaying(!S.playing));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('modal').classList.contains('open')) { $('modal').classList.remove('open'); $('modal-video').pause(); }
        else if (S.selected) closeDetail();
        return;
      }
      if (/INPUT|TEXTAREA|VIDEO/.test(e.target.tagName)) return;
      if (e.key === ' ') { e.preventDefault(); setPlaying(!S.playing); }
      if (e.key === 'ArrowRight') { setPlaying(false); showFrame(S.frame + 1); }
      if (e.key === 'ArrowLeft') { setPlaying(false); showFrame(S.frame - 1); }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); loop(); } });

    /* ---------------- boot ---------------- */
    (async () => {
      try {
        const [config, radar] = await Promise.all([getJson('/api/v3/config'), getJson('/api/v3/radar').catch(() => null)]);
        S.config = config;
        S.radar = radar;
        S.frame = radar ? radar.reflectivity.length - 1 : 0;
      } catch {
        $('list').innerHTML = '<div class="empty">Warning Center is temporarily unavailable. Retrying…</div>';
        setTimeout(() => location.reload(), 15000);
        return;
      }
      initMap();
      applyTools();
      showFrame(S.frame);
      await refresh();
      refreshShorts();
      const deep = new URL(location.href).searchParams.get('alert');
      if (deep) openDetail(deep);
      setPlaying(true);
      setInterval(() => { if (!document.hidden) refresh(); }, 20000);
      setInterval(() => { if (!document.hidden) refreshShorts(); }, 60000);
      setInterval(() => { if (!document.hidden) refreshRadar(); }, 120000);
      setInterval(updateLive, 5000);
    })();
  })();
  </script>
</body>
</html>
