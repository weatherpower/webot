<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Link Puter</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --brand: #0e7490; --ok: #15803d; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1117; --card: #161b22; --ink: #e6edf3; --muted: #8b949e; --line: #30363d; --brand: #22d3ee; --ok: #4ade80; --bad: #f87171; } }
  :root[data-theme="dark"] { --bg: #0d1117; --card: #161b22; --ink: #e6edf3; --muted: #8b949e; --line: #30363d; --brand: #22d3ee; --ok: #4ade80; --bad: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 32px 16px 48px; text-align: center; }
  img { width: 130px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
  h1 { margin: 10px 0 6px; font-size: 26px; }
  p { margin: 0 0 14px; color: var(--muted); }
  .card { margin-top: 18px; padding: 20px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  button { width: 100%; padding: 15px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: 700 18px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; }
  .msg { margin-top: 14px; font-weight: 600; min-height: 24px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  small { display: block; margin-top: 16px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="/warningcenter/public/assets/webot.png" alt="WeBot">
  <h1>Link a Puter account</h1>
  <p>This gives WeBot's stream voice (and his AI brain) a new Puter account.</p>
  <div class="card">
    <button id="go" disabled>Checking link…</button>
    <div class="msg" id="msg"></div>
    <small>If Puter signs you straight into the old account, tap your account in the Puter window and log out, then sign in with the new one. This link works once and expires 30 minutes after it was made.</small>
  </div>
</main>
<script>
(() => {
  const code = location.pathname.split('/').filter(Boolean).pop() || '';
  const api = '/warningcenter/api/v3/live/puter-claim/' + encodeURIComponent(code);
  const go = document.getElementById('go');
  const msg = (t, cls) => { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); };
  let puterReady = null;
  const loadPuter = () => puterReady || (puterReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://js.puter.com/v2/';
    s.onload = () => resolve(window.puter);
    s.onerror = () => reject(new Error('Puter did not load'));
    document.head.appendChild(s);
  }));
  fetch(api, { cache: 'no-store' }).then((r) => r.json()).then((b) => {
    if (!b.ok) { go.textContent = 'Link expired'; msg('This link expired or was already used. Ask for a new one.', 'bad'); return; }
    go.disabled = false;
    go.textContent = 'Sign in with Puter';
    loadPuter().catch(() => msg('Puter did not load. Check your connection and reload.', 'bad'));
  }).catch(() => { go.textContent = 'Can’t reach WeBot'; msg('The WeBot server didn’t answer. Try again in a minute.', 'bad'); });

  go.addEventListener('click', async () => {
    go.disabled = true;
    msg('Opening Puter…');
    try {
      const puter = await loadPuter();
      // Start clean on this page so the new account can be picked.
      try { if (puter.auth.isSignedIn()) puter.auth.signOut(); } catch {}
      await puter.auth.signIn();
      const token = puter.authToken;
      if (!token) throw new Error('Puter sign-in didn’t finish');
      let user = '';
      try { user = (await puter.auth.getUser())?.username || ''; } catch {}
      const r = await fetch(api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, user }) });
      const b = await r.json().catch(() => ({}));
      if (!r.ok || !b.ok) throw new Error(b.error || 'The server didn’t take it');
      go.textContent = 'Linked ✓';
      msg('Linked' + (b.user ? ' as ' + b.user : '') + '! WeBot switches to it on the stream within a few seconds.', 'ok');
    } catch (e) {
      go.disabled = false;
      msg(String(e?.message || e?.msg || e || 'Sign-in failed'), 'bad');
    }
  });
})();
</script>
</body>
</html>
