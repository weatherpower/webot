<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherPower Live</title>
  <meta name="description" content="WeatherPower 24/7 live severe weather coverage: live warnings, local radar and the WeatherPower bot.">
  <link rel="icon" type="image/png" href="/warningcenter/favicon.ico">
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    /* Built for a 1920x1080 OBS browser source; the stage scales to fit any other window. */
    @font-face { font-family: "WP Display"; src: url("/warningcenter/public/assets/fonts/oswald-latin.woff2") format("woff2"); font-weight: 400 700; }
    @font-face { font-family: "WP Sans"; src: url("/warningcenter/public/assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 900; }
    @font-face { font-family: "WP Mono"; src: url("/warningcenter/public/assets/fonts/ibm-plex-mono-600-latin.woff2") format("woff2"); font-weight: 400 700; }
    /* Ryan Hall-style stream look: violet bars, dark navy panels with cyan corner accents, spaced mono labels. */
    :root {
      --ink: #f4f6fb; --muted: #8f9bb3; --line: rgba(255,255,255,.12); --edge: #33d4ff; --brand: #33d4ff;
      --violet: linear-gradient(180deg, #7457ec 0%, #5b3fd3 100%); --violet-dark: #3e2a9c; --violet-deep: #141d47;
      --panel: rgba(9,16,30,.93); --panel-solid: #0a1222;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: #0a0f18; color: var(--ink); font-family: "WP Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #map { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .shade { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.3), rgba(0,0,0,0) 12%, rgba(0,0,0,0) 86%, rgba(0,0,0,.35)); }

    /* ---------- top bar ---------- */
    .top { position: absolute; left: 0; right: 0; top: 0; height: 80px; display: flex; background: var(--violet); z-index: 20; }
    .tally { display: flex; flex: none; }
    .tile { width: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--t); border-right: 1px solid rgba(0,0,0,.35); }
    .tile .n { display: flex; align-items: center; gap: 7px; font-family: "WP Display"; font-weight: 700; font-size: 36px; line-height: 1; color: #fff; }
    .tile .n svg { opacity: .75; }
    .tile .l { font-family: "WP Mono"; font-size: 12px; letter-spacing: .24em; color: rgba(255,255,255,.75); }
    .tile.zero .n span { opacity: .55; }
    .tile.bump { animation: bump 1.2s ease-out; }
    @keyframes bump { 0%, 40% { filter: brightness(1.9); } 100% { filter: none; } }
    .hl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; padding: 0 26px; background: var(--hc, transparent); transition: background .6s; overflow: hidden; }
    .hl .tag { flex: none; font-family: "WP Mono"; font-size: 13px; font-weight: 700; letter-spacing: .2em; padding: 6px 10px; border: 1px solid rgba(255,255,255,.55); color: #fff; }
    .hl .slot { position: relative; flex: 1; min-width: 0; height: 80px; }
    .hl .txt { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); font-family: "WP Display"; font-weight: 700; font-size: 40px; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; transition: transform .45s ease, opacity .3s; }
    .hl .txt.enter { transform: translateY(30%); opacity: 0; }
    .hl .txt.leave { transform: translateY(-130%); opacity: 0; }
    .wpi { flex: none; width: 360px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--violet-deep); border-left: 2px solid rgba(255,255,255,.12); transition: background-color 1.2s; }
    .wpi .meta { font-family: "WP Mono"; font-size: 11px; letter-spacing: .16em; color: #9fb3e6; display: flex; gap: 8px; }
    .wpi .v { font-family: "WP Display"; font-size: 38px; font-weight: 700; line-height: 1; color: var(--wc, #4fb4ff); }
    .wpi .lab { font-family: "WP Mono"; font-size: 11px; letter-spacing: .3em; color: var(--wc, #4fb4ff); }
    .wpi canvas { width: 176px; height: 56px; margin-left: auto; }

    /* ---------- panels: dark navy, thin edge, cyan bracket top-left, cut corner bottom-right ---------- */
    .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); z-index: 10;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 0 100%); }
    .panel::before { content: ""; position: absolute; left: -1px; top: -1px; width: 26px; height: 26px; border-left: 3px solid var(--edge); border-top: 3px solid var(--edge); pointer-events: none; }
    .panel::after { content: ""; position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; background: linear-gradient(135deg, transparent 45%, var(--edge) 45%, var(--edge) 58%, transparent 58%); pointer-events: none; }
    .card { left: 32px; top: 104px; width: 500px; transform: translateX(-112%); transition: transform .5s cubic-bezier(.3,.8,.3,1); }
    .card.show { transform: none; }
    .card .head { display: flex; align-items: flex-start; gap: 14px; padding: 22px 26px 12px; }
    .card .ico { display: none; }
    .card h2 { margin: 0; font-family: "WP Display"; font-size: 40px; font-weight: 700; line-height: 1; text-transform: uppercase; color: #fff; }
    .card .sub { margin-top: 8px; font-family: "WP Mono"; font-size: 14px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
    .card .status { margin-left: auto; flex: none; font-family: "WP Mono"; font-weight: 700; font-size: 12px; letter-spacing: .16em; padding: 5px 8px; border: 1px solid var(--c, var(--edge)); color: #fff; }
    .card .status.pin { border-color: #ffd34d; color: #ffd34d; }
    .life { height: 3px; width: 150px; margin: 0 26px; background: rgba(255,255,255,.1); }
    .life i { display: block; height: 100%; background: var(--c, var(--edge)); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 26px 6px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.035); font-family: "WP Mono"; font-size: 13px; letter-spacing: .1em; color: #b8c2d6; text-transform: uppercase; }
    .chip b { color: #fff; font-weight: 700; }
    .chip.hot { border-color: var(--c); color: #fff; }
    .card dl { margin: 0; padding: 8px 26px 26px; display: grid; grid-template-columns: 110px 1fr; }
    .card dt, .card dd { padding: 13px 0; border-top: 1px solid rgba(255,255,255,.07); }
    .card dt { font-family: "WP Mono"; font-size: 12px; letter-spacing: .18em; color: var(--muted); line-height: 1.9; }
    .card dd { margin: 0; text-align: right; font-family: "WP Display"; font-size: 21px; line-height: 1.25; text-transform: uppercase; color: #fff; }
    .card dd.prose { font-family: "WP Sans"; font-size: 17px; font-weight: 500; line-height: 1.42; text-transform: none; color: #e3e8f1; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .rows { padding: 6px 26px 26px; }
    .rowi { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.07); }
    .hlmk { display: grid; justify-items: center; line-height: 1; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
    .hlmk b { font: 700 38px "WP Display"; }
    .hlmk small { font: 700 12px "WP Mono"; letter-spacing: .04em; margin-top: 2px; }
    .hlmk.h { color: #4f8bff; }
    .hlmk.l { color: #ff3b3b; }
    .cam { position: absolute; right: 32px; top: 340px; width: 520px; z-index: 12; display: none; background: rgba(9,16,30,.94); border: 1px solid rgba(255,255,255,.12); border-top: 3px solid #33d4ff; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
    .cam.show { display: block; animation: camin .5s ease; }
    @keyframes camin { from { opacity: 0; transform: translateY(12px); } }
    .cam .feed { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
    .cam .feed img, .cam .feed video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cam .cap { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
    .cam .cap .live { flex: none; font: 700 12px "WP Mono"; letter-spacing: .12em; color: #fff; background: #d81f2a; padding: 3px 7px; }
    .cam .cap .live::before { content: "● "; animation: blinkdot 1.2s steps(2) infinite; }
    @keyframes blinkdot { 50% { opacity: .2; } }
    .cam .cap b { font: 600 17px "WP Display"; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .cam .cap small { margin-left: auto; flex: none; font: 600 11px "WP Mono"; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
    .cammk { display: grid; justify-items: center; gap: 6px; pointer-events: none; }
    .cammk i { width: 18px; height: 18px; border-radius: 50%; background: #33d4ff; border: 3px solid #fff; box-shadow: 0 0 0 10px rgba(51,212,255,.25), 0 0 0 22px rgba(51,212,255,.12); }
    .cammk span { font: 700 12px "WP Mono"; letter-spacing: .08em; color: #fff; background: rgba(9,16,30,.9); padding: 4px 8px; border: 1px solid rgba(255,255,255,.18); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
    .tcmk { display: flex; align-items: center; gap: 10px; pointer-events: none; }
    .tcmk i { display: grid; place-items: center; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: var(--tc, #ff9f2a); color: #111; font: 700 20px "WP Display"; font-style: normal; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(0,0,0,.4), 0 0 24px var(--tc, #ff9f2a); animation: tcspin 3s linear infinite; }
    .tcmk i b { animation: tcspin 3s linear infinite reverse; }
    .tcmk span { font-family: "WP Display"; font-size: 24px; font-weight: 700; color: #fff; background: rgba(9,16,30,.86); padding: 4px 12px; border-left: 4px solid var(--tc, #ff9f2a); text-transform: uppercase; white-space: nowrap; }
    @keyframes tcspin { to { transform: rotate(360deg); } }
    .spotpin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #c99a3c; color: #111; font: 700 17px "WP Display"; border: 2px solid #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.5); pointer-events: none; }
    .spotpin.lead { background: #ffd34d; width: 36px; height: 36px; font-size: 20px; }
    .rowi .n { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--rc); color: #111; font: 700 15px "WP Display"; }
    .rowi i { flex: none; width: 10px; height: 10px; background: var(--rc); }
    .rowi b { font-family: "WP Display"; font-size: 22px; font-weight: 500; text-transform: uppercase; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rowi span { font-family: "WP Mono"; font-size: 13px; letter-spacing: .08em; color: var(--muted); white-space: nowrap; text-transform: uppercase; }
    .rowi em { font-style: normal; font-family: "WP Display"; font-size: 25px; font-weight: 700; }

    .rp { right: 32px; top: 104px; width: 560px; background: rgba(5,9,18,.94); transform: translateX(112%); transition: transform .5s cubic-bezier(.3,.8,.3,1); }
    .rp.show { transform: none; }
    .rp .r1 { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 22px 8px; gap: 12px; }
    .rp h3 { margin: 0; min-width: 0; font-family: "WP Display"; font-size: 34px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rp .clk { flex: none; font-family: "WP Display"; font-size: 34px; font-weight: 700; white-space: nowrap; }
    .rp .clk span { color: #3fa2ff; }
    .rp .under { height: 3px; width: 116px; margin: 0 22px 14px; background: var(--edge); }
    .rp .bar { height: 10px; margin: 0 22px; }
    .rp .lbl { display: flex; justify-content: space-between; padding: 8px 22px 12px; font-family: "WP Mono"; font-size: 11px; letter-spacing: .16em; color: var(--muted); }
    .rp .r3 { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 22px 16px; border-top: 1px solid var(--line); font-family: "WP Mono"; font-size: 16px; font-weight: 700; letter-spacing: .08em; }
    .rp .r3 .st { display: flex; align-items: center; gap: 10px; color: var(--edge); font-family: "WP Display"; font-size: 24px; letter-spacing: .06em; }
    .rp .r3 .st svg { flex: none; width: 34px; height: 34px; overflow: visible; }
    .rp .r3 .st svg path { fill: rgba(51,212,255,.18); stroke: var(--edge); stroke-width: 1.6; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .ticks { display: flex; gap: 3px; padding: 0 22px 12px; }
    .ticks i { flex: 1; height: 3px; background: rgba(255,255,255,.14); }
    .ticks i.on { background: rgba(255,255,255,.6); }
    .ticks i.now { background: var(--edge); }

    .focus { position: absolute; left: 32px; bottom: 156px; z-index: 11; display: none; font-family: "WP Mono"; font-size: 13px; font-weight: 700; letter-spacing: .16em; padding: 7px 10px; background: #ffd34d; color: #111; }
    .reportchip { position: absolute; left: 32px; bottom: 100px; z-index: 11; display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--edge); font-family: "WP Display"; font-size: 24px; font-weight: 700; color: #fff; }
    .reportchip svg { color: #ffc23d; }
    .reportchip small { font-family: "WP Mono"; font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 600; }
    .np { position: absolute; right: 300px; bottom: 104px; z-index: 11; display: none; font-family: "WP Mono"; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: rgba(255,255,255,.75); padding: 5px 10px; background: rgba(9,16,30,.8); border: 1px solid rgba(255,255,255,.12); border-left: 3px solid #33d4ff; white-space: nowrap; }
    .np.show { display: block; }
    .attrib { position: absolute; right: 300px; bottom: 86px; z-index: 11; font-family: "WP Mono"; font-size: 10px; color: rgba(255,255,255,.45); letter-spacing: .04em; }
    .sitemark { display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
    .sitemark i { width: 13px; height: 13px; border-radius: 50%; background: #3fb7ff; border: 2px solid #fff; }
    .sitemark span { font-family: "WP Mono"; font-size: 11px; font-weight: 700; color: #cfe6ff; text-shadow: 0 1px 2px #000; letter-spacing: .08em; }

    /* ---------- WeBot: the artwork, with live eyes and a visor rim drawn over it in the same 384x393 space ---------- */
    .bot { position: absolute; right: 22px; bottom: 88px; width: 250px; height: 256px; z-index: 12; --eye: #5ff2ff; }
    .bot.off { display: none; }
    .bot .rig { position: absolute; left: 0; top: 0; width: 100%; height: 100%; animation: bob 4.5s ease-in-out infinite; }
    .bot .rig img, .bot .rig svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
    .bot .rig img { filter: drop-shadow(0 12px 18px rgba(0,0,0,.55)); }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .bot .eye { fill: var(--eye); transition: fill .4s, transform .09s; transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 0 6px var(--eye)); }
    .bot.blink .eye { transform: scaleY(.12); }
    .bot.talk .eye { animation: talk .2s ease-in-out infinite alternate; }
    .bot.talk .eye + .eye { animation-delay: .1s; }
    @keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(.72); } }
    .bot .rim { stroke: var(--eye); opacity: 0; transition: opacity .4s, stroke .4s; }
    .bot.alert .rim { opacity: .9; }
    .bot.danger .rim { opacity: 1; animation: rim .7s steps(2) infinite; }
    @keyframes rim { 50% { opacity: .15; } }
    /* Thinking: only the eyes glance around. No bubbles anywhere. */
    .bot.think .eye { animation: look 2.6s ease-in-out infinite; }
    @keyframes look { 0%, 100% { transform: translate(0, 0); } 22% { transform: translate(-10px, -5px); } 30% { transform: translate(-10px, -5px) scaleY(.15); } 38% { transform: translate(-10px, -5px); } 65% { transform: translate(10px, -5px); } 82% { transform: translate(10px, -5px); } }
    .card .skewt { display: block; width: calc(100% - 52px); margin: 0 26px 26px; background: #fff; }

    /* ---------- bottom bar ---------- */
    .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; display: flex; background: var(--violet); z-index: 20; }
    .clock { flex: none; width: 350px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: var(--violet-dark); }
    .clock img { width: 50px; height: 50px; }
    .clock b { display: block; font-family: "WP Display"; font-size: 31px; font-weight: 700; line-height: 1; white-space: nowrap; }
    .clock small { display: block; margin-top: 6px; font-family: "WP Mono"; font-size: 12px; letter-spacing: .2em; color: #c9bff5; }
    .now { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 26px; }
    .now .l1 { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .now .l1 .k { flex: none; font-family: "WP Display"; font-size: 31px; font-weight: 700; color: #fff; }
    .now .l1 .k::after { content: ":"; }
    .now .l1 b { font-family: "WP Display"; font-size: 31px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .now .l1 .hz { flex: none; display: flex; gap: 8px; }
    .now .l1 .hz span { font-family: "WP Mono"; font-size: 14px; font-weight: 700; padding: 4px 8px; background: rgba(10,10,40,.45); border: 1px solid rgba(255,255,255,.2); }
    .now .l2 { display: flex; align-items: center; gap: 18px; font-family: "WP Mono"; font-size: 14px; letter-spacing: .1em; color: #e0dafc; min-width: 0; }
    .crawl { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-transform: uppercase; }
    .crawl span { display: inline-block; will-change: transform; }
    .now .ppl { flex: none; }
    .prog { flex: none; width: 150px; height: 6px; background: rgba(0,0,0,.3); overflow: hidden; }
    .prog i { display: block; height: 100%; width: 0; background: #fff; }
    .now .cd { flex: none; width: 76px; text-align: right; font-weight: 700; color: #fff; }
    .brandbox { flex: none; width: 250px; display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--violet-dark); }
    .brandbox img { width: 40px; height: 40px; }
    .brandbox b { font-family: "WP Mono"; font-size: 13px; font-weight: 700; letter-spacing: .14em; white-space: nowrap; }

    /* ---------- breaking takeover ---------- */
    .brk { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--c, #c00); color: var(--ci, #fff); overflow: hidden; text-align: center; }
    .brk.show { display: flex; animation: brkIn .4s ease-out; }
    .brk.out { animation: brkOut .45s forwards; }
    @keyframes brkIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes brkOut { to { clip-path: inset(0 0 0 100%); } }
    .brk .stripes { position: absolute; left: -200px; top: -200px; right: -200px; bottom: -200px; background: repeating-linear-gradient(45deg, rgba(0,0,0,.14) 0 46px, rgba(0,0,0,0) 46px 92px); animation: stripes 1.6s linear infinite; }
    @keyframes stripes { to { transform: translateX(130px); } }
    .brk > *:not(.stripes) { position: relative; }
    .brk .k { font-family: "WP Mono"; font-size: 30px; font-weight: 700; letter-spacing: .5em; padding: 10px 18px 10px 30px; background: #fff; color: #0a0f1c; animation: flash 1s steps(2) infinite; }
    @keyframes flash { 50% { background: #0a0f1c; color: #fff; } }
    .brk h1 { margin: 24px 60px 10px; font-family: "WP Display"; font-size: 156px; font-weight: 700; line-height: .95; text-transform: uppercase; }
    .brk .p { font-family: "WP Display"; font-size: 58px; font-weight: 700; text-transform: uppercase; max-width: 1600px; }
    .brk .u { margin-top: 16px; font-family: "WP Mono"; font-size: 28px; letter-spacing: .2em; }
    .brk .t { margin-top: 16px; display: inline-block; padding: 8px 18px; background: rgba(0,0,0,.3); font-family: "WP Display"; font-size: 30px; letter-spacing: .06em; }
    .brk .test { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); padding: 8px 18px; background: #ffd34d; color: #111; font-family: "WP Mono"; font-size: 20px; letter-spacing: .2em; }

    .gate { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 100; padding: 12px 18px; border: 0; background: #ffd34d; color: #111; font: 700 16px "WP Sans", system-ui, sans-serif; cursor: pointer; }
    .gate[hidden] { display: none; }
    .boot { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 60; display: grid; place-items: center; background: #070b14; font-family: "WP Mono"; letter-spacing: .2em; color: var(--muted); transition: opacity .8s; }
    .boot.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="map"></div>
    <div class="shade"></div>

    <header class="top">
      <div class="tally">

  <button class="gate" id="puter-gate" style="top:72px" hidden>🔑 Sign in to Puter for WeBot's Alloy voice (in OBS: use Live Control → Puter)</button>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
  (() => {
    const BASE = '/warningcenter';
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const P = new URLSearchParams(location.search);
    const OPT = {
      state: (P.get('state') || '').toUpperCase(),
      voice: P.get('voice') !== '0',
      sound: P.get('sound') !== '0',
      bot: P.get('bot') !== '0',
      hat: P.get('hat') !== '0',
      tips: P.get('tips') !== '0',
      music: P.get('music') !== '0',
      tts: ['puter', 'neural', 'openai', 'browser'].includes(P.get('tts')) ? P.get('tts') : '',
      key: P.get('key') || '',
      speed: Math.min(3, Math.max(0.4, Number(P.get('speed')) || 1)),
      tz: P.get('tz') || Intl.DateTimeFormat().resolvedOptions().timeZone
    };
    const STATE_NAMES = {
      AL: 'Alabama', AK: 'Alaska', AZ: 'Arizona', AR: 'Arkansas', CA: 'California', CO: 'Colorado', CT: 'Connecticut', DE: 'Delaware', DC: 'D.C.', FL: 'Florida',
      GA: 'Georgia', HI: 'Hawaii', ID: 'Idaho', IL: 'Illinois', IN: 'Indiana', IA: 'Iowa', KS: 'Kansas', KY: 'Kentucky', LA: 'Louisiana', ME: 'Maine', MD: 'Maryland',
      MA: 'Massachusetts', MI: 'Michigan', MN: 'Minnesota', MS: 'Mississippi', MO: 'Missouri', MT: 'Montana', NE: 'Nebraska', NV: 'Nevada', NH: 'New Hampshire',
      NJ: 'New Jersey', NM: 'New Mexico', NY: 'New York', NC: 'North Carolina', ND: 'North Dakota', OH: 'Ohio', OK: 'Oklahoma', OR: 'Oregon', PA: 'Pennsylvania',
      RI: 'Rhode Island', SC: 'South Carolina', SD: 'South Dakota', TN: 'Tennessee', TX: 'Texas', UT: 'Utah', VT: 'Vermont', VA: 'Virginia', WA: 'Washington',
      WV: 'West Virginia', WI: 'Wisconsin', WY: 'Wyoming', PR: 'Puerto Rico', VI: 'Virgin Islands', GU: 'Guam', AS: 'American Samoa', MP: 'Northern Marianas'
    };
    const ICONS = {
      tornado: '<path d="M3 5h18M5 9h14M7 13h9M9 17h5M11 21h2" stroke-linecap="round"/>',
      flood: '<path d="M2 8c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 13c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 18c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0" stroke-linecap="round"/>',
      storm: '<path d="M13 2 5 13h6l-1 9 8-12h-6l1-8z" stroke-linejoin="round"/>',
      winter: '<path d="M12 2v20M3.5 7l17 10M20.5 7l-17 10" stroke-linecap="round"/>',
      fire: '<path d="M12 22c4 0 7-2.7 7-6.8 0-3.6-2.4-5.7-4.2-8.2-.6 2-1.6 3.2-2.8 3.7.3-3.3-1.2-6.4-4-8.7.2 3.6-3 6.3-3 10.9C5 19.6 8 22 12 22z"/>',
      wind: '<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8" stroke-linecap="round"/>',
      tropical: '<circle cx="12" cy="12" r="3"/><path d="M12 9c0-4 3-7 8-7-2 2-3 4-3 6M12 15c0 4-3 7-8 7 2-2 3-4 3-6" stroke-linecap="round"/>',
      outlook: '<path d="M12 3 2 20h20L12 3zM12 10v4M12 17v.5" stroke-linecap="round"/>',
      radar: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 19 5" stroke-linecap="round"/>',
      reports: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
      alert: '<path d="M12 3 2 20h20L12 3zM12 10v4M12 17v.5" stroke-linecap="round"/>'
    };
    const icon = (key, size = 28) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">' + (ICONS[key] || ICONS.alert) + '</svg>';
    const ink = (hex) => {
      const v = String(hex || '#000').replace('#', '');
      const [r, g, b] = [0, 2, 4].map((o) => parseInt(v.slice(o, o + 2), 16) || 0);
      return 0.299 * r + 0.587 * g + 0.114 * b > 170 ? '#0b0d12' : '#ffffff';
    };
    const LEGENDS = {
      refl: { bar: 'linear-gradient(90deg,#04e9e7,#019ff4 12%,#02fd02 26%,#01c501 36%,#fdf802 50%,#fd9500 62%,#fd0000 74%,#d40000 82%,#f800fd 92%,#fff)', labels: ['LIGHT', 'MODERATE', 'HEAVY', 'EXTREME'] },
      vel: { bar: 'linear-gradient(90deg,#7dff9a,#00c040 22%,#0c4a1c 46%,#3a3a3a 50%,#4d0f0f 54%,#d01010 78%,#ff8a8a)', labels: ['TOWARD RADAR', '', '', 'AWAY FROM RADAR'] }
    };
    const RISK_NAMES = { TSTM: 'General thunderstorms', MRGL: 'Marginal risk', SLGT: 'Slight risk', ENH: 'Enhanced risk', MDT: 'Moderate risk', HIGH: 'High risk' };
    const REPORT_COLORS = { Tornado: '#ff2a2a', 'Funnel Cloud': '#ff7a7a', Waterspout: '#ff7a7a', Hail: '#3fa9ff', Wind: '#ffd400', Damage: '#ffd400', 'Marine Wind': '#ffe680', Flood: '#2ee06f', Rain: '#36c3a4', Snow: '#e6f0ff' };
    const REPORT_UNITS = { Hail: '"', Wind: ' MPH', 'Marine Wind': ' MPH', Rain: '"', Snow: '"' };
    const reportLabel = (r) => r.type + (r.magnitude ? ' ' + r.magnitude + (REPORT_UNITS[r.type] || '') : '');
    const TIPS = [
      'A watch means be prepared. A warning means act now.',
      'Make a plan: know your safe place before storms hit — lowest floor, interior room, away from windows.',
      'Turn around, don’t drown. Just 6 inches of moving water can knock you down.',
      'Have more than one way to get warnings: a weather radio, phone alerts, and WeatherPower.app.',
      'When thunder roars, go indoors. Lightning can strike 10 miles from a storm.',
      'Mobile homes are not safe in a tornado. Know where your nearest sturdy shelter is.',
      'Hail the size of quarters or larger can damage cars and roofs — pull under a sturdy shelter, not an overpass.',
      'Live warnings, radar and video for every alert: WeatherPower.app'
    ];

    const S = {
      alerts: [], live: null, radar: null, sites: [], seen: null, spoken: new Set(), recent: [],
      cycle: 0, shot: null, shotTimer: null, shotStart: 0, shotDur: 1, breaking: [], fresh: [], inBreaking: false,
      lastCmd: null, control: { rev: -1, pin: null, state: '', mode: 'auto', voice: true, sound: true, banner: null },
      map: null, styleReady: false, step: 0, local: null, localKey: '', velOn: false, siteMarker: null, sel: null,
      headlines: [], hlIndex: 0, lastRoundup: Date.now(), lastTip: Date.now()
    };

    /* ---------------- helpers ---------------- */
    const getJson = async (path) => {
      const response = await fetch(BASE + path, { headers: { Accept: 'application/json' }, cache: 'no-store' });
      if (!response.ok) throw new Error(path + ' ' + response.status);
      return response.json();
    };
    const fmtNum = (n) => Number(n).toLocaleString('en-US');
    const shortNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : fmtNum(n);
    const tzClock = (tz, opts = {}) => {
      try { return new Date().toLocaleTimeString('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', ...opts }); } catch { return new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', ...opts }); }
    };
    const tzAbbr = (tz) => {
      try { return new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' }).formatToParts(new Date()).find((p) => p.type === 'timeZoneName').value; } catch { return ''; }
    };
    const remaining = (iso) => {
      const ms = Date.parse(iso || '') - Date.now();
      if (!Number.isFinite(ms)) return '';
      if (ms <= 0) return 'EXPIRED';
      const m = Math.floor(ms / 60000);
      if (m < 60) return m + ' MIN';
      const h = Math.floor(m / 60);
      if (h < 48) return h + ' HR' + (h === 1 ? '' : 'S') + ' ' + (m % 60) + ' MIN';
      return Math.round(h / 24) + ' DAYS';
    };
    const countdown = (iso) => {
      const ms = Date.parse(iso || '') - Date.now();
      if (!Number.isFinite(ms) || ms <= 0) return '';
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
    };
    const ago = (iso) => {
      const m = Math.round((Date.now() - Date.parse(iso || '')) / 60000);
      if (!Number.isFinite(m)) return '';
      return m < 1 ? 'NOW' : m < 60 ? m + ' MIN AGO' : Math.floor(m / 60) + ' HR AGO';
    };
    const focusState = () => S.control.state || OPT.state;
    const voiceOn = () => OPT.voice && S.control.voice !== false;
    // WeBot only talks when the weather is serious (WIS 100+, e.g. any tornado warning), or when Live
    // Control says "Start talking". Quiet mode silences him; typed "Say it" lines always speak.
    const wisScore = () => (S.live?.wis?.loaded ? S.live.wis.score : 0);
    const talkMode = () => S.control.talk || 'auto';
    const talkAllowed = () => talkMode() === 'on' || (talkMode() === 'auto' && wisScore() >= 100);
    // Calm day: below WIS 100 and no tornado warnings. The show slows down and stays mellow.
    const isCalm = () => wisScore() < 100 && !(S.live?.tallies?.tor);
    const soundOn = () => OPT.sound && S.control.sound !== false;
    const byKey = (key) => S.alerts.find((a) => a.key === key);
    const stateLine = (a) => (a.states || []).map((s) => STATE_NAMES[s] || s).join(' & ');

    const eachCoord = (geometry, fn) => {
      if (!geometry) return;
      const walk = (c) => { if (typeof c[0] === 'number') fn(c); else c.forEach(walk); };
      if (geometry.type === 'GeometryCollection') geometry.geometries.forEach((g) => eachCoord(g, fn));
      else walk(geometry.coordinates);
    };
    const bboxOf = (geometry) => {
      let b = null;
      eachCoord(geometry, ([x, y]) => {
        if (!b) b = [x, y, x, y];
        else { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); }
      });
      return b && [[b[0], b[1]], [b[2], b[3]]];
    };
    const centerOf = (a) => {
      if (a.center && Number.isFinite(a.center[0])) return a.center;
      const b = bboxOf(a.geometry);
      return b ? [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2] : null;
    };
    const inRing = ([x, y], ring) => {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i];
        const [xj, yj] = ring[j];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    };
    const inGeometry = (pt, g) => {
      if (!g || !pt) return false;
      if (g.type === 'Polygon') return inRing(pt, g.coordinates[0]);
      if (g.type === 'MultiPolygon') return g.coordinates.some((poly) => inRing(pt, poly[0]));
      if (g.type === 'GeometryCollection') return g.geometries.some((x) => inGeometry(pt, x));
      return false;
    };

    /* ---------------- stage scaling + clocks ---------------- */
    const fit = () => {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080);
      $('stage').style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    };
    addEventListener('resize', fit);
    fit();

    const tickClock = () => {
      $('clk').textContent = tzClock(OPT.tz, { second: '2-digit' }) + ' ' + tzAbbr(OPT.tz);
      $('clk-d').textContent = new Date().toLocaleDateString('en-US', { timeZone: OPT.tz, month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
      const shot = S.shot;
      const tz = shot?.alert?.timezone || OPT.tz;
      // The server's own abbreviation (ChST, SST, AST...) beats the browser's "GMT+10" fallback.
      const ownAbbr = String(shot?.alert?.times?.expires || '').split(' ').pop();
      if (S.modelOn && S.modelValid) {
        // Model shots show the valid time of the frame on screen, not the wall clock.
        const valid = new Date(S.modelValid);
        $('rp-clock').innerHTML = esc(valid.toLocaleString('en-US', { timeZone: OPT.tz, weekday: 'short', hour: 'numeric' }).toUpperCase()) + ' <span>' + esc(tzAbbr(OPT.tz)) + '</span>';
      } else {
        $('rp-clock').innerHTML = esc(tzClock(tz)) + ' <span>' + esc(/^[A-Za-z]{2,5}$/.test(ownAbbr) ? ownAbbr : tzAbbr(tz)) + '</span>';
      }
      if (shot?.alert) {
        const a = shot.alert;
        const exp = $('card-exp');
        if (exp) exp.textContent = 'EXPIRES IN ' + remaining(a.expiresAt) + ' · ' + (a.times?.expires || '');
        const life = $('card-life');
        if (life) {
          const t0 = Date.parse(a.issuedAt), t1 = Date.parse(a.expiresAt);
          life.style.width = Number.isFinite(t0) && Number.isFinite(t1) && t1 > t0 ? Math.max(0, Math.min(100, ((t1 - Date.now()) / (t1 - t0)) * 100)) + '%' : '100%';
        }
        $('now-cd').textContent = countdown(a.expiresAt);
      } else {
        $('now-cd').textContent = '';
      }
      $('prog').style.width = Math.min(100, ((Date.now() - S.shotStart) / S.shotDur) * 100) + '%';
    };
    setInterval(tickClock, 250);

    /* ---------------- sound + voice ---------------- */
    let actx = null;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    const tone = (freq, at, dur, type = 'triangle', peak = 0.16) => {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(peak, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      osc.connect(gain).connect(actx.destination);
      osc.start(at);
      osc.stop(at + dur + 0.05);
    };
    // Custom WeatherPower chimes (deliberately not the EAS attention tone).
    const chime = (kind) => {
      if (!soundOn() || !actx || actx.state !== 'running') return;
      const t = actx.currentTime + 0.03;
      if (kind === 'breaking') {
        for (const rep of [0, 0.75, 1.5]) [523, 784, 1047].forEach((f, i) => tone(f, t + rep + i * 0.15, 0.3, 'triangle', 0.2));
      } else if (kind === 'new') {
        tone(880, t, 0.2); tone(1175, t + 0.15, 0.32);
      } else {
        tone(740, t, 0.16, 'sine', 0.08);
      }
    };

    let voices = [];
    const loadVoices = () => { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; };
    if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
    const pickVoice = () => {
      const en = voices.filter((v) => /^en[-_]US/i.test(v.lang));
      return en.find((v) => /natural/i.test(v.name) && /aria|jenny|guy|davis|andrew|emma|brian/i.test(v.name))
        || en.find((v) => /natural|neural/i.test(v.name))
        || en.find((v) => /google us english/i.test(v.name))
        || en.find((v) => /zira|david|samantha|alex/i.test(v.name))
        || en[0] || voices[0] || null;
    };
    const ZONES = { CDT: 'central', CST: 'central', EDT: 'eastern', EST: 'eastern', MDT: 'mountain', MST: 'mountain', PDT: 'pacific', PST: 'pacific', AKDT: 'Alaska', AKST: 'Alaska', HST: 'Hawaii', AST: 'Atlantic', ChST: 'Chamorro', SST: 'Samoa' };
    const speakable = (text) => String(text || '')
      .replace(/\b(\d{1,2})(\d{2})\s*(AM|PM)\b/gi, '$1:$2 $3')
      .replace(/\b(AM|PM)\s+(CDT|CST|EDT|EST|MDT|MST|PDT|PST|AKDT|AKST|HST|AST|ChST|SST)\b/g, (m, ap, z) => ap + ' ' + ZONES[z] + ' time')
      .replace(/,\s*([A-Z]{2})\b/g, (m, s) => (STATE_NAMES[s] ? ', ' + STATE_NAMES[s] : m))
      .replace(/\bmph\b/gi, 'miles per hour')
      .replace(/(\d)"/g, '$1 inches')
      .replace(/\bJ\/kg\b/g, 'joules per kilogram')
      .replace(/\bdBZ\b/g, 'D B Z')
      .replace(/\b(\d+)°F?/g, '$1 degrees')
      .replace(/\b(HRRR|NAM|GFS|ECMWF|ICON)\b/g, (m) => ({ HRRR: 'H triple R', NAM: 'NAM', GFS: 'G F S', ECMWF: 'European model', ICON: 'ICON' })[m])
      .replace(/\bWPI\b/g, 'W P I')
      .replace(/\bNWS\b/g, 'National Weather Service')
      .replace(/\bSPC\b/g, 'Storm Prediction Center')
      .replace(/\+ (\d+) MORE\b/gi, 'and $1 more')
      .replace(/[A-Z]{3,}(?:\s+[A-Z]{3,})*/g, (m) => (/^(PDS|NWS|SPC|WPI)$/.test(m) ? m : m.toLowerCase()));

    const bot = $('bot');
    // WeBot never shows text bubbles; it only talks. With voice off it just animates.
    const speech = { queue: [], busy: false, guard: null };
    const speechWorks = () => window.speechSynthesis && voices.length > 0;

    // WeBot's voice engines: OpenAI voices (Alloy by default) through Puter.js, billed to the Puter
    // account signed in on this page; OpenAI through the server's own key; a free neural voice
    // (Kokoro, running right here in the page); and the computer's speech voices as the fallback.
    const ttsCfg = () => {
      const cfg = { engine: 'puter', voice: 'af_alloy', openaiVoice: 'alloy', speed: 1, ...(S.control.tts || {}), ...(OPT.tts ? { engine: OPT.tts } : {}) };
      if (cfg.engine === 'openai' && S.openaiVoice === false) cfg.engine = 'neural';
      return cfg;
    };
    const PUTER_JS = 'https://js.puter.com/v2/';
    const VOICE_STYLE = 'You are WeBot, a friendly robot weather broadcaster on a 24/7 live stream. Speak clearly at a steady broadcast pace, warm and upbeat, but serious and urgent about dangerous weather.';
    const pt = { state: 'off', cache: new Map() };
    // Takes the Puter sign-in that Live Control linked (needs the private ?key= from the OBS link).
    const linkPuter = async () => {
      if (!OPT.key || !window.puter) return;
      try {
        const body = await getJson('/api/v3/live/puter?key=' + encodeURIComponent(OPT.key));
        if (body.token) { puter.setAuthToken(body.token); pt.state = 'ready'; pt.linked = true; }
        else if (pt.linked) { puter.setAuthToken(null); pt.state = 'signed-out'; pt.linked = false; }
      } catch (error) {
        console.warn('Puter link:', error.message);
      }
      puterGate();
    };
    const puterGate = () => {
      $('puter-gate').hidden = !(pt.state === 'signed-out' && voiceOn() && ttsCfg().engine === 'puter');
    };
    const startPuter = () => {
      if (pt.state !== 'off') return;
      pt.state = 'loading';
      // On a plain-http network address (http://192.168.x.x) the browser hides crypto.randomUUID,
      // which Puter's sign-in needs. getRandomValues still works there, so rebuild it from that.
      if (window.crypto && typeof crypto.randomUUID !== 'function') {
        crypto.randomUUID = () => '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
      }
      const script = document.createElement('script');
      script.src = PUTER_JS;
      script.onload = async () => {
        pt.state = window.puter?.auth?.isSignedIn() ? 'ready' : 'signed-out';
        if (pt.state !== 'ready' && OPT.key) await linkPuter();
        puterGate();
      };
      script.onerror = () => { pt.state = 'failed'; console.warn('Puter.js did not load'); };
      document.head.appendChild(script);
    };
    // Puter's sign-in opens a popup, so it needs a click (in OBS: right-click the source → Interact).
    // It is remembered in this browser afterwards.
    $('puter-gate').addEventListener('click', async () => {
      try { await puter.auth.signIn(); } catch (error) { console.warn('Puter sign-in:', error?.message || error); }
      pt.state = puter.auth.isSignedIn() ? 'ready' : 'signed-out';
      puterGate();

    const puterAudio = (text, cfg) => {
      const key = cfg.openaiVoice + '|' + cfg.speed + '|' + text;
      if (pt.cache.has(key)) return Promise.resolve(pt.cache.get(key));
      const pace = cfg.speed > 1.05 ? ' Talk a little faster than normal.' : cfg.speed < 0.95 ? ' Talk a little slower than normal.' : '';
      return puter.ai.txt2speech(text, { provider: 'openai', model: 'gpt-4o-mini-tts', voice: cfg.openaiVoice, instructions: VOICE_STYLE + pace })
        // Decoded audio plays through Web Audio like the other engines; if the clip can't be
        // fetched, the audio element Puter returned plays as-is.
        .then((el) => fetch(el.src).then((r) => r.arrayBuffer()).then((bytes) => actx.decodeAudioData(bytes)).catch(() => el))
        .then((audio) => {
          if (audio instanceof AudioBuffer) {
            pt.cache.set(key, audio);
            if (pt.cache.size > 80) pt.cache.delete(pt.cache.keys().next().value);
          }
          return audio;
        })
        .catch((error) => {
          if (!puter.auth.isSignedIn()) { pt.state = 'signed-out'; puterGate(); }
          throw error;
        });
    };
    const voiceBus = actx ? actx.createGain() : null;
    voiceBus?.connect(actx.destination);
    const KOKORO_JS = 'https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js';
    const neural = { worker: null, state: 'off', device: '', seq: 0, waits: new Map() };
    const startNeural = () => {
      if (neural.worker || neural.state === 'failed' || !actx || typeof Worker === 'undefined') return;
      // The model (~90 MB) downloads once and is cached by the browser. It runs in a worker so
      // the map never stutters while WeBot thinks of the words.
      const src = `import { KokoroTTS } from '${KOKORO_JS}';
        const MODEL = 'onnx-community/Kokoro-82M-v1.0-ONNX';
        let tts = null;
        const load = (async () => {
          tts = await KokoroTTS.from_pretrained(MODEL, { dtype: 'q8', device: 'wasm' });
          postMessage({ type: 'ready', device: 'wasm' });
        })().catch((e) => postMessage({ type: 'failed', error: String((e && e.message) || e) }));
        onmessage = async (event) => {
          const { id, text, voice, speed } = event.data;
          try {
            await load;
            const out = await tts.generate(text, { voice, speed });
            postMessage({ type: 'audio', id, samples: out.audio, rate: out.sampling_rate }, [out.audio.buffer]);
          } catch (e) {
            postMessage({ type: 'audio', id, error: String((e && e.message) || e) });
          }
        };`;
      try {
        neural.worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })), { type: 'module' });
      } catch (error) {
        neural.state = 'failed';
        return;
      }
      neural.state = 'loading';
      neural.worker.onmessage = ({ data }) => {
        if (data.type === 'ready') { neural.state = 'ready'; neural.device = data.device; return; }
        if (data.type === 'failed') {
          console.warn('Neural voice unavailable:', data.error);
          neural.state = 'failed';
          neural.worker.terminate();
          neural.waits.forEach((w) => w.reject(new Error(data.error)));
          neural.waits.clear();
          return;
        }
        const wait = neural.waits.get(data.id);
        if (!wait) return;
        neural.waits.delete(data.id);
        if (data.error) { wait.reject(new Error(data.error)); return; }
        const buffer = actx.createBuffer(1, data.samples.length, data.rate);
        buffer.copyToChannel(data.samples, 0);
        wait.resolve(buffer);
      };
      neural.worker.onerror = (event) => { console.warn('Neural voice worker error:', event.message); neural.state = 'failed'; };
    };
    const neuralAudio = (text, voice, speed) => new Promise((resolve, reject) => {
      const id = ++neural.seq;
      neural.waits.set(id, { resolve, reject });
      neural.worker.postMessage({ id, text, voice, speed });
    });
    // Starts making the audio as soon as a line is queued, so the next sentence is ready when this one ends.
    const synth = (text) => {
      const cfg = ttsCfg();
      if (cfg.engine === 'puter' && pt.state === 'ready') return puterAudio(text, cfg);
      if (cfg.engine === 'neural' && neural.state === 'ready') return neuralAudio(text, cfg.voice, cfg.speed);
      if (cfg.engine === 'openai' && S.openaiVoice) {
        return fetch(BASE + '/api/v3/live/tts?' + new URLSearchParams({ text, voice: cfg.openaiVoice, speed: cfg.speed }))
          .then((r) => { if (!r.ok) throw new Error('voice ' + r.status); return r.arrayBuffer(); })
          .then((bytes) => actx.decodeAudioData(bytes));
      }
      return null;
    };
    const ttsLabel = () => {
      const cfg = ttsCfg();
      if (cfg.engine === 'neural') return 'neural ' + neural.state + ' · ' + cfg.voice;
      if (cfg.engine === 'openai') return 'openai · ' + cfg.openaiVoice;
      if (cfg.engine === 'puter') return 'puter ' + ({ ready: 'openai ' + cfg.openaiVoice, 'signed-out': 'needs sign-in' }[pt.state] || pt.state);
      return 'computer voice';
    };
    const canNeural = () => {
      const engine = ttsCfg().engine;
      return (engine === 'puter' && pt.state === 'ready') || (engine === 'neural' && neural.state === 'ready') || (engine === 'openai' && S.openaiVoice);
    };

    const browserSpeak = (item, done) => {
      if (!speechWorks()) { done(); return; }
      const utter = new SpeechSynthesisUtterance(item.text);
      utter.voice = pickVoice();
      utter.rate = 1.04 * (ttsCfg().speed || 1);
      utter.pitch = 1.02;
      utter.onstart = () => bot.classList.add('talk');
      utter.onend = done;
      utter.onerror = done;
      speech.guard = setTimeout(() => { speechSynthesis.cancel(); done(); }, 4000 + item.text.length * 95);
      speechSynthesis.speak(utter);
    };
    const pumpSpeech = async () => {
      if (speech.busy || !speech.queue.length) return;
      const item = speech.queue.shift();
      speech.busy = true;
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        clearTimeout(speech.guard);
        speech.busy = false;
        if (!speech.queue.length) bot.classList.remove('talk');
        setTimeout(pumpSpeech, 160);
      };
      // Spoken lines never get a caption.
      if (item.audio) {
        try {
          const buffer = await Promise.race([item.audio, new Promise((resolve, reject) => setTimeout(() => reject(new Error('timed out')), 30000))]);
          if (buffer instanceof HTMLMediaElement) {
            buffer.onended = done;
            buffer.onerror = done;
            bot.classList.add('talk');
            await buffer.play();
            speech.guard = setTimeout(done, ((buffer.duration || 20) + 2) * 1000);
            return;
          }
          const source = actx.createBufferSource();
          source.buffer = buffer;
          source.connect(voiceBus);
          source.onended = done;
          bot.classList.add('talk');
          source.start();
          speech.guard = setTimeout(done, buffer.duration * 1000 + 2000);
          return;
        } catch (error) {
          console.warn('Voice fell back to the computer voice:', error.message);
        }
      }
      browserSpeak(item, done);
    };
    // Sentences go out one at a time: Chrome cuts off long single utterances, and short lines
    // let the neural voice start talking sooner.
    const say = (text, opts = {}) => {
      if (!text) return;
      if (!opts.force && !talkAllowed()) return;
      if (!voiceOn() || !(canNeural() || speechWorks()) || (actx && actx.state !== 'running')) {
        bot.classList.add('talk');
        setTimeout(() => bot.classList.remove('talk'), Math.min(6000, 1200 + text.length * 30));
        return;
      }
      // Split on sentence ends only: not inside decimals (1.6 inches) or abbreviations (U.S., St., Mt.).
      const SAFE = '․';
      const guarded = speakable(text)
        .replace(/(\d)\.(\d)/g, '$1' + SAFE + '$2')
        .replace(/\b(U\.S|St|Mt|Dr|Ave|Rd|Hwy|Ft|Jr|Sr|vs)\./g, (m, w) => w.replace(/\./g, SAFE) + SAFE);
      const parts = (guarded.match(/[^.!?]+[.!?]*/g) || [guarded]).map((p) => p.split(SAFE).join('.'));
      parts.map((p) => p.trim()).filter(Boolean).forEach((p) => {
        const audio = synth(p);
        audio?.catch(() => {});
        speech.queue.push({ text: p, audio, force: Boolean(opts.force) });
      });
      pumpSpeech();
    };

    const gate = $('gate');
    const checkAudio = () => {
      const blocked = actx && actx.state !== 'running';
      gate.hidden = !(blocked && (OPT.sound || OPT.voice));
    };
    // Sound starts on its own: OBS lets it play right away, and a browser starts it the moment anything
    // is clicked or pressed (or straight away if the site is allowed to play sound). No announcement.
    const startAudio = () => actx?.resume?.().then(checkAudio).catch(() => {});
    ['pointerdown', 'keydown', 'touchstart'].forEach((type) => addEventListener(type, startAudio, { passive: true }));
    gate.addEventListener('click', startAudio);
    startAudio();
    const audioRetry = setInterval(() => { if (!actx || actx.state === 'running') { clearInterval(audioRetry); checkAudio(); } else startAudio(); }, 2000);
    // The reminder only shows if sound is still blocked after a while, never on a stream that already plays.
    setTimeout(checkAudio, 6000);

    /* ---------------- background music ---------------- */
    // WeBot Radio is lo-fi music composed live in the page (electric piano, pads, bass, soft drums,
    // vinyl crackle): free, endless, and nothing for YouTube Content ID to flag. Its mood follows
    // the weather. Your own tracks in public/music can play instead.
    const RADIO_NAMES = {
      calm: ['Clear Skies', 'Dew Point', 'Warm Front', 'High Pressure', 'Fair Weather', 'Morning Fog', 'Light Breeze', 'Sunday Radar'],
      chill: ['Night Shift', 'Overnight Radar', 'Low Clouds', 'Outflow', 'Mesoscale', 'Watch Box', 'Chaser Coffee', 'Data Feed'],
      tense: ['Supercell Season', 'Hook Echo', 'Wall Cloud', 'Dryline', 'Rear Flank', 'Couplet', 'Inflow', 'Bounded Weak Echo']
    };
    const CHORDS = { maj7: [0, 4, 7, 11], maj9: [0, 4, 7, 11, 14], m7: [0, 3, 7, 10], m9: [0, 3, 7, 10, 14], m11: [0, 3, 7, 10, 14, 17], dom9: [0, 4, 7, 10, 14], sus: [0, 5, 7, 10, 14] };
    const PROGS = {
      calm: [[[0, 'maj9'], [9, 'm9'], [2, 'm9'], [7, 'sus']], [[5, 'maj9'], [4, 'm7'], [2, 'm9'], [0, 'maj9']], [[0, 'maj7'], [5, 'maj9'], [9, 'm9'], [5, 'maj9']]],
      chill: [[[2, 'm9'], [7, 'dom9'], [0, 'maj9'], [9, 'm9']], [[9, 'm9'], [5, 'maj9'], [0, 'maj7'], [7, 'sus']], [[4, 'm7'], [9, 'm9'], [2, 'm9'], [7, 'dom9']]],
      tense: [[[0, 'm9'], [8, 'maj7'], [5, 'm9'], [7, 'm7']], [[0, 'm11'], [0, 'm11'], [8, 'maj9'], [10, 'sus']], [[0, 'm9'], [3, 'maj7'], [8, 'maj7'], [7, 'sus']]]
    };
    const STYLES = {
      calm: { bpm: [70, 78], keys: [60, 62, 65, 67], bars: 2, kick: '1000000000100000', snare: '0000100000001000', hat: '1010101010101010', stab: [0], mel: 0.16, scale: [0, 2, 4, 7, 9], pad: 0.7, tone: 6200 },
      chill: { bpm: [80, 88], keys: [57, 60, 62, 64], bars: 1, kick: '1000000010100000', snare: '0000100000001000', hat: '1111111111111111', stab: [0, 6, 11], mel: 0.2, scale: [0, 2, 4, 7, 9], pad: 0.5, tone: 7000 },
      tense: { bpm: [64, 70], keys: [57, 55, 52, 50], bars: 2, kick: '1000000010000000', snare: '0000000000001000', hat: '0010001000100010', stab: [], arp: true, mel: 0.07, scale: [0, 3, 5, 7, 10], pad: 1, tone: 3800 }
    };
    const makeRadio = (ctx, out, opts = {}) => {
      const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const rnd = (a, b) => a + Math.random() * (b - a);
      const pick = (list) => list[Math.floor(Math.random() * list.length)];
      const rate = ctx.sampleRate;
      const noise = ctx.createBuffer(1, rate, rate);
      { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      const ir = ctx.createBuffer(2, Math.floor(rate * 2.6), rate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }

      const master = ctx.createGain();
      master.gain.value = opts.gain ?? 0.8;
      const tone = ctx.createBiquadFilter();
      tone.type = 'lowpass'; tone.frequency.value = 6200; tone.Q.value = 0.3;
      const glue = ctx.createDynamicsCompressor();
      glue.threshold.value = -20; glue.ratio.value = 3; glue.attack.value = 0.01; glue.release.value = 0.25;
      master.connect(tone).connect(glue).connect(out);
      const verbIn = ctx.createGain();
      verbIn.gain.value = 0.3;
      const verb = ctx.createConvolver();
      verb.buffer = ir;
      verbIn.connect(verb).connect(master);
      const echo = ctx.createDelay(2);
      const echoTone = ctx.createBiquadFilter();
      echoTone.type = 'lowpass'; echoTone.frequency.value = 2400;
      const echoFb = ctx.createGain();
      echoFb.gain.value = 0.33;
      echo.connect(echoTone).connect(echoFb).connect(echo);
      echoTone.connect(master);
      const drums = ctx.createBiquadFilter();
      drums.type = 'lowpass'; drums.frequency.value = 5200;
      drums.connect(master);
      // Slow tape wobble on the keys.
      const wob = ctx.createOscillator();
      wob.frequency.value = 0.31;
      const wobAmt = ctx.createGain();
      wobAmt.gain.value = 6;
      wob.connect(wobAmt);
      wob.start();
      const crackleBuf = ctx.createBuffer(1, rate * 3, rate);
      { const d = crackleBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.02 + (Math.random() < 0.0004 ? (Math.random() * 2 - 1) * 0.7 : 0); }
      const crackle = ctx.createBufferSource();
      crackle.buffer = crackleBuf; crackle.loop = true;
      const crackleTone = ctx.createBiquadFilter();
      crackleTone.type = 'bandpass'; crackleTone.frequency.value = 3000; crackleTone.Q.value = 0.5;
      const crackleGain = ctx.createGain();
      crackleGain.gain.value = 0.06;
      crackle.connect(crackleTone).connect(crackleGain).connect(master);
      crackle.start();

      const env = (param, t, peak, attack, decay, floor = 0.0001) => {
        param.setValueAtTime(0.0001, t);
        param.exponentialRampToValueAtTime(peak, t + attack);
        param.exponentialRampToValueAtTime(Math.max(0.0001, floor), t + attack + decay);
      };
      const wobble = (osc) => {
        wobAmt.connect(osc.detune);
        osc.onended = () => { try { wobAmt.disconnect(osc.detune); } catch {} };
      };
      // Electric piano: a two-operator FM voice with a soft bell attack.
      const ep = (m, t, dur, vel) => {
        const f = mtof(m);
        const car = ctx.createOscillator();
        const mod = ctx.createOscillator();
        car.frequency.value = f; mod.frequency.value = f;
        const modDepth = ctx.createGain();
        env(modDepth.gain, t, f * 1.3 * vel, 0.005, 0.6, f * 0.06);
        mod.connect(modDepth).connect(car.frequency);
        const g = ctx.createGain();
        env(g.gain, t, 0.06 * vel, 0.006, dur);
        car.connect(g);
        g.connect(master); g.connect(verbIn);
        wobble(car);
        car.start(t); mod.start(t);
        car.stop(t + dur + 0.1); mod.stop(t + dur + 0.1);
      };
      const bell = (m, t, vel) => {
        const f = mtof(m);
        const car = ctx.createOscillator();
        const mod = ctx.createOscillator();
        car.frequency.value = f; mod.frequency.value = f * 3.5;
        const modDepth = ctx.createGain();
        env(modDepth.gain, t, f * 0.9 * vel, 0.004, 0.35);
        mod.connect(modDepth).connect(car.frequency);
        const g = ctx.createGain();
        env(g.gain, t, 0.045 * vel, 0.005, 1.3);
        car.connect(g);
        g.connect(master); g.connect(verbIn); g.connect(echo);
        car.start(t); mod.start(t);
        car.stop(t + 1.5); mod.stop(t + 1.5);
      };
      const pad = (notes, t, dur, level) => {
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, t);
        filter.frequency.linearRampToValueAtTime(1000, t + dur * 0.5);
        filter.frequency.linearRampToValueAtTime(550, t + dur + 0.8);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.014 * level, t + Math.min(1.4, dur * 0.4));
        g.gain.setValueAtTime(0.014 * level, t + dur - 0.2);
        g.gain.linearRampToValueAtTime(0, t + dur + 0.8);
        filter.connect(g);
        g.connect(master); g.connect(verbIn);
        notes.slice(0, 4).forEach((m) => [-8, 8].forEach((cents) => {
          const o = ctx.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = cents;
          o.connect(filter);
          o.start(t); o.stop(t + dur + 0.9);
        }));
      };
      const bass = (m, t, dur, vel) => {
        const tri = ctx.createOscillator();
        const sub = ctx.createOscillator();
        tri.type = 'triangle';
        tri.frequency.value = mtof(m); sub.frequency.value = mtof(m);
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 380;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2 * vel, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.11 * vel, t + 0.25);
        g.gain.setValueAtTime(0.11 * vel, Math.max(t + 0.26, t + dur - 0.06));
        g.gain.exponentialRampToValueAtTime(0.0001, Math.max(t + 0.32, t + dur));
        tri.connect(filter); sub.connect(filter);
        filter.connect(g).connect(master);
        tri.start(t); sub.start(t);
        tri.stop(t + dur + 0.4); sub.stop(t + dur + 0.4);
      };
      const hit = (t, freq, type, q, peak, decay, dest = drums) => {
        const src = ctx.createBufferSource();
        src.buffer = noise;
        const filter = ctx.createBiquadFilter();
        filter.type = type; filter.frequency.value = freq; filter.Q.value = q;
        const g = ctx.createGain();
        env(g.gain, t, peak, 0.002, decay);
        src.connect(filter).connect(g).connect(dest);
        src.start(t, Math.random() * 0.5, decay + 0.05);
        return g;
      };
      const kick = (t, vel) => {
        const o = ctx.createOscillator();
        o.frequency.setValueAtTime(130, t);
        o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
        const g = ctx.createGain();
        env(g.gain, t, 0.7 * vel, 0.003, 0.4);
        o.connect(g).connect(drums);
        o.start(t); o.stop(t + 0.5);
      };
      const snare = (t, vel) => {
        hit(t, 1700, 'bandpass', 0.7, 0.2 * vel, 0.2).connect(verbIn);
        const o = ctx.createOscillator();
        o.type = 'triangle'; o.frequency.value = 185;
        const g = ctx.createGain();
        env(g.gain, t, 0.09 * vel, 0.002, 0.09);
        o.connect(g).connect(drums);
        o.start(t); o.stop(t + 0.15);
      };
      const hat = (t, vel, open) => hit(t, 7200, 'highpass', 0.5, 0.05 * vel, open ? 0.22 : 0.04);

      let track = null;
      let step = 0;
      let nextAt = ctx.currentTime + 0.1;
      let wantMood = opts.mood || 'calm';
      let melIdx = 2;
      const voicing = (root, quality) => {
        let base = root;
        while (base > 55) base -= 12;
        while (base < 48) base += 12;
        return CHORDS[quality].map((iv) => base + iv);
      };
      const newTrack = (mood) => {
        const style = STYLES[mood];
        let name = pick(RADIO_NAMES[mood]);
        if (track && name === track.name) name = pick(RADIO_NAMES[mood]);
        track = { mood, style, name, key: pick(style.keys), bpm: Math.round(rnd(style.bpm[0], style.bpm[1])), prog: pick(PROGS[mood]), bars: 48 };
        step = opts.skipIntro && !api.started ? 4 * 16 : 0;
        api.started = true;
        tone.frequency.setTargetAtTime(style.tone, Math.max(ctx.currentTime, nextAt), 1.5);
        api.onTrack?.(track);
      };
      const playStep = (t) => {
        const st = track.style;
        const s16 = step % 16;
        const bar = Math.floor(step / 16);
        const sec16 = 60 / track.bpm / 4;
        const [deg, quality] = track.prog[Math.floor(bar / st.bars) % track.prog.length];
        const root = track.key + deg;
        const notes = voicing(root, quality);
        let low = root;
        while (low > 45) low -= 12;
        while (low < 33) low += 12;
        const intro = bar < 4;
        const outro = bar >= track.bars - 4;
        const breakdown = bar >= 24 && bar < 28;
        const drumsOn = !intro && !outro && !breakdown;
        const fade = outro ? 1 - (bar - (track.bars - 4) + s16 / 16) / 5 : 1;
        if (bar % st.bars === 0 && s16 === 0) pad(notes, t, sec16 * 16 * st.bars, st.pad * fade);
        if (st.stab.includes(s16)) {
          const first = s16 === 0;
          const dur = first ? sec16 * 14 : sec16 * 5;
          notes.forEach((m, i) => ep(m, t + i * 0.012, dur, (first ? 1 : 0.6) * rnd(0.8, 1) * fade));
        }
        if (st.arp && s16 % 2 === 0) ep(notes[(s16 / 2) % notes.length] + 12, t, sec16 * 3, 0.5 * rnd(0.8, 1) * fade);
        if (s16 === 0) bass(low, t, sec16 * (st.arp ? 7 : st.bars === 2 ? 12 : 9), fade);
        else if (st.arp && s16 % 4 === 0 && !intro) bass(low, t, sec16 * 1.8, 0.6 * fade);
        else if (s16 === 10 && !st.arp && !intro) bass(low + (Math.random() < 0.5 ? 7 : 12), t, sec16 * 5, 0.7 * fade);
        if (drumsOn) {
          if (st.kick[s16] === '1') kick(t, rnd(0.85, 1));
          else if ((s16 === 7 || s16 === 15) && Math.random() < 0.1) kick(t, 0.45);
          if (st.snare[s16] === '1') snare(t, rnd(0.8, 1));
          if (st.hat[s16] === '1') hat(t, (s16 % 4 === 0 ? 0.9 : s16 % 2 === 0 ? 0.65 : 0.4) * rnd(0.8, 1), s16 === 14 && Math.random() < 0.2);
        }
        if (!intro && s16 % 2 === 0 && Math.random() < st.mel * fade) {
          melIdx = Math.max(0, Math.min(9, melIdx + pick([-2, -1, -1, 1, 1, 2])));
          const scaleNote = st.scale[melIdx % 5] + 12 * Math.floor(melIdx / 5);
          bell(track.key + 12 + scaleNote, t, rnd(0.5, 1));
        }
      };
      const api = {
        started: false,
        onTrack: null,
        get track() { return track; },
        setMood(mood) { if (STYLES[mood]) wantMood = mood; },
        next() { nextAt = Math.max(nextAt, ctx.currentTime + 0.05); newTrack(wantMood); },
        // Schedule every note up to time `until` (seconds on the audio clock).
        schedule(until) {
          if (!track) newTrack(wantMood);
          if (nextAt < ctx.currentTime - 0.2) nextAt = ctx.currentTime + 0.05;
          while (nextAt < until) {
            // Storms take over right away (at the next bar); calmer moods wait for the song to end.
            if (step % 16 === 0 && track.mood !== wantMood && (wantMood === 'tense' || track.mood === 'tense')) newTrack(wantMood);
            const sec16 = 60 / track.bpm / 4;
            playStep(nextAt + (step % 2 ? sec16 * 0.22 : 0));
            nextAt += sec16;
            step += 1;
            if (step >= track.bars * 16) newTrack(wantMood);
          }
        },
        stop() {
          try { crackle.stop(); wob.stop(); } catch {}
          master.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
          setTimeout(() => { try { master.disconnect(); } catch {} }, 2000);
        }
      };
      return api;
    };
    window.WeBotRadio = { makeRadio };

    const musicCfg = () => ({ on: true, volume: 35, source: 'auto', mood: 'auto', duck: true, ...(S.control.music || {}) });
    const M = { bus: null, duck: null, radio: null, timer: null, el: null, files: [], filesAt: 0, order: [], idx: -1, playing: '', mode: '', mood: '', fading: false, fails: 0 };
    const autoMood = () => {
      const t = S.live?.tallies || {};
      const level = S.live?.wis?.level || '';
      if (S.inBreaking || t.tor || ['active', 'intense', 'extreme'].includes(level)) return 'tense';
      if (level === 'elevated' || (t.svr || 0) + (t.ffw || 0) >= 8) return 'chill';
      return 'calm';
    };
    const loadMusicFiles = async () => {
      if (Date.now() - M.filesAt < 5 * 60 * 1000) return;
      M.filesAt = Date.now();

    };
    const renderNp = () => {

    const nextFile = () => {

    const startRadio = () => {

    const musicTick = () => {

      const mode = !on ? '' : (cfg.source === 'files' || cfg.source === 'auto') && M.files.length ? 'files' : 'radio';
      M.mood = cfg.mood === 'auto' ? autoMood() : cfg.mood;
      M.radio?.setMood(M.mood);
      const now = actx.currentTime;
      if (mode !== M.mode) {
        if (M.fading) return;
        if (M.mode) {

        }

        if (mode === 'radio') startRadio();

      M.bus.gain.setTargetAtTime(M.mode ? Math.pow(cfg.volume / 100, 1.2) : 0, now, 0.4);
      // Duck under WeBot's voice, and nearly mute for a breaking alert.

    /* ---------------- bot ---------------- */
    const hatSvg = () => {

      map.addLayer({ id: 'sel-line', type: 'line', source: 'alerts', filter: ['==', ['get', 'key'], ''], paint: { 'line-color': '#ffffff', 'line-width': 4.5 } });

      map.addLayer({ id: 'reports', type: 'circle', source: 'reports', paint: { 'circle-radius': 6, 'circle-color': ['get', 'color'], 'circle-stroke-width': 2, 'circle-stroke-color': '#000' } });
      S.styleReady = true;
    };
    const setSelected = (key) => {
      S.sel = key || '';

      S.map.setFilter('sel-line', ['==', ['get', 'key'], S.sel]);
    };
    setInterval(() => {
      if (S.styleReady && S.sel) S.map.setPaintProperty('sel-line', 'line-opacity', 0.55 + 0.45 * Math.abs(Math.sin(Date.now() / 420)));
    }, 90);
    const setOutlookVisible = (on) => {

      ['o-fill', 'o-line'].forEach((id) => S.map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
      ['a-fill', 'a-case', 'a-line', 'w-line'].forEach((id) => S.map.setLayoutProperty(id, 'visibility', on ? 'none' : 'visible'));
    };

    const nearestSite = (pt) => {
      if (!pt || !S.sites.length) return null;
      let best = null;
      let bestD = Infinity;
      const cos = Math.cos((pt[1] * Math.PI) / 180);
      for (const s of S.sites) {
        const dx = (s.lon - pt[0]) * cos;
        const dy = s.lat - pt[1];
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = s; }
      }
      return Math.sqrt(bestD) * 111 < 420 ? best : null;
    };
    const siteLabel = (s) => (['AK', 'HI', 'GU'].includes(s.state) ? 'P' : s.state === 'PR' ? 'T' : 'K') + s.id;
    const clearLocal = () => {
      if (!S.styleReady) return;
      (S.local?.reflectivity || []).forEach((_, i) => { if (S.map.getLayer('lr' + i)) { S.map.removeLayer('lr' + i); S.map.removeSource('lr' + i); } });
      if (S.map.getLayer('vel')) { S.map.removeLayer('vel'); S.map.removeSource('vel'); }
      S.local = null;
      S.localKey = '';
      S.velOn = false;
      S.siteMarker?.remove();
      S.siteMarker = null;
    };
    const loadLocal = async (site) => {

        S.map.addLayer({ id: 'lr' + i, type: 'raster', source: 'lr' + i, paint: { 'raster-opacity': 0, 'raster-fade-duration': 0 } }, 'a-fill');
      });

        S.map.addLayer({ id: 'vel', type: 'raster', source: 'vel', layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.9, 'raster-fade-duration': 0 } }, 'a-fill');
      }
      S.local = { ...body, site };
      const el = document.createElement('div');
      el.className = 'sitemark';
      el.innerHTML = '<i></i><span>' + esc(siteLabel(site)) + '</span>';
      S.siteMarker = new maplibregl.Marker({ element: el, anchor: 'top' }).setLngLat([site.lon, site.lat]).addTo(S.map);
      renderRadarPanel();
    };
    const setVelocity = (on) => {

    /* radar loop: both the national composite and the local site loop step together */

    const animate = () => {

      for (let k = 0; k < localN; k += 1) S.map.setPaintProperty('lr' + k, 'raster-opacity', !S.velOn && k === li ? 0.88 : 0);
      const frames = localN ? S.local.reflectivity : S.radar?.reflectivity || [];

      const frame = S.velOn ? S.local.velocity : frames[idx];
      if (frame) $('rp-site').dataset.time = new Date(frame.time).toLocaleTimeString('en-US', { timeZone: S.shot?.alert?.timezone || OPT.tz, hour: 'numeric', minute: '2-digit' });

    // State outline next to the state name in the radar box (US Census shapes via us-atlas).
    const SHAPES = { ready: null, byName: new Map(), nation: null, cache: new Map() };
    const loadShapes = () => SHAPES.ready || (SHAPES.ready = (async () => {

        tag.onload = resolve;
        tag.onerror = reject;
        document.head.appendChild(tag);
      });

      topojson.feature(topo, topo.objects.states).features.forEach((f) => SHAPES.byName.set(f.properties.name, f.geometry));
      // The lower 48 for the national view (Alaska, Hawaii and territories would shrink it to a speck).
      const lower48 = topo.objects.states.geometries.filter((g) => !['Alaska', 'Hawaii', 'Puerto Rico', 'Guam', 'American Samoa', 'Commonwealth of the Northern Mariana Islands', 'United States Virgin Islands'].includes(g.properties.name));
      SHAPES.nation = topojson.merge(topo, lower48);
    })().catch((error) => { console.warn('State shapes unavailable:', error.message); }));
    const shapeSvg = (geometry) => {
      if (!geometry) return '';
      const polys = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.type === 'MultiPolygon' ? geometry.coordinates : [];
      // Alaska's Aleutians cross the date line: keep everything on the west side.
      const ring = (r) => r.map(([lon, lat]) => [lon > 0 ? lon - 360 : lon, lat]);
      const rings = polys.map((p) => ring(p[0]));
      const all = rings.flat();
      if (!all.length) return '';
      const lats = all.map((p) => p[1]);
      const k = Math.cos((((Math.min(...lats) + Math.max(...lats)) / 2) * Math.PI) / 180);
      const xs = all.map((p) => p[0] * k);
      const ys = all.map((p) => -p[1]);
      const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
      const scale = 32 / Math.max(x1 - x0, y1 - y0);
      const ox = (34 - (x1 - x0) * scale) / 2;
      const oy = (34 - (y1 - y0) * scale) / 2;
      // Tiny islands are dropped so the outline stays clean at icon size.
      const d = rings.filter((r) => r.length > 8).map((r) => 'M' + r.map(([lon, lat]) => ((lon * k - x0) * scale + ox).toFixed(1) + ',' + ((-lat - y0) * scale + oy).toFixed(1)).join('L') + 'Z').join('');
      return '<svg viewBox="0 0 34 34" aria-hidden="true"><path d="' + d + '"/></svg>';
    };
    // label: text to show; code: two-letter state, or 'US' for the lower 48.
    const setRpState = (label, code) => {

        if (svg == null) {
          svg = key === 'US' ? shapeSvg(SHAPES.nation) : shapeSvg(SHAPES.byName.get(STATE_NAMES[key]));
          SHAPES.cache.set(key, svg);

        el.innerHTML = esc(label) + svg;

    const renderRadarPanel = () => {

      if (S.local) $('rp-site').textContent = siteLabel(S.local.site) + ' • ' + (S.velOn ? 'VELOCITY' : '0.5° SUPER-RES') + (time ? ' • ' + time : '');
      else $('rp-site').textContent = 'MRMS COMPOSITE' + (time ? ' • ' + time : '');

    const setTally = (id, n) => {
