      const b = bboxOf({ type: 'MultiPoint', coordinates: reports.map((r) => [r.lon, r.lat]) });
      fly(b, { padding: { top: 160, bottom: 150, left: 620, right: 640 }, maxZoom: 7 });
      setNow({ k: 'REPORTS', title: reports.length + ' storm reports in the last 3 hours', color: '#ffd34d', crawl: latest.map((r) => r.type + ' · ' + r.city + ', ' + r.state + (r.remark ? ' — ' + r.remark : '')).join('   ◆   ') });
    };

    /* ---------------- breaking + speech text ---------------- */
    const article = (word) => (/^[aeiou]/i.test(word) ? 'an' : 'a');
    const spokenAlert = (a, lead) => {
      const place = (a.area || stateLine(a) || a.place || '')
        .replace(/,\s*([A-Z]{2})\b/g, (m, st) => ', ' + (STATE_NAMES[st] || st))
        .replace(/\b[A-Z][A-Z']+\b/g, (w) => w.charAt(0) + w.slice(1).toLowerCase());
      const until = a.times?.expires ? ' until ' + a.times.expires : '';
      let text = lead + article(a.event) + ' ' + a.event.toLowerCase() + ' is in effect for ' + place + until + '.';
      if (a.summary) text += ' ' + a.summary;
      if (a.people) text += ' About ' + shortNum(a.people).replace('K', ' thousand').replace('M', ' million') + ' people are in the warning.';
      if (a.rank <= 2) text += ' If you are in this area, take shelter now.';
      return text;
    };
    const showBreaking = (a, test) => new Promise((resolve) => {
      const brk = $('brk');
      brk.style.setProperty('--c', a.color || '#c00');
      brk.style.setProperty('--ci', ink(a.color || '#c00'));
      brk.innerHTML = '<div class="stripes"></div>' + (test ? '<div class="test">TEST · NOT A NEW ALERT</div>' : '')
        + '<div class="k">BREAKING</div><h1>' + esc(a.eventLabel) + '</h1>'
        + '<div class="p">' + esc(a.area || stateLine(a)) + '</div>'
        + '<div class="u">UNTIL ' + esc(a.times?.expires || '') + (a.people ? ' · ~' + esc(shortNum(a.people)) + ' PEOPLE' : '') + '</div>'
        + (a.threat ? '<div class="t">' + esc(a.threat) + '</div>' : '');
      brk.classList.remove('out');
      brk.classList.add('show');
      chime('breaking');
      setMood('danger');
      S.spoken.add(a.key);
      say(spokenAlert(a, test ? 'This is a test of the WeatherPower alert system. ' : 'Breaking. '), { label: test ? 'TEST ALERT' : 'BREAKING' });
      setTimeout(() => {
        brk.classList.add('out');
        setTimeout(() => { brk.classList.remove('show', 'out'); resolve(); }, 520);
      }, 5600);
    });

    /* ---------------- data ---------------- */
    const loadAlerts = async () => {
      const body = await getJson('/api/v3/alerts');
      S.alerts = body.alerts || [];
      if (S.styleReady) S.map.getSource('alerts')?.setData(alertFC());
      const keys = new Set(S.alerts.map((a) => a.key));
      if (!S.seen) {
        S.seen = keys;
      } else {
        const st = focusState();
        const fresh = S.alerts.filter((a) => !S.seen.has(a.key) && notable(a) && (!st || a.states.includes(st)));
        fresh.forEach((a) => S.seen.add(a.key));
        keys.forEach((k) => S.seen.add(k));
        const breaking = fresh.filter(isBreaking).sort((x, y) => x.rank - y.rank);
        const others = fresh.filter((a) => !isBreaking(a) && a.group === 'warnings' && !/^flood warning$/i.test(a.event)).slice(0, 4);
        if (others.length) { chime('new'); S.fresh.push(...others.map((a) => a.key)); }
        if (breaking.length) {
          S.breaking.push(...breaking.map((a) => ({ key: a.key, alert: a })));
          if (!S.inBreaking && !S.shot?.breaking) nextShot();
        }
      }
      if (S.shot?.alert) {
        const updated = byKey(S.shot.alert.key);
        if (updated) S.shot.alert = updated;
      }
      buildHeadlines();
    };
    const loadLive = async () => {
      const body = await getJson('/api/v3/live');
      const prevRev = S.control.rev;
      const prevCtl = S.control;
      S.live = body;
      S.control = body.control || S.control;
      renderTop();
      if (S.styleReady) S.map.getSource('reports')?.setData(reportFC());
      const st = focusState();
      $('focus').style.display = st ? 'block' : 'none';
      $('focus').textContent = st ? 'FOCUS · ' + (STATE_NAMES[st] || st).toUpperCase() : '';
      if (S.lastCmd == null) {
        S.lastCmd = Math.max(0, ...(S.control.commands || []).map((c) => c.id));
      } else {
        for (const cmd of (S.control.commands || []).filter((c) => c.id > S.lastCmd)) {
          S.lastCmd = cmd.id;
          if (cmd.type === 'say') say(cmd.text);
          else if (cmd.type === 'next') nextShot();
          else if (cmd.type === 'reload') location.reload();
          else if (cmd.type === 'test-breaking') {
            const a = (cmd.key && byKey(cmd.key)) || candidates()[0];
            if (a) { S.breaking.unshift({ key: a.key, alert: a, test: true }); if (!S.inBreaking) nextShot(); }
          }
        }
      }
      if (prevRev >= 0 && prevRev !== S.control.rev && (prevCtl.pin !== S.control.pin || prevCtl.mode !== S.control.mode || prevCtl.state !== S.control.state)) {
        S.recent = [];
        buildHeadlines();
        nextShot();
      }
    };
    const loadRadar = async () => {
      const radar = await getJson('/api/v3/radar');
      if (S.radar && S.radar.validAt === radar.validAt) return;
      const first = !S.radar;
      S.radar = radar;
      if (!first && S.styleReady) radar.reflectivity.forEach((f, i) => S.map.getSource('rf' + i)?.setTiles?.([f.tiles]));
    };
    const poll = (fn, ms) => { const run = () => fn().catch((e) => console.warn(e.message)).finally(() => setTimeout(run, ms)); setTimeout(run, ms); };

    const roundup = () => {
      if (S.inBreaking || speech.busy) return;
      const t = S.live?.tallies || {};
      const idx = S.live?.index;
      const parts = [];
      if (t.tor) parts.push(t.tor + ' tornado warning' + (t.tor === 1 ? '' : 's'));
      if (t.svr) parts.push(t.svr + ' severe thunderstorm warning' + (t.svr === 1 ? '' : 's'));
      if (t.ffw) parts.push(t.ffw + ' flash flood warning' + (t.ffw === 1 ? '' : 's'));
      const watches = (t.torWatch || 0) + (t.svrWatch || 0);
      let text = 'WeatherPower update. ';
      text += parts.length ? 'Right now there ' + (parts.length === 1 && /^1 /.test(parts[0]) ? 'is ' : 'are ') + parts.join(', ') + ' across the country.' : 'No tornado, severe thunderstorm or flash flood warnings are in effect right now.';
      if (watches) text += ' ' + watches + ' severe weather watch' + (watches === 1 ? ' is' : 'es are') + ' active.';
      if (idx) text += ' The WeatherPower Index is ' + idx.value.toFixed(1) + ', ' + idx.label.toLowerCase() + '.';
      say(text, { label: 'UPDATE' });
    };
    setInterval(() => {
      if (Date.now() - S.lastRoundup > 20 * 60 * 1000) { S.lastRoundup = Date.now(); roundup(); }
      else if (OPT.tips && Date.now() - S.lastTip > 4 * 60 * 1000 && !speech.busy && !S.inBreaking && !bubble.classList.contains('show') && (S.live?.tallies?.tor || 0) === 0) {
        S.lastTip = Date.now();
        showBubble(TIPS[Math.floor(Math.random() * TIPS.length)], 10000, 'SAFETY TIP');
      }
    }, 15000);

    /* ---------------- boot ---------------- */
    const boot = async () => {
      const [config, radar, sites] = await Promise.all([
        getJson('/api/v3/config'),
        getJson('/api/v3/radar').catch(() => null),
        getJson('/api/v3/nexrad').catch(() => ({ sites: [] }))
      ]);
      S.radar = radar;
      S.sites = sites.sites || [];
      S.home = config.home || null;
      S.soundings = Boolean(config.soundings);
      await Promise.all([loadAlerts(), loadLive()]).catch((e) => console.warn(e.message));
      S.map = new maplibregl.Map({
        container: 'map', style: config.darkStyleUrl, center: [-96, 38.6], zoom: 4.1,
        interactive: false, attributionControl: false, fadeDuration: 0
      });
      S.map.once('style.load', () => {
        installLayers();
        showHeadline();
        $('boot').classList.add('done');
        nextShot();
      });
      poll(loadAlerts, 20000);
      poll(loadLive, 6000);
      poll(loadRadar, 120000);
      setTimeout(() => say('WeBot here, and WeatherPower Live is on the air. I’ll keep an eye on every warning across the country.'), 2500);
    };
    boot().catch((error) => { $('boot').textContent = 'WEATHERPOWER LIVE · RECONNECTING…'; console.error(error); setTimeout(() => location.reload(), 15000); });
    // Long-running stream: a reload every 6 hours keeps browser memory in check.
    setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
  })();
  </script>
</body>
</html>
