    // Weather Intensity Score colors by level (the same levels as the WIS page).
    const WIS_COLORS = { quiet: '#6fd0ff', low: '#7dff9a', elevated: '#ffd34d', active: '#ff8a3d', intense: '#ff4d6d', extreme: '#ff3df0' };
    const drawSpark = (history, color, floor = 0) => {
      const canvas = $('spark');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const pts = (history || []).slice(-72);
      if (pts.length < 2) return;
      const max = Math.max(floor + 10, ...pts.map((p) => p[1])) * 1.1;
      const x = (i) => 6 + (i / (pts.length - 1)) * (canvas.width - 16);
      const y = (v) => canvas.height - 8 - ((v - floor) / (max - floor)) * (canvas.height - 16);
      ctx.beginPath();
      pts.forEach((p, i) => (i ? ctx.lineTo(x(i), y(p[1])) : ctx.moveTo(x(i), y(p[1]))));
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.lineTo(x(pts.length - 1), canvas.height);
      ctx.lineTo(x(0), canvas.height);
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, color + '66');
      grad.addColorStop(1, color + '00');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x(pts.length - 1), y(pts[pts.length - 1][1]), 6, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    };
    /* ---------------- bar themes: match the vibe of the weather ---------------- */
    const THEMES = {
      violet: { a: '#7457ec', b: '#5b3fd3', dark: '#3e2a9c', deep: '#141d47' },
      clear: { a: '#2f8cff', b: '#1f6fe0', dark: '#164a9e', deep: '#0f2a55' },
      storm: { a: '#e0453a', b: '#b52a22', dark: '#7c1a16', deep: '#3a0f0d' },
      tornado: { a: '#c8102e', b: '#8e0a1f', dark: '#4d0612', deep: '#24040a' },
      flood: { a: '#1fa36b', b: '#14804f', dark: '#0c5534', deep: '#08301f' },
      winter: { a: '#5aa7f0', b: '#3d8fe0', dark: '#255f9e', deep: '#14304f' },
      heat: { a: '#ff8a2a', b: '#e0631a', dark: '#9e3f10', deep: '#4f2008' },
      tropical: { a: '#14b8a6', b: '#0e8f82', dark: '#0a5f57', deep: '#06332f' },
      night: { a: '#2a3550', b: '#1d2740', dark: '#121a2c', deep: '#0b1120' },
      fall: { a: '#ff7a1a', b: '#d9520b', dark: '#4a2378', deep: '#261040' }
    };
    // Auto: the bars follow what's happening, most dangerous first. Quiet days keep the WeatherPower violet.
    const weatherTheme = () => {
      const t = S.live?.tallies || {};
      const level = S.live?.wis?.level || '';
      const usAlerts = S.alerts.filter((a) => ['warnings', 'watches'].includes(a.group) && (a.states || []).length && !offConus(a));
      const count = (re) => usAlerts.filter((a) => re.test(a.event || '')).length;
      if ((t.tor || 0) > 0 || ['intense', 'extreme'].includes(level)) return 'tornado';
      if (count(/^(hurricane|tropical storm|storm surge) (warning|watch)$/i)) return 'tropical';
      if ((t.svr || 0) >= 3 || level === 'active') return 'storm';
      if ((t.ffw || 0) >= 3 || count(/flash flood emergency/i)) return 'flood';
      if (count(/winter storm|blizzard|ice storm|winter weather|lake effect snow/i) >= 5) return 'winter';
      if (count(/heat/i) >= 5) return 'heat';
      return 'violet';
    };
    const applyTheme = () => {
      const pick = S.control.theme && S.control.theme !== 'auto' ? S.control.theme : weatherTheme();
      const key = THEMES[pick] ? pick : 'violet';
      if (S.themeKey === key) return;
      S.themeKey = key;
      const th = THEMES[key];
      const root = document.documentElement.style;
      root.setProperty('--violet', 'linear-gradient(180deg, ' + th.a + ' 0%, ' + th.b + ' 100%)');
      root.setProperty('--violet-dark', th.dark);
      root.setProperty('--violet-deep', th.deep);
    };

    const renderTop = () => {
      applyTheme();
      const t = S.live?.tallies || {};
      setTally('t-tor', t.tor || 0);
      setTally('t-svr', t.svr || 0);
      setTally('t-ffw', t.ffw || 0);
      setTally('t-wch', (t.torWatch || 0) + (t.svrWatch || 0));
      const wis = S.live?.wis;
      if (wis?.loaded) {
        const color = WIS_COLORS[wis.level] || '#6fd0ff';
        document.querySelector('.wpi').style.setProperty('--wc', color);
        $('wpi-v').textContent = wis.score.toFixed(1);
        $('wpi-l').textContent = wis.label.toUpperCase();
        const d30 = wis.ago30 == null ? null : wis.score - wis.ago30;
        $('wpi-delta').textContent = d30 == null ? '— 30M' : (d30 >= 0 ? '▲ ' : '▼ ') + Math.abs(d30).toFixed(1) + ' 30M';
        drawSpark((wis.history || []).map((p) => [p.t, p.v]), color, 20);
      }
      $('rc-n').textContent = (S.live?.reports || []).length;
    };

    const headlineFor = (a) => (a.eventLabel + ' FOR ' + (a.area || stateLine(a)) + (a.times?.expires ? ' UNTIL ' + a.times.expires : '')).toUpperCase();
    const buildHeadlines = () => {
      const st = focusState();
      const fresh = (a) => Date.now() - Date.parse(a.issuedAt || 0) < 30 * 60 * 1000;
      const list = S.alerts
        .filter((a) => ['warnings', 'watches'].includes(a.group) && (a.states || []).length && (!st || a.states.includes(st)))
        .sort((x, y) => (x.rank - y.rank) || (Date.parse(y.issuedAt || 0) - Date.parse(x.issuedAt || 0)))
        .slice(0, 8)
        .map((a) => ({ tag: fresh(a) && a.status === 'NEW' ? 'NEW' : a.rank <= 3 ? 'ALERT' : 'LATEST', text: headlineFor(a), color: a.color }));
      S.headlines = list.length ? list : [{ tag: 'LIVE', text: 'WEATHERPOWER LIVE · SEVERE WEATHER COVERAGE 24/7', color: null }];
    };
    const showHeadline = () => {
      const items = [...S.headlines];
      if (S.control.banner) items.splice(S.hlIndex % 2 ? 0 : items.length, 0, { tag: 'WEATHERPOWER', text: S.control.banner.text.toUpperCase(), color: '#1a8cff' });
      if (S.tip) { items.splice(0, 0, { tag: 'SAFETY TIP', text: S.tip.toUpperCase() }); S.tip = null; S.hlIndex = 0; }
      const item = items[S.hlIndex % items.length];
      S.hlIndex += 1;
      if (!item) return;
      const slot = $('hl-slot');
      slot.querySelectorAll('.txt').forEach((el) => { el.classList.add('leave'); setTimeout(() => el.remove(), 600); });
      const el = document.createElement('div');
      el.className = 'txt enter';
      el.textContent = item.text;
      slot.appendChild(el);
      let size = 40;
      el.style.fontSize = size + 'px';
      while (el.scrollWidth > el.clientWidth && size > 25) { size -= 1; el.style.fontSize = size + 'px'; }
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
      $('hl-tag').textContent = item.tag;
      $('hl').style.setProperty('--hc', 'transparent');
    };
    setInterval(showHeadline, 8000);

    /* ---------------- panels ---------------- */
    const card = $('card');
    const setCard = (html, color) => {
      card.style.setProperty('--c', color || '#1a8cff');
      card.style.setProperty('--ci', ink(color || '#1a8cff'));
      card.innerHTML = html;
      card.classList.add('show');
    };
    const setNow = ({ k, title, color, hazards = [], crawl = '', people = '' }) => {
      const now = $('now');
      now.style.setProperty('--c', color || '#1a8cff');
      now.style.setProperty('--ci', ink(color || '#1a8cff'));
      $('now-k').textContent = k;
      $('now-t').textContent = title;
      $('now-hz').innerHTML = hazards.slice(0, 3).map((h) => '<span>' + esc(h) + '</span>').join('');
      $('now-ppl').textContent = people;
      const span = $('crawl-s');
      span.getAnimations?.().forEach((an) => an.cancel());
      span.textContent = crawl;
      const box = $('crawl');
      requestAnimationFrame(() => {
        const w = span.scrollWidth;
        if (w > box.clientWidth && span.animate) {
          span.animate([{ transform: 'translateX(' + box.clientWidth + 'px)' }, { transform: 'translateX(-' + w + 'px)' }], { duration: ((w + box.clientWidth) / 85) * 1000, iterations: Infinity });
        }
      });
    };

    const alertCard = (a, shot) => {
      const watchInside = a.group === 'watches'
        ? S.alerts.filter((w) => w.group === 'warnings' && inGeometry(centerOf(w), a.geometry)).length
        : null;
      const chips = [];
      if (a.threat) chips.push('<span class="chip hot"><b>' + esc(a.threat) + '</b></span>');
      if (watchInside != null) chips.push('<span class="chip"><b>' + watchInside + '</b> WARNING' + (watchInside === 1 ? '' : 'S') + ' INSIDE</span>');
      if (a.people) chips.push('<span class="chip"><b>' + fmtNum(a.people) + '</b> ' + (a.group === 'watches' ? 'IMPACTED' : 'PEOPLE IN WARNING') + '</span>');
      (a.states || []).slice(0, 3).forEach((s) => chips.push('<span class="chip"><b>' + esc(s) + '</b></span>'));
      const rows = [];
      if (a.area) rows.push(['AREAS', '<dd>' + esc(a.area) + '</dd>']);
      const hz = (a.hazards || []).filter((h) => h.value && !/^(RISK|DAY)$/.test(h.label));
      if (hz.length) rows.push(['HAZARDS', '<dd>' + hz.map((h) => esc(h.label + ' ' + h.value)).join(' · ') + '</dd>']);
      if (a.summary) rows.push(['DETAILS', '<dd class="prose">' + esc(a.summary) + '</dd>']);
      rows.push(['ISSUED', '<dd>' + esc((a.times?.issued || '') + (a.office ? ' · NWS ' + a.office : '')) + '</dd>']);
      const tag = shot.pinned ? '<span class="status pin">PINNED</span>' : a.status ? '<span class="status">' + esc(a.status) + '</span>' : '';
      setCard('<div class="head"><div class="ico">' + icon(a.icon, 30) + '</div><div><h2>' + esc(a.eventLabel) + '</h2><div class="sub" id="card-exp"></div></div>' + tag + '</div>'
        + '<div class="life"><i id="card-life"></i></div>'
        + (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '')
        + '<dl>' + rows.map(([k, v]) => '<dt>' + k + '</dt>' + v).join('') + '</dl>', a.color);
    };

    /* ---------------- director ---------------- */
    const OFF_CONUS = ['AK', 'HI', 'GU', 'MP', 'AS', 'PR', 'VI'];
    const offConus = (a) => (a.states || []).length > 0 && a.states.every((s) => OFF_CONUS.includes(s));
    const notable = (a) => ['warnings', 'watches', 'discussions'].includes(a.group) && (a.states || []).length > 0;
    const isBreaking = (a) => a.rank <= 3 || /^tornado watch$/i.test(a.event);
    const candidates = () => {
      const st = focusState();
      const fresh = (a) => Date.now() - Date.parse(a.issuedAt || 0) < 30 * 60 * 1000;
      return S.alerts
        .filter((a) => a.geometry && ['warnings', 'watches', 'discussions', 'statements'].includes(a.group) && (!st || (a.states || []).includes(st)))
        .map((a) => ({ a, score: a.rank * 10 + ((a.states || []).length ? 0 : 45) + (offConus(a) ? 25 : 0) + (/^flood warning$/i.test(a.event) ? 12 : 0) + (a.group === 'statements' ? 20 : 0) - (fresh(a) ? 6 : 0) }))
        .sort((x, y) => (x.score - y.score) || (Date.parse(y.a.issuedAt || 0) - Date.parse(x.a.issuedAt || 0)))
        .map((x) => x.a);
    };
    const outlooks = () => S.alerts.filter((a) => a.group === 'outlooks' && /day 1/i.test(a.eventLabel || '') && a.geometry);
    const dwellFor = (shot) => {
      // Calm days: scenes hold for a minute or more (the radar map up to 3), like a chill quiet-mode stream.
      if (isCalm() && !shot.breaking && !shot.fresh) {
        const CALM = { surface: 180, national: 100, alert: 75, models: 85, tropics: 80, outlook: 70, reports: 70, think: 13 };
        return (CALM[shot.type] || 90) * OPT.speed * 1000;
      }
      let s = 15;
      if (shot.type === 'alert') {
        const a = shot.alert;
        s = a.rank <= 2 ? 30 : a.rank <= 3 ? 26 : a.group === 'warnings' && (a.states || []).length ? 20 : 15;
      } else if (shot.type === 'reports') s = 16;
      else if (shot.type === 'think') s = 13;
      else if (shot.type === 'models') s = 32;
      else if (shot.type === 'tropics') s = 26;
      else if (shot.type === 'surface') s = 22;
      else s = 14;
      return s * OPT.speed * 1000;
    };

    /* ---------------- WeBot thinks, then checks the models (WeatherPower Model Studio) ---------------- */
    const MODEL_ROTATION = {
      warm: [['hrrr', 'refc'], ['hrrr', 'cape'], ['ecmwf', 'qpf'], ['hrrr', 't2m'], ['nam', 'uh'], ['gfs', 'qpf'], ['nam', 'gust'], ['hrrr', 'td2m']],
      severe: [['hrrr', 'refc'], ['hrrr', 'cape'], ['hrrr', 'uh'], ['nam', 'refc'], ['ecmwf', 'qpf']],
      cold: [['hrrr', 'ptype'], ['ecmwf', 'snow'], ['hrrr', 't2m'], ['gfs', 'qpf'], ['hrrr', 'refc'], ['nam', 'gust']]
    };
    const nextModelPick = () => {
      const month = new Date().getMonth();
      const t = S.live?.tallies || {};
      const risk = S.live?.index?.spcDay1;
      const severe = (t.tor || 0) + (t.svr || 0) > 0 || ['SLGT', 'ENH', 'MDT', 'HIGH'].includes(risk);
      const list = severe ? MODEL_ROTATION.severe : (month >= 10 || month <= 2) ? MODEL_ROTATION.cold : MODEL_ROTATION.warm;
      S.modelIdx = (S.modelIdx || 0) + 1;
      return list[S.modelIdx % list.length];
    };
    const frameUrl = (frame) => location.origin + BASE + frame.path;
    // Frames load one at a time while WeBot thinks, so the render service is never flooded.
    const loadModelSegment = async () => {
      // National check: the server scans cities across the lower 48 and ranks them.
      const [model, field] = nextModelPick();
      const seg = await getJson('/api/v3/models/segment?model=' + model + '&field=' + field);
      seg.ready = new Set();
      seg.spot = seg.point;
      S.loadingSeg = seg;
      (async () => {
        for (let i = 0; i < seg.frames.length; i += 1) {
          if (S.loadingSeg !== seg && S.modelSeg !== seg) return;
          try {
            const response = await fetch(frameUrl(seg.frames[i]));
            if (response.ok) { await response.blob(); seg.ready.add(i); }
          } catch {}
        }
      })();
      return seg;
    };
    const setThinking = (on) => {
      bot.classList.toggle('think', on);
    };
    const thinkShot = () => {
      setThinking(true);
      setMood('calm');
      card.classList.remove('show');
      fly(CONUS, { padding: { top: 110, bottom: 100, left: 120, right: 120 }, maxZoom: 5, duration: 5200 });
      chatter(pick(['Let me zoom out and think for a second.', 'Hang on, let me see what the models are saying.', 'Let me pull up the models real quick.', 'Time to check in on the computer models.']));
      setNow({ k: 'WEBOT', title: 'Checking the models', color: '#1a8cff', crawl: 'HRRR · NAM 3KM · GFS · ECMWF · WEATHERPOWER MODEL STUDIO · SIMULATED RADAR · CAPE · RAIN · TEMPERATURE · WIND' });
      S.pendingModel = null;
      S.modelRequestPending = true;
      loadModelSegment()
        .then((seg) => { S.pendingModel = seg; })
        .catch((error) => console.warn('models', error.message))
        .finally(() => { S.modelRequestPending = false; });
    };
    const legendCss = (legend) => (legend.length > 1 ? 'linear-gradient(90deg,' + legend.map((s, i) => s.c + ' ' + ((i / (legend.length - 1)) * 100).toFixed(1) + '%').join(',') + ')' : LEGENDS.refl.bar);
    const legendLabels = (legend, units) => {
      if (legend.length < 2) return LEGENDS.refl.labels;
      const picks = [0, Math.round((legend.length - 1) / 3), Math.round(((legend.length - 1) * 2) / 3), legend.length - 1];
      return picks.map((i, k) => legend[i].v + (k === 3 ? ' ' + units : ''));
    };
    const SHORT_FIELD = { refc: 'SIMULATED RADAR', ptype: 'PRECIP TYPE', cape: 'CAPE', uh: 'HELICITY', t2m: 'TEMPERATURE', td2m: 'DEW POINT', gust: 'WIND GUSTS', wind10: 'WIND', qpf: 'RAIN', pwat: 'PRECIP WATER', snow: 'SNOW', snod: 'SNOW DEPTH' };
    // Hot-spot markers for national model checks.
    const showSpotMarkers = (seg) => {
      (S.spotMarkers || []).forEach((m) => m.remove());
      S.spotMarkers = (seg.spots || []).slice(0, 4).map((sp, k) => {
        // Numbered pins match the numbered rows on the card, so labels never pile up on the map.
        const el = document.createElement('div');
        el.className = 'spotpin' + (k === 0 ? ' lead' : '');
        el.textContent = String(k + 1);
        return new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([sp.lon, sp.lat]).addTo(S.map);
      });
    };
    const hideModels = () => {
      (S.spotMarkers || []).forEach((m) => m.remove());
      S.spotMarkers = [];
      S.modelOn = false;
      S.modelValid = null;
      clearInterval(S.modelTimer);
      if (S.styleReady && S.map.getLayer('model')) S.map.setLayoutProperty('model', 'visibility', 'none');
      if (S.styleReady) S.map.setLayoutProperty('a-fill', 'visibility', 'visible');
    };
    const showModelFrame = (seg, i) => {
      const frame = seg.frames[i];
      if (!frame || !S.styleReady) return;
      const source = S.map.getSource('model');
      if (source) source.updateImage({ url: frameUrl(frame), coordinates: seg.coordinates });
      else {
        S.map.addSource('model', { type: 'image', url: frameUrl(frame), coordinates: seg.coordinates });
        S.map.addLayer({ id: 'model', type: 'raster', source: 'model', paint: { 'raster-opacity': 0.82, 'raster-fade-duration': 0 } }, 'a-fill');
      }
      S.map.setLayoutProperty('model', 'visibility', 'visible');
      S.modelValid = frame.valid;
      $('rp-site').textContent = 'RUN ' + seg.runLabel.toUpperCase() + ' • F' + String(frame.fhr).padStart(3, '0');
      $('rp-ticks').innerHTML = seg.frames.map((_, k) => '<i class="' + (k === i ? 'now' : seg.ready.has(k) ? 'on' : '') + '"></i>').join('');
    };
    const modelsShot = (seg) => {
      setThinking(false);
      setSelected('');
      clearLocal();
      setOutlookVisible(false);
      setMood('calm');
      S.modelSeg = seg;
      S.modelOn = true;
      if (S.styleReady) S.map.setLayoutProperty('a-fill', 'visibility', 'none');
      const f = seg.field;
      $('rp-title').textContent = seg.modelName.replace(' 3km', '') + ' · ' + (SHORT_FIELD[f.key] || f.name.toUpperCase());
      $('rp-bar').style.background = legendCss(f.legend || []);
      $('rp-lbl').innerHTML = legendLabels(f.legend || [], f.units).map((l) => '<span>' + esc(String(l).toUpperCase()) + '</span>').join('');
      setRpState('MODEL STUDIO', '');
      const shortPlace = (p) => String(p || '').replace(/, ([A-Za-z .]+)$/, (m, st) => ', ' + (Object.keys(STATE_NAMES).find((k) => STATE_NAMES[k] === st) || st));
      const spotRows = (seg.spots || []).slice(0, 4).map((sp, k) => '<div class="rowi" style="--rc:' + (k === 0 ? '#ffd34d' : '#c99a3c') + '"><span class="n">' + (k + 1) + '</span><b>' + esc(shortPlace(sp.place)) + '</b><em>' + esc(sp.display) + '</em></div>').join('');
      const rows = seg.compare.map((c) => '<div class="rowi" style="--rc:' + (c.model === seg.model ? '#1a8cff' : '#5d6f8d') + '"><i></i><b>' + esc(c.name) + '</b>' + (c.value == null ? '<span>' + esc(c.note || 'n/a') + '</span>' : '<em>' + esc(c.display) + '</em>') + '</div>').join('');
      const horizon = seg.horizonH <= 24 ? 'NEXT ' + seg.horizonH + ' HRS' : 'NEXT ' + Math.round(seg.horizonH / 24) + ' DAYS';
      const skewt = S.soundings && ['cape', 'refc', 'uh'].includes(f.key) && seg.spot
        ? '<img class="skewt" alt="" src="' + BASE + '/api/v3/models/sounding.png?lat=' + seg.spot.lat.toFixed(2) + '&lon=' + seg.spot.lon.toFixed(2) + '&fhr=3" onerror="this.remove()">' : '';
      setCard('<div class="head"><div class="ico">' + icon('outlook', 30) + '</div><div><h2>Model check</h2><div class="sub">' + esc(f.name.replace(/ \(.*\)$/, '').toUpperCase()) + ' · ' + horizon + '</div></div><span class="status">' + esc(seg.modelName.replace(' 3km', '')) + '</span></div>'
        + (spotRows
          ? '<dl><dt>WHOLE COUNTRY</dt><dd>' + esc(seg.modelName.replace(' 3km', '')) + ' TOP SPOTS</dd></dl><div class="rows">' + spotRows + '</div>'
            + '<dl><dt>EVERY MODEL</dt><dd>NEAR ' + esc(shortPlace(seg.topPlace || seg.place).toUpperCase()) + '</dd></dl>'
          : '<dl><dt>WHERE</dt><dd>' + esc(seg.place) + '</dd></dl>')
        + '<div class="rows">' + rows + '</div>' + skewt, '#1a8cff');
      showSpotMarkers(seg);
      setNow({ k: 'MODELS', title: seg.modelName + ' ' + (SHORT_FIELD[f.key] || f.name) + ' · ' + horizon, color: '#1a8cff', crawl: seg.take + '   ◆   ' + seg.credit });
      fly(CONUS, { padding: { top: 120, bottom: 130, left: 580, right: 300 }, maxZoom: 5.2, duration: 2400 });
      // Loop through the frames that have finished loading; hold on the last one.
      let i = 0;
      let hold = 0;
      showModelFrame(seg, 0);
      clearInterval(S.modelTimer);
      S.modelTimer = setInterval(() => {
        if (S.modelSeg !== seg || !S.modelOn) return;
        if (i === seg.frames.length - 1 && hold < 4) { hold += 1; return; }
        hold = 0;
        let next = (i + 1) % seg.frames.length;
        for (let guard = 0; guard < seg.frames.length && !seg.ready.has(next); guard += 1) next = (next + 1) % seg.frames.length;
        if (!seg.ready.has(next)) return;
        i = next;
        showModelFrame(seg, i);
      }, 650);
      say(seg.take, { label: 'MODEL CHECK' });
    };

    const nextShot = (force) => {
      clearTimeout(S.shotTimer);
      if (S.inBreaking) return;
      // Let WeBot finish what he's saying before cutting away (up to 15 more seconds).
      if (!force && !S.breaking.length && !S.fresh.length && speech.busy && Date.now() - S.shotStart < S.shotDur + 15000) {
        S.shotTimer = setTimeout(nextShot, 1200);
        return;
      }
      let shot = null;
      if (S.breaking.length) {
        const b = S.breaking.shift();
        shot = { type: 'alert', alert: byKey(b.key) || b.alert, breaking: b };
      } else if (S.fresh.length) {
        const key = S.fresh.shift();
        if (byKey(key)) shot = { type: 'alert', alert: byKey(key), fresh: true };
      }
      // Pinning from Live Control switches right away, even in the middle of a model check.
      if (!shot && force && S.control.pin && byKey(S.control.pin)) shot = { type: 'alert', alert: byKey(S.control.pin), pinned: true };
      // A think shot always hands over to its model check (if the models came back in time).
      if (!shot && S.shot?.type === 'think' && !S.pendingModel && S.modelRequestPending && (S.thinkWait = (S.thinkWait || 0) + 1) <= 5) {
        S.shotTimer = setTimeout(nextShot, 2000);   // WeBot keeps thinking a little longer
        return;
      }
      S.thinkWait = 0;
      if (!shot && S.shot?.type === 'think' && S.pendingModel) {
        shot = { type: 'models', seg: S.pendingModel };
        S.modelSeg = S.pendingModel;
        S.pendingModel = null;
      }
      if (!shot && S.control.pin && byKey(S.control.pin)) shot = { type: 'alert', alert: byKey(S.control.pin), pinned: true };
      if (!shot && S.control.mode === 'models') shot = { type: 'think' };
      else if (!shot && S.control.mode && S.control.mode !== 'auto') shot = { type: S.control.mode };
      if (!shot) {
        S.cycle += 1;
        const list = candidates().slice(0, 10);
        const kind = pickKind(list);
        S.kinds = [...(S.kinds || []), kind].slice(-6);
        if (kind === 'alert') {
          const memory = Math.min(list.length - 1, 6);
          const pick = list.find((a) => !S.recent.slice(-memory).includes(a.key)) || list[0];
          S.recent = [...S.recent, pick.key].slice(-12);
          shot = { type: 'alert', alert: pick };
        } else shot = { type: kind };
      }
      if (shot.type === 'outlook' && !outlooks().length) shot = { type: 'national' };
      if (shot.type === 'reports' && (S.live?.reports || []).length < 5) shot = { type: 'national' };
      if (shot.type === 'tropics' && !tropicsActive()) shot = { type: 'national' };
      if (shot.type === 'surface' && !S.surface) shot = { type: 'national' };
      runShot(shot);
    };

    // The show mixes itself up: weighted random segments. Alerts come up most when it's active,
    // nothing non-alert repeats back to back, and the tropics join in whenever NHC has something.
    const tropicsActive = () => Boolean(S.tropics && (S.tropics.storms.length || S.tropics.outlook.features.some((a) => parseInt(a.properties.prob7day, 10) >= 30)));
    const pickKind = (list) => {
      const t = S.live?.tallies || {};
      const busy = (t.tor || 0) * 3 + (t.svr || 0) + (t.ffw || 0);
      const w = {
        alert: list.length ? (busy >= 10 ? 7 : busy ? 5 : 3) : 0,
        think: 2.2,
        national: 1.2,
        outlook: outlooks().length ? 1 : 0,
        reports: (S.live?.reports || []).length >= 5 ? 1.2 : 0,
        tropics: tropicsActive() ? (S.tropics.storms.length ? 2.2 : 0.9) : 0,
        // The national radar + surface map is the quiet-day staple (like Ryan's).
        surface: S.surface ? (busy ? 0.8 : 2) : 0
      };
      const calm = isCalm();
      if (calm) Object.assign(w, { surface: S.surface ? 5 : 0, alert: list.length ? 1.5 : 0, think: 1, national: 1, outlook: w.outlook * 0.5, reports: w.reports * 0.5 });
      const recent = S.kinds || [];
      Object.keys(w).forEach((k) => {
        if (k === 'alert' || !recent.slice(-3).includes(k)) return;
        // On calm days the radar map may come back sooner; nothing else repeats back to back.
        w[k] *= k === recent[recent.length - 1] ? (calm && k === 'surface' ? 0.5 : 0) : 0.25;
      });
      if (recent.length >= 2 && recent.slice(-2).every((k) => k === 'alert')) w.alert *= 0.3;
      const total = Object.values(w).reduce((a, b) => a + b, 0);
      if (!total) return 'national';
      let r = Math.random() * total;
      for (const [k, v] of Object.entries(w)) { if ((r -= v) <= 0) return k; }
      return 'national';
    };

    const CONUS = [[-125, 24.2], [-66.8, 49.6]];
    const PAD = { top: 150, bottom: 140, left: 600, right: 640 };
    const runShot = async (shot) => {
      S.shot = shot;
      if (shot.breaking) {
        S.inBreaking = true;
        await showBreaking(shot.alert, shot.breaking.test);
        S.inBreaking = false;
      }
      S.shotStart = Date.now();
      S.shotDur = dwellFor(shot);
      card.classList.remove('show');
      setTimeout(() => S.shot === shot && stageShot(shot), 380);
      S.shotTimer = setTimeout(nextShot, S.shotDur);
    };

    const fly = (bounds, opts = {}) => {
      if (!S.map || !bounds) return;
      S.map.stop();
      // Cross-ocean jumps (Guam, Hawaii) cut instead of flying, so tiles are not loading mid-air.
      const from = S.map.getCenter();
      const far = Math.abs(from.lng - (bounds[0][0] + bounds[1][0]) / 2) > 45 || Math.abs(from.lat - (bounds[0][1] + bounds[1][1]) / 2) > 25;
      S.map.fitBounds(bounds, { padding: PAD, duration: far ? 0 : 3600, maxZoom: 9.4, essential: true, ...opts });
      const shot = S.shot;
      S.map.once('moveend', () => {
        if (S.shot !== shot || Date.now() - S.shotStart > S.shotDur - 3000) return;
        S.map.easeTo({ zoom: S.map.getZoom() + 0.3, duration: Math.max(2000, S.shotDur - (Date.now() - S.shotStart) - 600), easing: (t) => t, essential: true });
      });
    };

    const stageShot = (shot) => {
      clearTimeout(S.velTimer);
      setVelocity(false);
      if (shot.type !== 'think') setThinking(false);
      if (shot.type !== 'models') hideModels();
      if (shot.type !== 'tropics') hideTropics();
      if (shot.type !== 'surface') hideSurface();
      hideCam();
      // A pinned camera gets a mention every few segments, after WeBot's line for the segment.
      if (S.camPinnedId && S.camPinned && shot.type !== 'think' && !shot.breaking && ++S.pinTalk % 4 === 0) {
        setTimeout(() => { if (S.shot === shot && S.camPinned) sayNext(camTalk(S.camPinned, 'still')); }, 7000);
      }
      if (shot.type === 'surface') {
        setSelected('');
        clearLocal();
        setOutlookVisible(false);
        surfaceShot();
        renderRadarPanel();
        $('rp').classList.add('show');
        return;
      }
      if (shot.type === 'tropics') {
        setSelected('');
        clearLocal();
        setOutlookVisible(false);
        $('rp').classList.remove('show');
        tropicsShot();
        return;
      }
      if (shot.type === 'think') {
        setSelected('');
        clearLocal();
        setOutlookVisible(false);
        thinkShot();
        renderRadarPanel();
        $('rp').classList.add('show');
        return;
      }
      if (shot.type === 'models') {
        modelsShot(shot.seg);
        $('rp').classList.add('show');
        return;
      }
      if (shot.type === 'alert') {
        const a = shot.alert;
        setOutlookVisible(false);
        setSelected(a.key);
        alertCard(a, shot);
        const hz = (a.hazards || []).filter((h) => h.value && !/^(RISK|DAY)$/.test(h.label)).map((h) => h.value);
        setNow({
          k: shot.breaking ? 'BREAKING' : shot.fresh ? 'NEW ALERT' : shot.pinned ? 'PINNED' : 'TOP ALERT',
          title: a.eventLabel + (stateLine(a) ? ' IN ' + stateLine(a) : a.place ? ' · ' + a.place : ''),
          color: a.color,
          hazards: [a.threat, ...hz].filter(Boolean),
          crawl: (a.areaDesc || a.area || '').toUpperCase().split(/;\s*/).join(' · '),
          people: a.people ? '~' + shortNum(a.people) + ' IN THE PATH' : ''
        });
        fly(bboxOf(a.geometry), { maxZoom: a.group === 'watches' ? 7.4 : 9.4 });
        loadLocal(nearestSite(centerOf(a)));
        setMood(a.rank <= 3 ? 'danger' : a.group === 'warnings' ? 'alert' : 'calm');
        if ((a.family === 'tornado' || /tornado/i.test(a.threat || '')) && a.group === 'warnings') {
          S.velTimer = setTimeout(() => { if (S.shot === shot) setVelocity(true); }, S.shotDur * 0.5);
          setTimeout(() => { if (S.shot === shot) setVelocity(false); }, S.shotDur * 0.85);
        }
        showCamFor(a, shot);
        if (!shot.fresh && !shot.breaking) chatter(alertTalk(a, shot));
        if (shot.fresh && !S.spoken.has(a.key)) {
          talked.set(a.key, { at: Date.now(), reports: reportsNear(a).length });
          S.spoken.add(a.key);
          say(spokenAlert(a, 'New ' + a.event.toLowerCase() + '. '), { label: 'NEW ALERT' });
        }
      } else {
        setSelected('');
        clearLocal();
        setOutlookVisible(shot.type === 'outlook');
        setMood('calm');
        if (shot.type === 'national') nationalShot();
        else if (shot.type === 'outlook') outlookShot();
        else reportsShot();
      }
      renderRadarPanel();
      $('rp').classList.add('show');
    };

    const nationalShot = () => {
      const st = focusState();
      const pool = S.alerts.filter((a) => ['warnings', 'watches', 'statements', 'discussions'].includes(a.group) && (!st || (a.states || []).includes(st)));
      const byEvent = new Map();
      pool.forEach((a) => { const e = byEvent.get(a.event) || { n: 0, color: a.color, rank: a.rank }; e.n += 1; e.rank = Math.min(e.rank, a.rank); byEvent.set(a.event, e); });
      const top = [...byEvent.entries()].sort((x, y) => (x[1].rank - y[1].rank) || (y[1].n - x[1].n)).slice(0, 6);
      const risk = S.live?.index?.spcDay1;
      setCard('<div class="head"><div class="ico">' + icon('radar', 30) + '</div><div><h2>' + (st ? esc((STATE_NAMES[st] || st).toUpperCase()) + ' OVERVIEW' : 'NATIONAL OVERVIEW') + '</h2><div class="sub">' + pool.length + ' ACTIVE ALERTS · WIS ' + esc(S.live?.wis?.loaded ? S.live.wis.scoreText + ' ' + S.live.wis.label.toUpperCase() : '') + '</div></div></div>'
        + '<div class="rows">' + (top.length ? top.map(([event, e]) => '<div class="rowi" style="--rc:' + esc(e.color) + '"><i></i><b>' + esc(event) + '</b><em>' + e.n + '</em></div>').join('') : '<div class="rowi" style="--rc:#3fe0ff"><i></i><b>No active warnings</b></div>')
        + (risk ? '<div class="rowi" style="--rc:#7dff9a"><i></i><b>SPC Day 1</b><span>' + esc(RISK_NAMES[risk] || risk) + '</span></div>' : '') + '</div>', '#1a8cff');
      const st2 = focusState();
      const stBounds = st2 ? bboxOf({ type: 'GeometryCollection', geometries: pool.map((a) => a.geometry).filter(Boolean) }) : null;
      fly(stBounds || CONUS, { padding: { top: 110, bottom: 100, left: 580, right: 110 }, maxZoom: 7 });
      setNow({ k: 'OVERVIEW', title: (st2 ? (STATE_NAMES[st2] || st2) : 'Nationwide') + ': ' + pool.length + ' active alerts', color: '#1a8cff', crawl: top.map(([event, e]) => e.n + ' ' + event).join(' · ') });
      const common = [...byEvent.entries()].sort((x, y) => y[1].n - x[1].n).slice(0, 3).map(([event, e]) => e.n + ' ' + (e.n === 1 ? event.toLowerCase() : plural(event.toLowerCase())));
      const wis = S.live?.wis;
      chatter(pick(['Here’s the big picture.', 'Let’s zoom out and look at the whole country.', 'Time for a look across the country.']) + ' There are ' + pool.length + ' active alerts' + (st2 ? ' in ' + (STATE_NAMES[st2] || st2) : ' nationwide') + '.'
        + (common.length ? ' The most common: ' + listWords(common) + '.' : '')
        + (wis?.loaded && Math.random() < 0.5 ? ' The Weather Intensity Score is ' + Math.round(wis.score) + ', ' + wis.label.replace(' / ', ' and ').toLowerCase() + '.' : ''));
    };
    const outlookShot = () => {
      const list = outlooks();
      const order = ['TSTM', 'MRGL', 'SLGT', 'ENH', 'MDT', 'HIGH'];
      const risks = list.map((a) => ({ a, risk: (a.hazards || []).find((h) => h.label === 'RISK')?.value })).filter((r) => r.risk).sort((x, y) => order.indexOf(y.risk) - order.indexOf(x.risk));
      const top = risks[0];
      setCard('<div class="head"><div class="ico">' + icon('outlook', 30) + '</div><div><h2>SPC DAY 1 OUTLOOK</h2><div class="sub">VALID UNTIL ' + esc(top?.a.times?.expires || '') + '</div></div></div>'
        + '<div class="rows">' + risks.map((r) => '<div class="rowi" style="--rc:' + esc(r.a.accent || r.a.color) + '"><i></i><b>' + esc(RISK_NAMES[r.risk] || r.risk) + '</b><span>' + esc(r.risk) + '</span></div>').join('') + '</div>', top?.a.color || '#55bb55');
      fly(CONUS, { padding: { top: 110, bottom: 100, left: 580, right: 110 }, maxZoom: 6 });
      setNow({ k: 'OUTLOOK', title: 'Storm Prediction Center: ' + (RISK_NAMES[top?.risk] || 'Day 1 outlook'), color: top?.a.color || '#55bb55', crawl: risks.map((r) => RISK_NAMES[r.risk] || r.risk).join(' · ') });
      if (top) {
        const risk = (RISK_NAMES[top.risk] || top.risk).toLowerCase();
        chatter('Here’s the Storm Prediction Center’s day one outlook. ' + (top.risk === 'TSTM' ? 'Just general thunderstorms today, nothing organized.' : 'The highest risk today is ' + article(risk) + ' ' + risk + ' for severe storms.'));
      }
    };
    const reportsShot = () => {
      const reports = [...(S.live?.reports || [])].sort((x, y) => Date.parse(y.time) - Date.parse(x.time));
      const latest = reports.slice(0, 7);
      setCard('<div class="head"><div class="ico">' + icon('reports', 30) + '</div><div><h2>STORM REPORTS</h2><div class="sub">LAST 3 HOURS · ' + reports.length + ' REPORTS</div></div></div>'
        + '<div class="rows">' + latest.map((r) => '<div class="rowi" style="--rc:' + (REPORT_COLORS[r.type] || '#fff') + '"><i></i><b>' + esc(reportLabel(r) + ' · ' + r.city + ', ' + r.state) + '</b><span>' + esc(ago(r.time)) + '</span></div>').join('') + '</div>', '#ffd34d');
      const b = bboxOf({ type: 'MultiPoint', coordinates: reports.map((r) => [r.lon, r.lat]) });
      fly(b, { padding: { top: 160, bottom: 150, left: 620, right: 640 }, maxZoom: 7 });
      if (reports[0]) chatter(pick(['Let’s look at storm reports.', 'Here are the latest storm reports.']) + ' There ' + (reports.length === 1 ? 'has been one' : 'have been ' + reports.length) + ' in the last three hours. The most recent: ' + reportWords(reports[0]) + ' near ' + reportCity(reports[0]) + ', ' + (STATE_NAMES[reports[0].state] || reports[0].state) + ', ' + agoWords(reports[0].time) + '.');
      setNow({ k: 'REPORTS', title: reports.length + ' storm reports in the last 3 hours', color: '#ffd34d', crawl: latest.map((r) => r.type + ' · ' + r.city + ', ' + r.state + (r.remark ? ' — ' + r.remark : '')).join('   ◆   ') });
    };

    /* ---------------- tropics (NOAA National Hurricane Center) ---------------- */
    const TC_COLORS = { TD: '#5fd3ff', SD: '#5fd3ff', TS: '#3fa9ff', SS: '#3fa9ff', 1: '#ffd34d', 2: '#ff9f2a', 3: '#ff5a2a', 4: '#ff2a5f', 5: '#d23cff' };
    const WW_NAMES = { HWR: 'Hurricane warning', HWA: 'Hurricane watch', TWR: 'Tropical storm warning', TWA: 'Tropical storm watch' };
    // NHC rounds winds to the nearest 5 mph.
    const ktToMph = (kt) => (Number.isFinite(kt) ? Math.round((kt * 1.15078) / 5) * 5 : null);
    const loadTropics = async () => { S.tropics = await getJson('/api/v3/tropics'); };
    const TC_LAYERS = ['tc-outlook-fill', 'tc-outlook-line', 'tc-cone-fill', 'tc-cone-line', 'tc-models', 'tc-past', 'tc-track', 'tc-ww', 'tc-points'];
    const ensureTropicsLayers = () => {
      const map = S.map;
      if (map.getSource('tc-cone')) return;
      const empty = { type: 'FeatureCollection', features: [] };
      ['tc-outlook', 'tc-cone', 'tc-models', 'tc-past', 'tc-track', 'tc-ww', 'tc-points'].forEach((id) => map.addSource(id, { type: 'geojson', data: empty }));
      const before = 'a-case';
      const risk = ['match', ['get', 'risk7day'], 'High', '#ff3b3b', 'Medium', '#ff9f2a', '#ffd34d'];
      map.addLayer({ id: 'tc-outlook-fill', type: 'fill', source: 'tc-outlook', paint: { 'fill-color': risk, 'fill-opacity': 0.28 } }, before);
      map.addLayer({ id: 'tc-outlook-line', type: 'line', source: 'tc-outlook', paint: { 'line-color': risk, 'line-width': 3 } }, before);
      map.addLayer({ id: 'tc-cone-fill', type: 'fill', source: 'tc-cone', paint: { 'fill-color': '#ffffff', 'fill-opacity': 0.16 } }, before);
      map.addLayer({ id: 'tc-cone-line', type: 'line', source: 'tc-cone', paint: { 'line-color': '#ffffff', 'line-width': 2, 'line-opacity': 0.85 } }, before);
      map.addLayer({ id: 'tc-models', type: 'line', source: 'tc-models', paint: { 'line-color': ['get', 'color'], 'line-width': 2, 'line-opacity': 0.75 } }, before);
      map.addLayer({ id: 'tc-past', type: 'line', source: 'tc-past', paint: { 'line-color': '#cfd6e6', 'line-width': 3, 'line-dasharray': [1.5, 1.5] } }, before);
      map.addLayer({ id: 'tc-track', type: 'line', source: 'tc-track', paint: { 'line-color': '#ffffff', 'line-width': 3.5 } }, before);
      map.addLayer({ id: 'tc-ww', type: 'line', source: 'tc-ww', paint: { 'line-color': ['match', ['get', 'tcww'], 'HWR', '#ff1f1f', 'HWA', '#ff9ad5', 'TWR', '#2f6bff', 'TWA', '#ffe14d', '#ffffff'], 'line-width': 8 } }, before);
      map.addLayer({ id: 'tc-points', type: 'circle', source: 'tc-points', paint: { 'circle-radius': 7, 'circle-color': ['match', ['get', 'dvlbl'], 'M', '#ff2a5f', 'H', '#ff9f2a', 'S', '#3fa9ff', 'D', '#5fd3ff', '#ffffff'], 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } }, before);
    };
    const hideTropics = () => {
      (S.tcMarkers || []).forEach((m) => m.remove());
      S.tcMarkers = [];
      if (!S.styleReady || !S.map.getSource('tc-cone')) return;
      TC_LAYERS.forEach((id) => S.map.setLayoutProperty(id, 'visibility', 'none'));
    };
    const setTropicsData = (storm, outlook) => {
      ensureTropicsLayers();
      const empty = { type: 'FeatureCollection', features: [] };
      S.map.getSource('tc-outlook').setData(outlook || empty);
      S.map.getSource('tc-cone').setData(storm?.cone || empty);
      S.map.getSource('tc-models').setData(storm?.models || empty);
      S.map.getSource('tc-past').setData(storm?.pastTrack || empty);
      S.map.getSource('tc-track').setData(storm?.track || empty);
      S.map.getSource('tc-ww').setData(storm?.watchWarning || empty);
      S.map.getSource('tc-points').setData(storm?.points || empty);
      TC_LAYERS.forEach((id) => S.map.setLayoutProperty(id, 'visibility', 'visible'));
      ['a-fill', 'a-case', 'a-line', 'w-line'].forEach((id) => S.map.setLayoutProperty(id, 'visibility', 'none'));
    };
    const tcMarker = (lon, lat, label, color, badge) => {
      const el = document.createElement('div');
      el.className = 'tcmk';
      el.style.setProperty('--tc', color);
      el.innerHTML = '<i><b>' + esc(badge) + '</b></i><span>' + esc(label) + '</span>';
      return new maplibregl.Marker({ element: el, anchor: 'left' }).setLngLat([lon, lat]).addTo(S.map);
    };
    const stormTitle = (st) => (st.classificationLabel + ' ' + st.name).trim();
    const tropicsShot = () => {
      const tr = S.tropics;
      setMood('calm');
      if (tr.storms.length) {
        S.tcIdx = ((S.tcIdx ?? -1) + 1) % tr.storms.length;
        const st = tr.storms[S.tcIdx];
        const mph = ktToMph(st.intensityKt) ?? st.intensityMph;
        const color = TC_COLORS[st.category] || TC_COLORS[st.classification] || '#ff9f2a';
        const peakKt = Math.max(st.intensityKt || 0, ...st.points.features.map((p) => Number(p.properties.maxwind) || 0));
        const peak = ktToMph(peakKt);
        const wwTypes = [...new Set(st.watchWarning.features.map((w) => w.properties.tcww).filter((k) => WW_NAMES[k]))];
        const others = tr.storms.filter((x) => x !== st);
        setTropicsData(st, null);
        S.tcMarkers = [tcMarker(st.longitude, st.latitude, stormTitle(st), color, st.category ? String(st.category) : st.classification)];
        const rows = [
          ['MAX WINDS', '<dd>' + (mph != null ? mph + ' MPH' : 'n/a') + '</dd>'],
          ['PRESSURE', '<dd>' + (st.pressureMb ? st.pressureMb + ' MB' : 'n/a') + '</dd>'],
          ['MOVING', '<dd>' + (st.movementCompass ? esc(st.movementCompass) + ' AT ' + st.movementSpeedMph + ' MPH' : 'STATIONARY') + '</dd>'],
          ['FORECAST PEAK', '<dd>' + (peak ? peak + ' MPH' : 'n/a') + '</dd>'],
          ['COAST', '<dd>' + (wwTypes.length ? esc(wwTypes.map((k) => WW_NAMES[k].toUpperCase()).join(' · ')) : 'NO WATCHES OR WARNINGS') + '</dd>'],
          ['NHC', '<dd>ADVISORY ' + esc(String(Number(st.advisoryNumber) || st.advisoryNumber || '')) + (st.models.features.length ? ' · ' + st.models.features.length + ' MODEL TRACKS' : '') + '</dd>']
        ];
        setCard('<div class="head"><div class="ico">' + icon('tropical', 30) + '</div><div><h2>' + esc(stormTitle(st)) + '</h2><div class="sub">' + esc((st.category ? 'CATEGORY ' + st.category + ' · ' : '') + st.basin.toUpperCase()) + '</div></div>'
          + (tr.storms.length > 1 ? '<span class="status">' + (S.tcIdx + 1) + ' OF ' + tr.storms.length + '</span>' : '') + '</div>'
          + '<dl>' + rows.map(([k, v]) => '<dt>' + k + '</dt>' + v).join('') + '</dl>', color);
        const geo = { type: 'GeometryCollection', geometries: [...st.cone.features, ...st.pastTrack.features, ...st.points.features].map((x) => x.geometry).filter(Boolean) };
        const b = bboxOf(geo) || [[st.longitude - 8, st.latitude - 6], [st.longitude + 8, st.latitude + 6]];
        fly(b, { padding: { top: 140, bottom: 140, left: 620, right: 360 }, maxZoom: 6.2 });
        setNow({
          k: 'TROPICS',
          title: stormTitle(st) + (st.category ? ' · Category ' + st.category : '') + (mph != null ? ' · ' + mph + ' mph' : ''),
          color,
          crawl: [st.basin.toUpperCase(), Math.abs(st.latitude).toFixed(1) + (st.latitude >= 0 ? 'N' : 'S') + ' ' + Math.abs(st.longitude).toFixed(1) + (st.longitude < 0 ? 'W' : 'E'),
            st.movementCompass ? 'MOVING ' + st.movementCompass + ' AT ' + st.movementSpeedMph + ' MPH' : '', st.pressureMb ? st.pressureMb + ' MB' : '',
            'NHC ADVISORY ' + (Number(st.advisoryNumber) || ''), ...others.map((o) => 'ALSO ACTIVE: ' + stormTitle(o).toUpperCase() + ' (' + o.basin.toUpperCase() + ')')].filter(Boolean).join(' · ')
        });
        // Talk about each storm once per advisory.
        const said = st.id + ':' + st.advisoryNumber;
        if (S.spoken.has(said)) {
          chatter(pick(['Another look at ', 'Checking back on ', 'Here’s ']) + stormTitle(st) + (mph != null ? ', still ' + mph + ' miles per hour' : '') + (st.movementCompass ? ' and moving ' + compassWords(st.movementCompass) : '') + '.');
        } else {
          S.spoken.add(said);
          let text = (S.tcIdx === 0 ? 'Let’s check the tropics. ' : 'Next up in the tropics. ') + stormTitle(st) + ' is ' + (st.category ? article(String(st.category)) + ' category ' + st.category + ' hurricane' : 'a ' + st.classificationLabel.toLowerCase()) + ' in the ' + st.basin + (mph != null ? ', with maximum sustained winds of ' + mph + ' miles per hour' : '') + '.';
          if (st.movementCompass) text += ' It is moving ' + compassWords(st.movementCompass) + ' at ' + st.movementSpeedMph + ' miles per hour.';
          if (peak && mph != null && peak >= mph + 10) text += ' The National Hurricane Center forecasts it to strengthen, peaking near ' + peak + ' miles per hour.';
          else if (peak && mph != null && peak <= mph) text += ' The National Hurricane Center forecasts it to hold steady or weaken.';
          if (wwTypes.length) text += ' ' + wwTypes.map((k) => WW_NAMES[k] + 's').join(' and ') + ' are in effect along the coast.';
          if (S.tcIdx === 0 && others.length) text += ' We are also tracking ' + others.map(stormTitle).join(' and ') + '.';
          say(text);
        }
        return;
      }
      // No storms: the NHC 7-day outlook areas.
      const areas = tr.outlook.features.slice().sort((a, b) => parseInt(b.properties.prob7day, 10) - parseInt(a.properties.prob7day, 10));
      setTropicsData(null, tr.outlook);
      const color = '#ff9f2a';
      setCard('<div class="head"><div class="ico">' + icon('tropical', 30) + '</div><div><h2>TROPICAL OUTLOOK</h2><div class="sub">NHC · NEXT 7 DAYS</div></div></div>'
        + '<div class="rows">' + areas.map((a) => '<div class="rowi" style="--rc:' + ({ High: '#ff3b3b', Medium: '#ff9f2a' }[a.properties.risk7day] || '#ffd34d') + '"><i></i><b>' + esc(a.properties.basin) + '</b><em>' + esc(a.properties.prob7day) + '</em></div>').join('') + '</div>', color);
      const b = bboxOf({ type: 'GeometryCollection', geometries: areas.map((a) => a.geometry).filter(Boolean) });
      fly(b, { padding: { top: 160, bottom: 160, left: 640, right: 380 }, maxZoom: 5 });
      setNow({ k: 'TROPICS', title: 'No named storms · ' + areas.length + ' area' + (areas.length === 1 ? '' : 's') + ' to watch', color, crawl: areas.map((a) => a.properties.basin.toUpperCase() + ': ' + a.properties.prob2day + ' IN 2 DAYS, ' + a.properties.prob7day + ' IN 7 DAYS').join(' · ') });
      const said = 'outlook:' + areas.map((a) => a.properties.basin + a.properties.prob7day).join();
      if (!S.spoken.has(said) && areas.length) {
        S.spoken.add(said);
        const top = areas[0].properties;
        say('Let’s check the tropics. There are no named storms right now. The National Hurricane Center is watching ' + areas.length + ' area' + (areas.length === 1 ? '' : 's') + '. The best chance is in the ' + top.basin + ', with a ' + parseInt(top.prob7day, 10) + ' percent chance of development over the next 7 days.');
      }
    };

    /* ---------------- WeBot talks on every shot ---------------- */
    const pick = (list) => list[Math.floor(Math.random() * list.length)];
    // Commentary never piles up: if WeBot is still talking, the new line is skipped.
    const chatter = (text) => { if (text && !speech.busy && !speech.queue.length) say(text); };
    // Lines that must not be dropped (like the camera intro) wait their turn instead, unless a lot is queued.
    // (The queue holds sentences, and one alert line is several sentences, so the cap is generous.)
    const sayNext = (text) => { if (text && speech.queue.length < 14) say(text); };

    // Camera names as they'd be said on air: "ARDOT US 71 @ Gilham RXR Overpass" -> "U.S. 71 at the Gilham railroad crossing overpass".
    const camSpoken = (name) => String(name || '')
      .replace(/^(ARDOT|Caltrans|WSDOT|MoDOT|ODOT|TxDOT|KDOT|NDOT|UDOT|CDOT|IDOT|INDOT|MnDOT|GDOT|FDOT|NCDOT|VDOT|PennDOT|NYSDOT|KanDrive|DriveTexas|iDrive\s?\w*)\b\s*/i, '')
      .replace(/\s+-\s+/g, ', ')
      .replace(/\([^)]*\)/g, ' ')
      .replace(/\s*:\s*/g, ', ')
      .replace(/\s*@\s*/g, ' at ')
      .replace(/\bRXR\b/gi, 'railroad crossing')
      .replace(/\bI-?\s?(\d+)\b/g, 'Interstate $1')
      .replace(/\bUS[- ]?(\d+)\b/g, 'U.S. $1')
      .replace(/\bSR[- ]?(\d+)\b/g, 'State Route $1')
      .replace(/\bMP\s?([\d.]+)/g, 'mile marker $1')
      .replace(/\b(NB|SB|EB|WB)\b/g, (d) => ({ NB: 'northbound', SB: 'southbound', EB: 'eastbound', WB: 'westbound' })[d])
      .replace(/\s+/g, ' ').replace(/^[,\s]+|[,\s]+$/g, '').trim();
    // What WeBot says about a camera, from what is actually going on there.
    const camTalk = (cam, kind) => {
      const where = camSpoken(cam.name) + (cam.state && STATE_NAMES[cam.state] ? ' in ' + STATE_NAMES[cam.state] : '');
      const inside = S.alerts.filter((x) => ['warnings', 'watches'].includes(x.group) && inGeometry([cam.lon, cam.lat], x.geometry)).sort((x, y) => x.rank - y.rank)[0];
      let t = kind === 'still' ? pick(['Still keeping an eye on our camera at ', 'Checking back on the camera at ', 'Here’s another look at ']) + where + '.'
        : kind === 'pinned' ? pick(['We’re going to keep a camera up on ', 'Let’s keep watching the camera at ', 'Pulling up a live camera at ']) + where + '.'
          : pick(['Here’s a live look from a camera at ', 'Let’s check a nearby camera at ', 'Live from a traffic camera at ']) + where + '.';
      if (inside) t += ' That camera is right inside ' + article(inside.event) + ' ' + inside.event.toLowerCase() + '.';
      else if (cam.miles != null && kind === 'auto') t += ' It’s about ' + Math.max(1, Math.round(cam.miles)) + ' miles from the center of this ' + (S.shot?.alert?.event || 'alert').toLowerCase() + '.';
      return t;
    };
    const listWords = (items) => (items.length <= 1 ? items[0] || '' : items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1]);
    const plural = (w) => (/[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : /(s|ch|sh|x)$/.test(w) ? w + 'es' : w + 's');
    const COMPASS = { N: 'north', S: 'south', E: 'east', W: 'west' };
    const compassWords = (c) => (c.length === 3 ? COMPASS[c[0]] + ' ' + COMPASS[c[1]] + COMPASS[c[2]] : c.split('').map((x) => COMPASS[x]).join(''));
    const titleCase = (text) => String(text || '')
      .replace(/\bAFB\b/g, 'Air Force Base')
      .replace(/\s*&\s*/g, ' and ')
      .replace(/\b[A-Z][A-Z'.]+\b/g, (w) => w.charAt(0) + w.slice(1).toLowerCase());
    const placeOf = (a) => titleCase((a.area && a.area.length <= 60 ? a.area : stateLine(a) || a.place || a.area || '')
      .replace(/,\s*([A-Z]{2})\b/g, (m, st) => ', ' + (STATE_NAMES[st] || st)).replace(/\s*\/\s*/g, ' and '));
    const minutesLeft = (iso) => {
      const m = Math.round((Date.parse(iso || '') - Date.now()) / 60000);
      if (!Number.isFinite(m) || m <= 0) return '';
      if (m < 60) return m + ' minute' + (m === 1 ? '' : 's');
      const h = Math.floor(m / 60);
      return h + ' hour' + (h === 1 ? '' : 's') + (m % 60 >= 10 ? ' and ' + (m % 60) + ' minutes' : '');
    };
    const agoWords = (iso) => {
      const m = Math.round((Date.now() - Date.parse(iso || '')) / 60000);
      return !Number.isFinite(m) ? '' : m < 2 ? 'just now' : m < 60 ? m + ' minutes ago' : Math.floor(m / 60) + ' hour' + (m >= 120 ? 's' : '') + ' ago';
    };
    const HAIL_NAMES = [[4.5, 'softball'], [4, 'grapefruit'], [3, 'teacup'], [2.75, 'baseball'], [2.5, 'tennis ball'], [2, 'hen egg'], [1.75, 'golf ball'], [1.5, 'ping pong ball'], [1.25, 'half dollar'], [1, 'quarter'], [0.88, 'nickel'], [0.75, 'penny']];
    const hazardWords = (a) => (a.hazards || []).map((h) => {
      const v = String(h.value || '');
      const label = String(h.label || '').toUpperCase();
      if (label === 'HAIL') {
        const n = parseFloat(v);
        const name = n && (HAIL_NAMES.find(([size]) => n >= size - 0.01) || [])[1];
        return n ? (name ? name + ' size hail' : n + ' inch hail') : '';
      }
      if (label === 'WIND' || label === 'GUSTS') { const n = parseInt(v, 10); return n ? 'wind gusts up to ' + n + ' miles per hour' : ''; }
      if (label === 'TORNADO') return /OBSERVED/i.test(v) ? 'an observed tornado' : /RADAR/i.test(v) ? 'a radar indicated tornado' : /POSSIBLE/i.test(v) ? 'a possible tornado' : '';
      return '';
    }).filter(Boolean);
    const reportCity = (r) => String(r.city || '').replace(/^\d+(\.\d+)?\s+[NSEW]{1,3}\s+/, '');
    const reportWords = (r) => {
      const m = r.magnitude;
      switch (r.type) {
        case 'Hail': return (m ? m + ' inch ' : '') + 'hail';
        case 'Wind': case 'Marine Wind': return m ? 'a ' + m + ' mile per hour wind gust' : 'damaging wind';
        case 'Rain': return (m ? m + ' inches of ' : '') + 'rain';
        case 'Snow': return (m ? m + ' inches of ' : '') + 'snow';
        case 'Tornado': return 'a tornado';
        case 'Funnel Cloud': return 'a funnel cloud';
        case 'Flood': return 'flooding';
        case 'Damage': return 'storm damage';
        default: return String(r.type || 'a report').toLowerCase();
      }
    };
    const reportsNear = (a) => {
      const b = bboxOf(a.geometry);
      if (!b) return [];
      return (S.live?.reports || []).filter((r) => r.lon >= b[0][0] - 0.3 && r.lon <= b[1][0] + 0.3 && r.lat >= b[0][1] - 0.3 && r.lat <= b[1][1] + 0.3)
        .sort((x, y) => Date.parse(y.time) - Date.parse(x.time));
    };
    const talked = new Map();
    const alertTalk = (a, shot) => {
      const prev = talked.get(a.key);
      if (shot.pinned && prev && Date.now() - prev.at < 3 * 60 * 1000) return '';
      const place = placeOf(a);
      const ev = a.event.toLowerCase();
      const left = minutesLeft(a.expiresAt);
      const reports = reportsNear(a);
      talked.set(a.key, { at: Date.now(), reports: reports.length });
      if (prev && Date.now() - prev.at < 30 * 60 * 1000) {
        let t = pick(['Back to', 'Another look at', 'Still watching', 'Checking back on']) + ' the ' + ev + ' for ' + place + '.';
        if (left) t += ' It expires in ' + left + '.';
        const fresh = reports.length - prev.reports;
        if (fresh > 0) t += ' There ' + (fresh === 1 ? 'is a new storm report' : 'are ' + fresh + ' new storm reports') + ' nearby: ' + reportWords(reports[0]) + ' near ' + reportCity(reports[0]) + '.';
        return t;
      }
      let t = pick(['Let’s go to ', 'Taking a look at ', 'Now over to ', 'Checking in on ', 'Heading to ']) + place + ', where ' + article(ev) + ' ' + ev + ' is in effect' + (a.times?.expires ? ' until ' + a.times.expires : '') + '.';
      if (a.summary && /^at \d/i.test(a.summary)) t += ' ' + a.summary.split(/(?<=\.)\s/)[0];
      const hz = hazardWords(a);
      if (hz.length) t += ' ' + pick(['This storm could bring ', 'Hazards include ', 'Expect ']) + listWords(hz) + '.';
      if (reports.length) t += ' There ' + (reports.length === 1 ? 'has been one storm report' : 'have been ' + reports.length + ' storm reports') + ' nearby in the last three hours, most recently ' + reportWords(reports[0]) + ' near ' + reportCity(reports[0]) + '.';
      const site = nearestSite(centerOf(a));
      if (site && Math.random() < 0.45) t += ' This is the ' + titleCase(site.name) + ' radar.';
      if (a.people && a.rank <= 4) t += ' About ' + shortNum(a.people).replace('K', ' thousand').replace('M', ' million') + ' people are inside it.';
      if (a.rank <= 2) t += ' If you are in this area, take shelter now.';
      return t;
    };

    /* ---------------- live cameras (WeatherPower Traffic camera network) ---------------- */
    const camCache = new Map();
    let hlsReady = null;
    const loadHls = () => hlsReady || (hlsReady = new Promise((resolve, reject) => {
      const tag = document.createElement('script');
      tag.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js';
      tag.onload = () => resolve(window.Hls);
      tag.onerror = reject;
      document.head.appendChild(tag);
    }));
    // One camera player for both modes: Auto (nearest camera to the alert on screen) and Pinned
    // (a camera chosen in Live Control, kept on screen through every shot until it's changed).
    const camCfg = () => ({ mode: 'auto', id: null, ...(S.control.camera || {}) });
    const hideCam = (force) => {
      if (S.camPinnedId && !force) return;
      clearTimeout(S.camTimer);
      clearInterval(S.camRefresh);
      S.camHls?.destroy?.();
      S.camHls = null;
      S.camMarker?.remove();
      S.camMarker = null;
      $('cam').classList.remove('show');
      $('cam-feed').innerHTML = '';
    };
    const camImage = (url, fallback) => {
      const img = document.createElement('img');
      img.alt = '';
      img.src = url;
      img.onerror = () => { if (fallback && img.src !== fallback) img.src = fallback; else hideCam(true); };
      return img;
    };
    const playCam = async (cam, { onDead, still } = {}) => {
      clearInterval(S.camRefresh);
      S.camHls?.destroy?.();
      S.camHls = null;
      S.camMarker?.remove();
      // Video comes through this server's stream proxy (a site-relative /api/ path).
      const feedUrl = cam.feed.startsWith('/') ? BASE + cam.feed : cam.feed;
      const feed = $('cam-feed');
      feed.innerHTML = '';
      if (cam.kind === 'hls' && !still) {
        const video = document.createElement('video');
        video.muted = true; video.autoplay = true; video.playsInline = true;
        feed.appendChild(video);
        // A dead feed: show its still image if it has one.
        const bail = () => { onDead?.(); feed.innerHTML = ''; if (cam.snapshot) feed.appendChild(camImage(cam.snapshot)); else hideCam(true); };
        // hls.js first: newer Chrome claims native HLS but can't play these agency streams.
        // The built-in player is only for browsers without hls.js support (Safari).
        const Hls = await loadHls().catch(() => null);
        if (Hls?.isSupported()) {
          S.camHls = new Hls({ maxBufferLength: 10 });
          S.camHls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) bail(); });
          S.camHls.loadSource(feedUrl);
          S.camHls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = feedUrl;
          video.onerror = bail;
        } else {
          bail();
          return;
        }
      } else {
        const url = cam.kind === 'hls' ? cam.snapshot : feedUrl;
        if (!url) { hideCam(true); return; }
        feed.appendChild(camImage(url));
        // Still cameras refresh every 20 seconds.
        S.camRefresh = setInterval(() => {
          const img = feed.querySelector('img');
          if (img) img.src = url + (url.includes('?') ? '&' : '?') + '_wp=' + Date.now();
        }, 20000);
      }
      $('cam-name').textContent = cam.name;
      $('cam-sub').textContent = [cam.agency, cam.state, cam.miles != null ? cam.miles + ' MI' : ''].filter(Boolean).join(' · ');
      $('cam').classList.add('show');
      const el = document.createElement('div');
      el.className = 'cammk';
      el.innerHTML = '<i></i><span>' + esc(cam.name) + '</span>';
      S.camMarker = new maplibregl.Marker({ element: el, anchor: 'top' }).setLngLat([cam.lon, cam.lat]).addTo(S.map);
    };
    // Auto mode: nearest working camera within 30 miles of the alert, a couple of seconds into the zoom.
    const showCamFor = (a, shot) => {
      if (S.camsOff || camCfg().mode !== 'auto') return;
      const c = centerOf(a);
      if (!c) return;
      S.camTimer = setTimeout(async () => {
        if (S.shot !== shot) return;
        let body = camCache.get(a.key);
        if (!body) {
          try { body = await getJson('/api/v3/cameras/near?lat=' + c[1].toFixed(3) + '&lon=' + c[0].toFixed(3) + '&miles=30&limit=1'); } catch { return; }
          camCache.set(a.key, body);
          if (camCache.size > 80) camCache.delete(camCache.keys().next().value);
        }
        // No camera source, or cameras are off air (no broadcast permission): stop asking.
        if (!body.configured || body.onAir === false) { S.camsOff = true; return; }
        const cam = body.cameras?.[0];
        if (!cam || S.shot !== shot || camCfg().mode !== 'auto') return;
        // If it dies, ask the server again next time (it skips camera sites that refused us).
        await playCam(cam, { onDead: () => camCache.delete(a.key) });
        // Always introduce the camera (queued after whatever WeBot is saying about the alert).
        if (S.shot === shot) sayNext(camTalk(cam, 'auto'));
      }, 2600);
    };
    // Pinned mode / Off, applied whenever Live Control changes the camera setting.
    const applyCameraControl = async () => {
      const cfg = camCfg();
      const want = cfg.mode === 'pinned' && cfg.id ? cfg.id : null;
      if (cfg.mode === 'off' && !S.camPinnedId) hideCam(true);
      if (want === S.camPinnedId) return;
      S.camPinnedId = want;
      S.camPinned = null;
      hideCam(true);
      if (!want) return;
      try {
        const cam = await getJson('/api/v3/cameras/item/' + encodeURIComponent(want));
        if (S.camPinnedId !== want) return;
        await playCam(cam);
        S.camPinned = cam;
        S.pinTalk = 0;
        sayNext(camTalk(cam, 'pinned'));
      } catch (error) {
        console.warn('Pinned camera unavailable:', error.message);
      }
    };

    /* ---------------- national radar + WPC surface map ---------------- */
    const loadSurface = async () => { S.surface = await getJson('/api/v3/surface'); };
    const ensureSurfaceLayers = () => {
      const map = S.map;
      if (map.getSource('sfc')) return;
      map.addSource('sfc', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      const color = ['match', ['get', 'type'], 'COLD', '#3f7bff', 'WARM', '#ff3b3b', 'STNRY', '#ff3b3b', 'OCFNT', '#b44dff', 'DRYLINE', '#c8a46e', '#ff9f2a'];
      map.addLayer({ id: 'sfc-halo', type: 'line', source: 'sfc', filter: ['!=', ['get', 'type'], 'TROF'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#000', 'line-opacity': 0.45, 'line-width': 7 } }, 'a-case');
      map.addLayer({ id: 'sfc-front', type: 'line', source: 'sfc', filter: ['!=', ['get', 'type'], 'TROF'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': color, 'line-width': 4 } }, 'a-case');
      // Stationary fronts alternate red and blue.
      map.addLayer({ id: 'sfc-stnry', type: 'line', source: 'sfc', filter: ['==', ['get', 'type'], 'STNRY'], paint: { 'line-color': '#3f7bff', 'line-width': 4, 'line-dasharray': [2, 2] } }, 'a-case');
      map.addLayer({ id: 'sfc-trof', type: 'line', source: 'sfc', filter: ['==', ['get', 'type'], 'TROF'], paint: { 'line-color': '#ff9f2a', 'line-width': 2.2, 'line-dasharray': [3, 2.5], 'line-opacity': 0.9 } }, 'a-case');
    };
    const SFC_LAYERS = ['sfc-halo', 'sfc-front', 'sfc-stnry', 'sfc-trof'];
    const hideSurface = () => {
      (S.hlMarkers || []).forEach((m) => m.remove());
      S.hlMarkers = [];
      if (S.styleReady && S.map.getSource('sfc')) SFC_LAYERS.forEach((id) => S.map.setLayoutProperty(id, 'visibility', 'none'));
    };
    const inView = (p) => p.lat > 15 && p.lat < 60 && p.lon > -140 && p.lon < -52;
    const inConus = (p) => p.lat > 24 && p.lat < 50 && p.lon > -125 && p.lon < -66;
    const placeNear = (lon, lat) => { const site = nearestSite([lon, lat]); return site ? titleCase(site.name) + ', ' + (STATE_NAMES[site.state] || site.state) : ''; };
    const surfaceShot = () => {
      const sf = S.surface;
      setMood('calm');
      ensureSurfaceLayers();
      S.map.getSource('sfc').setData(sf.fronts);
      SFC_LAYERS.forEach((id) => S.map.setLayoutProperty(id, 'visibility', 'visible'));
      ['a-fill', 'a-case', 'a-line', 'w-line'].forEach((id) => S.map.setLayoutProperty(id, 'visibility', 'none'));
      S.hlMarkers = [...sf.highs.filter(inView).map((p) => ['h', p]), ...sf.lows.filter(inView).map((p) => ['l', p])].map(([kind, p]) => {
        const el = document.createElement('div');
        el.className = 'hlmk ' + kind;
        el.innerHTML = '<b>' + kind.toUpperCase() + '</b><small>' + p.mb + ' mb</small>';
        return new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([p.lon, p.lat]).addTo(S.map);
      });
      fly(CONUS, { padding: { top: 110, bottom: 110, left: 140, right: 300 }, maxZoom: 5 });
      // Bottom line: what's playing (like Ryan's quiet-mode bar), or the surface map itself.
      const wisMode = S.live?.wis?.loaded ? S.live.wis.label.toUpperCase() : 'LIVE';
      if (M.mode && M.playing) {
        const [song, artist] = M.playing.includes(' · ') ? M.playing.split(' · ') : M.playing.split(' — ');
        setNow({ k: 'NOW PLAYING', title: song, color: '#1a8cff', crawl: 'ARTIST NAME · ' + (artist || 'WEBOT RADIO').toUpperCase() + '      ◆      MODE · ' + wisMode + '      ◆      SURFACE MAP · NWS WEATHER PREDICTION CENTER' });
      } else {
        setNow({ k: 'NATIONAL RADAR', title: 'Radar and surface map', color: '#1a8cff', crawl: 'HIGHS, LOWS AND FRONTS · NWS WEATHER PREDICTION CENTER · MODE · ' + wisMode });
      }
      // WeBot's take, from the analysis itself.
      const high = sf.highs.filter(inConus).sort((a, b) => b.mb - a.mb)[0];
      const low = sf.lows.filter(inConus).sort((a, b) => a.mb - b.mb)[0];
      const cold = sf.fronts.features.filter((x) => x.properties.type === 'COLD')
        .map((x) => ({ x, pts: x.geometry.coordinates.filter(([lon, lat]) => inConus({ lon, lat })) }))
        .filter((c) => c.pts.length >= 2).sort((a, b) => b.pts.length - a.pts.length)[0];
      let text = pick(['Here’s the national radar with the latest surface map.', 'Let’s check the national radar and the surface map.', 'Time for a look at the big picture on radar.']);
      if (high) text += ' High pressure near ' + placeNear(high.lon, high.lat) + ', at ' + high.mb + ' millibars, is keeping things calm there.';
      if (low) text += ' The strongest low over the lower 48 is near ' + placeNear(low.lon, low.lat) + ', at ' + low.mb + ' millibars.';
      if (cold) {
        const a = cold.pts[0];
        const b = cold.pts[cold.pts.length - 1];
        const from = placeNear(a[0], a[1]);
        const to = placeNear(b[0], b[1]);
        if (from && to && from !== to) text += ' A cold front stretches from ' + from + ' to ' + to + '.';
      }
      chatter(text);
    };

    /* ---------------- breaking + speech text ---------------- */
    const article = (word) => (/^[aeiou]/i.test(word) ? 'an' : 'a');
    const spokenAlert = (a, lead) => {
      const place = (a.area || stateLine(a) || a.place || '')
        .replace(/,\s*([A-Z]{2})\b/g, (m, st) => ', ' + (STATE_NAMES[st] || st))
        .replace(/\b[A-Z][A-Z']+\b/g, (w) => w.charAt(0) + w.slice(1).toLowerCase());
      const until = a.times?.expires ? ' until ' + a.times.expires : '';
      let text = lead + article(a.event) + ' ' + a.event.toLowerCase() + ' is in effect for ' + place + until + '.';
      if (a.summary) text += ' ' + a.summary;
      if (a.people) text += ' About ' + shortNum(a.people).replace('K', ' thousand').replace('M', ' million') + ' people are in the warning.';
      if (a.rank <= 2) text += ' If you are in this area, take shelter now.';
      return text;
    };
    const showBreaking = (a, test) => new Promise((resolve) => {
      const brk = $('brk');
      brk.style.setProperty('--c', a.color || '#c00');
      brk.style.setProperty('--ci', ink(a.color || '#c00'));
      brk.innerHTML = '<div class="stripes"></div>' + (test ? '<div class="test">TEST · NOT A NEW ALERT</div>' : '')
        + '<div class="k">BREAKING</div><h1>' + esc(a.eventLabel) + '</h1>'
        + '<div class="p">' + esc(a.area || stateLine(a)) + '</div>'
        + '<div class="u">UNTIL ' + esc(a.times?.expires || '') + (a.people ? ' · ~' + esc(shortNum(a.people)) + ' PEOPLE' : '') + '</div>'
        + (a.threat ? '<div class="t">' + esc(a.threat) + '</div>' : '');
      brk.classList.remove('out');
      brk.classList.add('show');
      chime('breaking');
      setMood('danger');
      S.spoken.add(a.key);
      say(spokenAlert(a, test ? 'This is a test of the WeatherPower alert system. ' : 'Breaking. '), { label: test ? 'TEST ALERT' : 'BREAKING' });
      setTimeout(() => {
        brk.classList.add('out');
        setTimeout(() => { brk.classList.remove('show', 'out'); resolve(); }, 520);
      }, 5600);
    });

    /* ---------------- data ---------------- */
    const loadAlerts = async () => {
      const body = await getJson('/api/v3/alerts');
      S.alerts = body.alerts || [];
      if (S.styleReady) S.map.getSource('alerts')?.setData(alertFC());
      const keys = new Set(S.alerts.map((a) => a.key));
      if (!S.seen) {
        S.seen = keys;
      } else {
        const st = focusState();
        const fresh = S.alerts.filter((a) => !S.seen.has(a.key) && notable(a) && (!st || a.states.includes(st)));
        fresh.forEach((a) => S.seen.add(a.key));
        keys.forEach((k) => S.seen.add(k));
        const breaking = fresh.filter(isBreaking).sort((x, y) => x.rank - y.rank);
        const others = fresh.filter((a) => !isBreaking(a) && a.group === 'warnings' && !/^flood warning$/i.test(a.event)).slice(0, 4);
        if (others.length) { chime('new'); S.fresh.push(...others.map((a) => a.key)); }
        if (breaking.length) {
          S.breaking.push(...breaking.map((a) => ({ key: a.key, alert: a })));
          if (!S.inBreaking && !S.shot?.breaking) nextShot();
        }
      }
      if (S.shot?.alert) {
        const updated = byKey(S.shot.alert.key);
        if (updated) S.shot.alert = updated;
      }
      buildHeadlines();
    };
    const loadLive = async () => {
      // The query is a heartbeat for the control panel: what is playing and which voice is on.
      const body = await getJson('/api/v3/live?' + new URLSearchParams({ np: M.mode ? M.playing : '', mood: M.mode === 'radio' ? M.mood : '', tts: !voiceOn() ? 'voice off' : talkAllowed() ? ttsLabel() : talkMode() === 'off' ? 'quiet (talk off)' : 'quiet until WIS 100', theme: S.themeKey || '' }));
      const prevRev = S.control.rev;
      const prevCtl = S.control;
      S.live = body;
      S.control = body.control || S.control;
      renderTop();
      if (S.styleReady) S.map.getSource('reports')?.setData(reportFC());
      const st = focusState();
      $('focus').style.display = st ? 'block' : 'none';
      $('focus').textContent = st ? 'FOCUS · ' + (STATE_NAMES[st] || st).toUpperCase() : '';
      if (S.lastCmd == null) {
        S.lastCmd = Math.max(0, ...(S.control.commands || []).map((c) => c.id));
      } else {
        for (const cmd of (S.control.commands || []).filter((c) => c.id > S.lastCmd)) {
          S.lastCmd = cmd.id;
          if (cmd.type === 'say') say(cmd.text, { force: true });
          else if (cmd.type === 'next') nextShot(true);
          else if (cmd.type === 'reload') location.reload();
          else if (cmd.type === 'music-next') musicNext();
          else if (cmd.type === 'test-breaking') {
            const a = (cmd.key && byKey(cmd.key)) || candidates()[0];
            if (a) { S.breaking.unshift({ key: a.key, alert: a, test: true }); if (!S.inBreaking) nextShot(); }
          }
        }
      }
      if (ttsCfg().engine === 'neural' && OPT.voice) startNeural();
      if (ttsCfg().engine === 'puter' && OPT.voice) startPuter();
      if (!talkAllowed() && speech.queue.some((item) => !item.force)) speech.queue = speech.queue.filter((item) => item.force);
      const linkedAt = S.control.puter?.linkedAt || null;
      if (linkedAt !== S.puterLinkedAt) { S.puterLinkedAt = linkedAt; if (['ready', 'signed-out'].includes(pt.state)) linkPuter(); }
      applyCameraControl();
      puterGate();
      loadMusicFiles();
      if (prevRev >= 0 && prevRev !== S.control.rev && (prevCtl.pin !== S.control.pin || prevCtl.mode !== S.control.mode || prevCtl.state !== S.control.state)) {
        S.recent = [];
        buildHeadlines();
        nextShot(true);
      }
    };
    const loadRadar = async () => {
      const radar = await getJson('/api/v3/radar');
      if (S.radar && S.radar.validAt === radar.validAt) return;
      const first = !S.radar;
      S.radar = radar;
      if (!first && S.styleReady) radar.reflectivity.forEach((f, i) => S.map.getSource('rf' + i)?.setTiles?.([f.tiles]));
    };
    const poll = (fn, ms) => { const run = () => fn().catch((e) => console.warn(e.message)).finally(() => setTimeout(run, ms)); setTimeout(run, ms); };

    const roundup = () => {
      if (S.inBreaking || speech.busy) return;
      const t = S.live?.tallies || {};
      const wis = S.live?.wis;
      const parts = [];
      if (t.tor) parts.push(t.tor + ' tornado warning' + (t.tor === 1 ? '' : 's'));
      if (t.svr) parts.push(t.svr + ' severe thunderstorm warning' + (t.svr === 1 ? '' : 's'));
      if (t.ffw) parts.push(t.ffw + ' flash flood warning' + (t.ffw === 1 ? '' : 's'));
      const watches = (t.torWatch || 0) + (t.svrWatch || 0);
      let text = 'WeatherPower update. ';
      text += parts.length ? 'Right now there ' + (parts.length === 1 && /^1 /.test(parts[0]) ? 'is ' : 'are ') + parts.join(', ') + ' across the country.' : 'No tornado, severe thunderstorm or flash flood warnings are in effect right now.';
      if (watches) text += ' ' + watches + ' severe weather watch' + (watches === 1 ? ' is' : 'es are') + ' active.';
      if (wis?.loaded) text += ' The Weather Intensity Score is ' + Math.round(wis.score) + ', ' + wis.label.replace(' / ', ' and ').toLowerCase() + '.';
      say(text, { label: 'UPDATE' });
    };
    setInterval(() => {
      if (Date.now() - S.lastRoundup > 20 * 60 * 1000) { S.lastRoundup = Date.now(); roundup(); }
      else if (OPT.tips && Date.now() - S.lastTip > 4 * 60 * 1000 && (S.live?.tallies?.tor || 0) === 0) {
        S.lastTip = Date.now();
        S.tip = TIPS[Math.floor(Math.random() * TIPS.length)];
      }
    }, 15000);

    /* ---------------- boot ---------------- */
    const boot = async () => {
      const [config, radar, sites] = await Promise.all([
        getJson('/api/v3/config'),
        getJson('/api/v3/radar').catch(() => null),
        getJson('/api/v3/nexrad').catch(() => ({ sites: [] }))
      ]);
      S.radar = radar;
      S.sites = sites.sites || [];
      S.home = config.home || null;
      S.soundings = Boolean(config.soundings);
      S.openaiVoice = Boolean((await getJson('/api/v3/live/voice').catch(() => null))?.openai?.available);
      await Promise.all([loadAlerts(), loadLive()]).catch((e) => console.warn(e.message));
      S.map = new maplibregl.Map({
        container: 'map', style: config.darkStyleUrl, center: [-96, 38.6], zoom: 4.1,
        interactive: false, attributionControl: false, fadeDuration: 0
      });
      S.map.once('style.load', () => {
        installLayers();
        showHeadline();
        $('boot').classList.add('done');
        nextShot();
      });
      poll(loadAlerts, 20000);
      poll(loadLive, 6000);
      poll(loadRadar, 120000);
      loadTropics().catch(() => {});
      loadSurface().catch(() => {});
      poll(loadSurface, 15 * 60 * 1000);
      poll(loadTropics, 5 * 60 * 1000);
    };
    boot().catch((error) => { $('boot').textContent = 'WEATHERPOWER LIVE · RECONNECTING…'; console.error(error); setTimeout(() => location.reload(), 15000); });
    // Long-running stream: a reload every 6 hours keeps browser memory in check.
    setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
  })();
  </script>
</body>
