<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a10">
  <title>Warning Details · WeatherPower</title>
  <link rel="icon" type="image/png" href="/warningcenter/favicon.ico">
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    @font-face { font-family: "WP Display"; src: url("/warningcenter/public/assets/fonts/oswald-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
    @font-face { font-family: "WP Sans"; src: url("/warningcenter/public/assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: "WP Mono"; src: url("/warningcenter/public/assets/fonts/ibm-plex-mono-600-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
    :root { --bg: #070a10; --panel: #0d121b; --panel-2: #121926; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.15); --text: #eef2f8; --muted: #8e99ab; --dim: #5d6879; --c: #e40000; --ink: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "WP Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
    .top a.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .top img { width: 34px; height: 34px; border-radius: 8px; }
    .top b { font-family: "WP Display"; font-size: 20px; letter-spacing: .04em; }
    .top .back { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: none; }
    .hero { background: var(--c); color: var(--ink); }
    .hero .in { max-width: 1280px; margin: 0 auto; padding: 22px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .hero .tag { padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.25); font-family: "WP Mono"; font-size: 12px; letter-spacing: .1em; }
    .hero h1 { margin: 0; font-family: "WP Display"; font-size: clamp(30px, 4.6vw, 54px); line-height: 1; text-transform: uppercase; flex: 1 1 520px; }
    .hero p { margin: 6px 0 0; font-size: 16px; font-weight: 700; }
    .hero .exp { text-align: right; }
    .hero .exp span { display: block; font-family: "WP Mono"; font-size: 11px; letter-spacing: .12em; opacity: .85; }
    .hero .exp b { font-family: "WP Display"; font-size: 34px; }
    main { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; }
    .card img { display: block; width: 100%; border-radius: 14px; border: 1px solid var(--line-2); background: #000; }
    .pending { aspect-ratio: 16/9; border-radius: 14px; border: 1px dashed var(--line-2); display: grid; place-items: center; color: var(--muted); }
    #map { height: 420px; border-radius: 14px; border: 1px solid var(--line-2); overflow: hidden; margin-top: 20px; }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .box { padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
    .box h3 { margin: 0 0 8px; font-family: "WP Mono"; font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 600; }
    .box p { margin: 0; line-height: 1.55; font-size: 15px; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .facts div span { display: block; font-family: "WP Mono"; font-size: 10px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
    .facts div b { font-family: "WP Display"; font-size: 24px; }
    .facts div small { display: block; font-family: "WP Mono"; font-size: 10px; color: var(--dim); }
    .video video { display: block; width: 100%; max-height: 640px; border-radius: 12px; background: #000; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); color: #fff; font: inherit; font-weight: 700; font-size: 13px; text-decoration: none; cursor: pointer; }
    .btn.red { background: #ff2d55; border-color: #ff2d55; }
    .btn[disabled] { opacity: .55; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .error { max-width: 640px; margin: 80px auto; text-align: center; color: var(--muted); padding: 0 20px; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } .hero .exp { text-align: left; } #map { height: 320px; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/warningcenter/"><img src="/warningcenter/public/assets/wp-logo.png" alt=""><b>WARNING CENTER</b></a>
    <a class="back" href="/warningcenter/">← All live alerts</a>
  </header>
  <div id="root"><div class="error">Loading alert…</div></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
  (() => {
    const BASE = location.pathname.startsWith('/warningcenter') ? '/warningcenter' : '';
    const key = new URL(location.href).searchParams.get('key') || '';
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const asset = (p) => (p ? BASE + p : '');
    const fmt = (n) => Number(n).toLocaleString('en-US');
    const getJson = async (path, options) => {
      const response = await fetch(BASE + path, { headers: { Accept: 'application/json' }, ...options });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || response.statusText);
      return body;
    };
    const ink = (hex) => {
      const v = String(hex || '#000').replace('#', '');
      const [r, g, b] = [0, 2, 4].map((o) => parseInt(v.slice(o, o + 2), 16) || 0);
      return 0.299 * r + 0.587 * g + 0.114 * b > 170 ? '#0b0d12' : '#ffffff';
    };
    const until = (iso) => {
      const ms = Date.parse(iso || '') - Date.now();
      if (!Number.isFinite(ms)) return '';
      if (ms <= 0) return 'expired';
      const m = Math.round(ms / 60000);
      return m < 60 ? m + ' min left' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm left';
    };
    let pollTimer;

    const videoBox = (a) => {
      if (a.short) {
        return '<div class="box video"><h3>WARNING VIDEO · 15 SEC</h3><video src="' + esc(asset(a.short.path)) + '" poster="' + esc(asset(a.short.posterPath)) + '" controls playsinline loop preload="metadata"></video>'
          + '<div class="btns"><a class="btn" download href="' + esc(asset(a.short.path)) + '">Download video</a></div></div>';
      }
      if (!a.geometry || ['outlooks', 'forecasts', 'discussions'].includes(a.group)) return '';
      const busy = a.shortStatus === 'queued' || a.shortStatus === 'rendering';
      return '<div class="box video"><h3>WARNING VIDEO</h3><p class="muted" id="short-msg">' + (busy ? 'Rendering with the latest radar loop… usually 1–3 minutes.' : 'Make a 15-second vertical radar video of this warning for Shorts, Reels and TikTok.') + '</p>'
        + '<div class="btns"><button class="btn red" id="make" ' + (busy ? 'disabled' : '') + '>' + (busy ? 'Rendering…' : '🎬 Make a video') + '</button></div></div>';
    };

    const render = (a) => {
      document.title = a.headline + ' · WeatherPower';
      document.documentElement.style.setProperty('--c', a.color || '#e40000');
      document.documentElement.style.setProperty('--ink', ink(a.color));
      const hazards = (a.hazards || []).map((h) => '<div><span>' + esc(h.label) + '</span><b>' + esc(h.value) + '</b></div>').join('');
      document.getElementById('root').innerHTML =
        '<section class="hero"><div class="in"><span class="tag">' + esc(a.status) + (a.threat ? ' · ' + esc(a.threat) : '') + '</span>'
        + '<div style="flex:1 1 520px"><h1>' + esc(a.headline) + '</h1><p>' + esc(a.area) + '</p></div>'
        + '<div class="exp"><span>' + (a.group === 'warnings' ? 'EXPIRES' : 'VALID UNTIL') + '</span><b>' + esc(a.times?.expires || '--') + '</b><span>' + esc(until(a.expiresAt)) + '</span></div></div></section>'
        + '<main><div><div class="card">' + (a.card ? '<img src="' + esc(asset(a.card.path)) + '" alt="' + esc(a.headline) + ' card">' : '<div class="pending">Card is rendering…</div>') + '</div><div id="map"></div></div>'
        + '<div class="side">' + videoBox(a)
        + '<div class="box"><div class="facts">'
        + '<div><span>Issued</span><b>' + esc(a.times?.issued || '--') + '</b><small>' + esc(a.times?.expiresDay || '') + '</small></div>'
        + (a.people ? '<div><span>People in area</span><b>' + fmt(a.people) + '</b><small>' + (a.homes ? fmt(a.homes) + ' homes · ' : '') + '2020 Census</small></div>' : '')
        + hazards + '</div></div>'
        + (a.whatToDo ? '<div class="box"><h3>WHAT TO DO</h3><p>' + esc(a.whatToDo) + '</p></div>' : '')
        + (a.sourceText ? '<div class="box"><h3>SOURCE</h3><p class="muted">' + esc(a.sourceText) + '</p></div>' : '')
        + '<div class="box"><h3>SHARE</h3><div class="btns"><button class="btn" id="copy">Copy link</button>' + (a.card ? '<a class="btn" download href="' + esc(asset(a.card.path)) + '">Download card</a>' : '') + '</div>'
        + '<p class="muted" style="margin-top:10px">Issued by NWS ' + esc(a.office || '') + '. WeatherPower graphics are informational — always follow official NWS warnings and local officials.</p></div>'
        + '</div></main>';
      drawMap(a);
    };

    const drawMap = async (a) => {
      if (!a.geometry || !window.maplibregl) { document.getElementById('map').remove(); return; }
      const [config, radar] = await Promise.all([getJson('/api/v3/config'), getJson('/api/v3/radar').catch(() => null)]);
      const pts = [];
      const walk = (c) => { if (!Array.isArray(c)) return; if (typeof c[0] === 'number') pts.push(c); else c.forEach(walk); };
      walk(a.geometry.coordinates);
      const xs = pts.map((p) => p[0]); const ys = pts.map((p) => p[1]);
      const map = new maplibregl.Map({ container: 'map', style: config.satelliteStyle, bounds: [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]], fitBoundsOptions: { padding: 50, maxZoom: 10 }, attributionControl: { compact: true } });
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
      map.on('load', () => {
        const before = map.getStyle().layers.find((l) => l.type === 'symbol')?.id;
        const latest = radar?.reflectivity?.at(-1);
        if (latest) {
          map.addSource('radar', { type: 'raster', tiles: [latest.tiles], tileSize: 256 });
          map.addLayer({ id: 'radar', type: 'raster', source: 'radar', paint: { 'raster-opacity': .75 } }, before);
        }
        map.addSource('poly', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: a.geometry } });
        map.addLayer({ id: 'fill', type: 'fill', source: 'poly', paint: { 'fill-color': a.accent || a.color, 'fill-opacity': .14 } }, before);
        map.addLayer({ id: 'shadow', type: 'line', source: 'poly', paint: { 'line-color': '#000', 'line-width': 9, 'line-opacity': .6 } });
        map.addLayer({ id: 'white', type: 'line', source: 'poly', paint: { 'line-color': '#fff', 'line-width': 6 } });
        map.addLayer({ id: 'line', type: 'line', source: 'poly', paint: { 'line-color': a.accent || a.color, 'line-width': 3.5 } });
      });
    };

    const poll = () => {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(async () => {
        try {
          const status = await getJson('/api/v3/short?key=' + encodeURIComponent(key));
          if (status.status === 'ready' && status.short) { load(); return; }
          if (status.status === 'error') { document.getElementById('short-msg').textContent = 'Render failed — try again later.'; return; }
        } catch {}
        poll();
      }, 8000);
    };

    const load = async () => {
      if (!key) { document.getElementById('root').innerHTML = '<div class="error">No alert selected. <a href="/warningcenter/">Open the Warning Center</a>.</div>'; return; }
      try {
        const alert = await getJson('/api/v3/alert?key=' + encodeURIComponent(key));
        render(alert);
        if (alert.shortStatus === 'queued' || alert.shortStatus === 'rendering') poll();
      } catch (error) {
        document.getElementById('root').innerHTML = '<div class="error">This alert has expired or was cancelled.<br><br><a href="/warningcenter/">See all live alerts →</a></div>';
      }
    };

    document.addEventListener('click', async (e) => {
      if (e.target.closest('#copy')) {
        navigator.clipboard?.writeText(location.href);
        e.target.textContent = 'Copied';
      }
      const make = e.target.closest('#make');
      if (make) {
        make.disabled = true;
        make.textContent = 'Queuing…';
        try {
          const result = await getJson('/api/v3/short/request?key=' + encodeURIComponent(key), { method: 'POST' });
          if (result.ready) { load(); return; }
          if (!result.queued) { document.getElementById('short-msg').textContent = result.reason || 'Could not queue video.'; make.disabled = false; make.textContent = '🎬 Make a video'; return; }
          make.textContent = 'Rendering…';
          document.getElementById('short-msg').textContent = 'Rendering with the latest radar loop… usually 1–3 minutes.';
          poll();
        } catch (error) {
          document.getElementById('short-msg').textContent = error.message;
          make.disabled = false;
          make.textContent = '🎬 Make a video';
        }
      }
    });
    load();
  })();
  </script>
</body>
</html>
